name: Phone app chrome
on:
  pull_request:
    paths:
      - 'src/components/pwa/**'
      - 'src/components/captain/CaptainAppHeader.tsx'
      - 'src/components/captain/CaptainPwaBottomNav.tsx'
      - 'src/components/captain/CaptainAppScreens.module.css'
      - 'src/components/player/PlayerPwaPortalHeader.tsx'
      - 'src/components/player/PlayerTeamNav.tsx'
      - 'src/components/referee/**'
      - 'src/app/mobile.css'
      - 'src/app/globals.css'
      - 'src/app/captain/team/**/layout.tsx'
      - 'src/app/player/team/**/layout.tsx'
      - 'tests/phone-app-chrome/**'
      - '.github/workflows/phone-app-chrome.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phone-app-chrome-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/phone_chrome_test
      NEXTAUTH_SECRET: isolated-phone-chrome-only
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      RESEND_API_KEY: re_nonfunctional_ci_placeholder
      EMAIL_FROM: SIXFL <noreply@example.invalid>
      EMAIL_REPLY_DOMAIN: example.invalid
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Native shared positioning and role contracts
        run: node --test tests/phone-app-chrome/contract.test.cjs tests/captain-app/behaviour.test.cjs tests/captain-app/chat.test.cjs tests/player-pwa-dashboard.test.cjs tests/referee-app-home/contract.test.cjs
      - run: npm run prebuild
      - run: npx prisma generate
      - name: Prepared-source contracts and existing safeguards
        run: |
          node --test tests/phone-app-chrome/contract.test.cjs tests/captain-app/behaviour.test.cjs tests/captain-app/chat.test.cjs tests/player-pwa-dashboard.test.cjs tests/referee-app-home/contract.test.cjs
          node scripts/check-critical-feature-contracts.mjs
          npx tsc --noEmit
      - run: npx next build
      - name: Isolated Chromium and WebKit tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/phone-chrome-browser" --no-save --package-lock=false playwright@1.55.0 esbuild@0.27.4
          node "$RUNNER_TEMP/phone-chrome-browser/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Real hydrated chrome scrolling in phone modes and PC iframe
        shell: bash
        run: |
          mkdir -p artifacts/phone-app-chrome
          set -o pipefail
          NODE_PATH="$RUNNER_TEMP/phone-chrome-browser/node_modules" node tests/phone-app-chrome/browser.cjs 2>&1 | tee artifacts/phone-app-chrome/browser-output.log
      - name: Retain prepared product source and role inventory
        if: always() && steps.checkout.outcome == 'success'
        run: |
          mkdir -p artifacts/phone-app-chrome
          tar -czf artifacts/phone-app-chrome/prepared-source.tgz src/components/pwa src/components/captain src/components/player src/components/referee tests/phone-app-chrome
          git diff -- src > artifacts/phone-app-chrome/preparation.diff
          git grep -n -E 'PinnedAppChrome|captain-app-header|player-pwa-portal-header|RefereeAppShell|RefereeAppHome|PwaAppFrame|sm:hidden' -- src scripts tests > artifacts/phone-app-chrome/source-inventory.txt
      - uses: actions/upload-artifact@v4
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: phone-app-chrome-${{ github.sha }}
          path: artifacts/phone-app-chrome/
          retention-days: 7
          if-no-files-found: error
