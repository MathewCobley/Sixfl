name: SMS native type correction
on:
  push:
    branches: [fix/admin-sms-reply-reliable-submit]
permissions:
  contents: write
jobs:
  correction:
    if: github.repository == 'MathewCobley/Sixfl' && github.ref == 'refs/heads/fix/admin-sms-reply-reliable-submit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-sms-reply-reliable-submit
          fetch-depth: 1
      - name: Apply native phone nullability correction only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/admin-sms-reply-reliable-submit'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/admin/messages/AdminMessageThread.tsx')
          s=p.read_text(); before='const replyPhoneLabel = formatPhone(replyPhoneRaw);'
          assert s.count(before)==1
          p.write_text(s.replace(before,'const replyPhoneLabel = formatPhone(replyPhoneRaw || null);'))
          PY
          git diff --check
          git diff
          git add src/components/admin/messages/AdminMessageThread.tsx
          git config user.name 'SIXFL SMS repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Handle absent SMS phone in the native conversation header'
          git push origin HEAD:refs/heads/fix/admin-sms-reply-reliable-submit
          git rev-parse HEAD
