name: Veo isolated development source
on:
  push:
    branches: [feature/veo-fixture-confirmation-options]
    paths: [.github/workflows/veo-development-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sixfl_veo_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run prebuild && npx prisma generate
      - name: Package generated client and schema only
        run: |
          mkdir -p /tmp/veo-development-client
          tar -czf /tmp/veo-development-client/client.tgz node_modules/.prisma node_modules/@prisma/engines prisma/schema.prisma
      - uses: actions/upload-artifact@v4
        with:
          name: veo-development-client
          path: /tmp/veo-development-client/
          retention-days: 1
          compression-level: 0
