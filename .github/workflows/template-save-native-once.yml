name: Apply reviewed native template save changes
on:
  push:
    branches: [fix/template-save-json-20260906]
    paths: ['.github/workflows/template-save-native-once.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'MathewCobley/Sixfl' && github.ref == 'refs/heads/fix/template-save-json-20260906'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original and resulting source before applying the reviewed changes
        run: |
          python3 - <<'PY'
          import json, pathlib, hashlib, subprocess
          changes = json.loads(r'''[{"path":"src/components/admin/email-templates/EmailTemplateForm.tsx","before":"1e79fcf92da66098001294ef11d08243ad4cfc4afba6c10a5b55daee0db36e37","after":"1d6ad80bacb5b26b8bb52fe978361a5b6029b5c49780a7f6c83a586076a2254c","edits":[[8,9,""],[14,15,"import { useTemplateSave, TemplateSaveControls } from \"@/components/admin/templates/useTemplateSave\";\n"],[18,26,""],[56,57,"  templateType: \"campaign\" | \"system\";\n"],[60,67,""],[208,238,""],[328,329,"  templateType,\n"],[331,342,"  const save = useTemplateSave({ mode, templateType, channel: \"EMAIL\" });\n  const { state } = save;\n"],[361,362,""],[374,383,""],[563,564,"    <form onSubmit={save.onSubmit} className=\"space-y-8\">\n"],[574,574,"          <fieldset disabled={save.pending || Boolean(save.savedUrl) || Boolean(state.needsCheck)} className=\"min-w-0 space-y-8\">\n"],[874,890,"          </fieldset>\n          <TemplateSaveControls save={save} mode={mode} />\n"]]},{"path":"src/components/admin/sms-templates/SmsTemplateForm.tsx","before":"6c3b72826a5b2bbcfe98d185531c4755635d887554b7e5f2c7d83d0c14bf91e6","after":"65de7cadf77191d5f8c7a26c4668f0806d3eb8ea7965cb1e00c63d3e2dbfb36a","edits":[[6,8,"import { useEffect, useMemo, useState } from \"react\";\nimport { useTemplateSave, TemplateSaveControls } from \"@/components/admin/templates/useTemplateSave\";\n"],[10,17,""],[41,42,"  templateType: \"campaign\" | \"system\";\n"],[45,52,""],[169,189,""],[211,212,"  templateType,\n"],[214,223,"  const save = useTemplateSave({ mode, templateType, channel: \"SMS\" });\n  const { state } = save;\n"],[288,289,"    <form onSubmit={save.onSubmit} className=\"space-y-8\">\n"],[297,297,"          <fieldset disabled={save.pending || Boolean(save.savedUrl) || Boolean(state.needsCheck)} className=\"min-w-0 space-y-8\">\n"],[437,449,"          </fieldset>\n          <TemplateSaveControls save={save} mode={mode} />\n"]]},{"path":"src/app/(admin)/admin/templates/new/page.tsx","before":"ecf41aefe082a6fb4a03a763a933483e09e4c6e0b677c75a16d9c376575aa08d","after":"508f8cab7b52ab30808dafa71484760f23d2f0d0ab8970e7653d197cbd109cab","edits":[[9,12,""],[95,96,"              <EmailTemplateForm mode=\"create\" templateType=\"system\" />\n"],[97,98,"          ) : <SmsTemplateForm mode=\"create\" templateType=\"system\" />\n"],[101,102,"            <EmailTemplateForm mode=\"create\" templateType=\"campaign\" />\n"],[104,105,"          <SmsTemplateForm mode=\"create\" templateType=\"campaign\" />\n"]]},{"path":"src/app/(admin)/admin/templates/[id]/page.tsx","before":"1cb46a6faef98121c7e0c46e47a0ac35f79b4bd64d7623b4b9dd1c71c7a36ad8","after":"ef3e5f93487fb0903765a28607cacf3a3d26345f13b4c898ad2bb578517f40a3","edits":[[15,21,""],[26,26,"  searchParams: Promise<{ created?: string }>;\n"],[105,106,"export default async function EditTemplatePage({ params, searchParams }: PageProps) {\n"],[108,108,"  const createdNotice = (await searchParams).created === \"1\" ? (\n    <p role=\"status\" className=\"rounded-xl border border-emerald-500/25 bg-emerald-500/10 p-4 text-emerald-200\">Template saved successfully.</p>\n  ) : null;\n"],[115,115,"          {createdNotice}\n"],[123,124,"          <EmailTemplateForm mode=\"edit\" templateType=\"campaign\" initialValues={{ id: emailTemplate.id, key: emailTemplate.key, name: emailTemplate.name, description: emailTemplate.description ?? \"\", audience: emailTemplate.audience, interestType: emailTemplate.interestType ?? undefined, subject: emailTemplate.subject, body: emailTemplate.body, ctaLabel: emailTemplate.ctaLabel ?? \"\", ctaUrlKey: getEmailCtaUrlKey(emailTemplate.ctaUrlKey), isActive: emailTemplate.isActive }} />\n"],[142,142,"          {createdNotice}\n"],[150,151,"          <EmailTemplateForm mode=\"edit\" templateType=\"system\" initialValues={{ id: notificationTemplate.id, key: notificationTemplate.key, name: notificationTemplate.name, description: notificationTemplate.description ?? \"\", audience: notificationTemplateAudience, subject: notificationTemplate.subject ?? \"\", body: notificationTemplate.body, ctaLabel: notificationTemplate.ctaLabel ?? \"\", ctaUrlKey: getEmailCtaUrlKey(notificationTemplate.ctaUrlKey), isActive: notificationTemplate.isActive }} />\n"],[167,167,"          {createdNotice}\n"],[179,180,"          templateType={isSystemSms ? \"system\" : \"campaign\"}\n"]]},{"path":"src/app/(admin)/admin/sms-templates/actions.ts","before":"0fd43747e5b44a541856fbb80d652a0b579c691749ecfd4caadde009568aea13","after":"86268959739bc7a497e2632cbbecb698e3fc1cf04a3e7d52f1d112e11d71f9be","edits":[[12,13,""],[22,22,"  redirectTo?: string;\n"],[186,187,"  return { ok: true, success: true, message: \"Template saved successfully.\", redirectTo: `/admin/templates/${created.id}?created=1` };\n"]]}]''')
          assert len(changes) == 5
          outputs = []
          for change in changes:
              path = pathlib.Path(change['path'])
              assert str(path).startswith(('src/app/(admin)/admin/', 'src/components/admin/')) and '..' not in path.parts
              old = path.read_bytes()
              assert hashlib.sha256(old).hexdigest() == change['before'], f'Original source changed: {path}'
              lines = old.decode().splitlines(keepends=True)
              for start,end,replacement in reversed(change['edits']):
                  lines[start:end] = replacement.splitlines(keepends=True)
              new = ''.join(lines).encode()
              assert hashlib.sha256(new).hexdigest() == change['after'], f'Result mismatch: {path}'
              outputs.append((path,new))
          for path,data in outputs:
              path.write_bytes(data)
              print('Verified native source:', path, hashlib.sha256(data).hexdigest())
          subprocess.run(['git','add','--',*[str(p) for p,_ in outputs]],check=True)
          PY
          node scripts/check-email-template-create-completion.mjs
          git diff --cached --check
      - name: Commit native code only to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use bounded JSON saves in all four template editors'
          git push origin HEAD:fix/template-save-json-20260906
