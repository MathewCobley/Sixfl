name: Admin email resend
on:
  pull_request:
    paths:
      - "src/app/(admin)/admin/messages/**"
      - "src/app/(admin)/admin/communications/**"
      - "src/components/admin/communications/**"
      - "src/lib/notifications/**"
      - "src/lib/email/**"
      - "tests/admin-email-resend/**"
      - ".github/workflows/admin-email-resend.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin-email-resend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://invalid:invalid@127.0.0.1:65432/invalid?connect_timeout=1
      NEXTAUTH_SECRET: admin-email-resend-ci-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      EMAIL_REPLY_DOMAIN: replies.example.invalid
      RESEND_API_KEY: re_ci_not_real
      STRIPE_SECRET_KEY: sk_test_ci_not_real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Native resend safety contracts
        run: node --test tests/admin-email-resend/*.test.cjs
      - run: npm run prebuild && npx prisma generate
      - name: Prepared resend safety contracts
        run: node --test tests/admin-email-resend/*.test.cjs
      - name: Full TypeScript and production build
        run: npx tsc --noEmit && npx next build
