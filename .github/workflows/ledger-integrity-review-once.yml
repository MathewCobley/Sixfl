name: Apply player ledger integrity review once
on:
  push:
    branches: [feat/player-ledger-small-payments]
    paths: ['.github/workflows/ledger-integrity-review-once.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/player-ledger-small-payments
      - name: Apply hash-checked product source changes only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,subprocess
          from pathlib import Path
          obj=json.loads(subprocess.check_output(['gh','api','repos/MathewCobley/Sixfl/git/blobs/8aa0ed81f1e450501df37d2e1f97557b50043b0b']))
          edits=json.loads(base64.b64decode(obj['content'])); assert len(edits)==6
          for item in edits:
            p=Path(item['path']);assert '..' not in p.parts and not p.is_absolute()
            if '.github' in p.parts: continue
            before=p.read_bytes();assert hashlib.sha256(before).hexdigest()==item['before'],str(p)
            lines=before.decode().splitlines(keepends=True)
            for start,end,text in reversed(item['edits']):lines[start:end]=[text]
            after=''.join(lines).encode();assert hashlib.sha256(after).hexdigest()==item['after'],str(p)
            p.write_bytes(after);print('Verified native file:',p)
          PY
          git config user.name 'SIXFL source integration'
          git config user.email '262667783+MathewCobley@users.noreply.github.com'
          git add src scripts prisma tests
          git commit -m 'Capture only committed fee mutations and preserve temporary-player balances'
          git push origin HEAD:feat/player-ledger-small-payments
