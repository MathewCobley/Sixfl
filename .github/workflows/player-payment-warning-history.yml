name: Player payment warning history
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: warning-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      DATABASE_URL: postgresql://invalid:invalid@127.0.0.1:65432/unused
      NEXTAUTH_SECRET: history-test-only
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      RESEND_API_KEY: re_history_ci_placeholder
      EMAIL_FROM: SIXFL <noreply@example.invalid>
      EMAIL_REPLY_DOMAIN: example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prebuild
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: node scripts/check-critical-feature-contracts.mjs
      - run: node --test tests/player-payment-warning-history.test.cjs | tee warning-history-tests.log
      - name: Prove the original missing-card regression is detected
        run: |
          cp 'src/app/(admin)/admin/payments/page.tsx' /tmp/warning-history-page.tsx
          trap 'cp /tmp/warning-history-page.tsx "src/app/(admin)/admin/payments/page.tsx"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/(admin)/admin/payments/page.tsx')
          s=p.read_text()
          anchor='<PlayerPaymentWarningStatus feeId={fee.id} warning={latestPlayerWarnings.get(fee.id)} showHistoryLink />'
          assert s.count(anchor)==1
          p.write_text(s.replace(anchor,''))
          PY
          if node --test tests/player-payment-warning-history.test.cjs > warning-history-negative.log 2>&1; then
            echo 'Missing warning status on the main list was not detected'; exit 1
          fi
          grep -E 'fail' warning-history-negative.log
      - run: npx next build
      - name: Exercise actual history and refresh controls at mobile and desktop widths
        run: |
          npm install --prefix /tmp/history-browser --no-save --package-lock=false playwright@1.55.0
          /tmp/history-browser/node_modules/.bin/playwright install --with-deps chromium
          WARNING_PLAYWRIGHT_MODULE=/tmp/history-browser/node_modules/playwright node --test tests/player-payment-warning-history.browser.cjs
      - name: Verify shared reads, preserved chases and absence of integration machinery
        run: |
          test ! -f .github/workflows/integrate-warning-history-once.yml
          git grep -nE 'getLatestPlayerPaymentWarnings|getPlayerPaymentWarningHistory|PlayerPaymentWarningStatus|Chase player|Send payment warning' -- src > warning-history-inventory.txt
          git diff --exit-code -- src/lib/payments/player-payment-warning-history.ts src/components/admin/payments/PlayerPaymentWarningStatus.tsx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warning-history-verification
          path: |
            warning-history-tests.log
            warning-history-negative.log
            warning-history-inventory.txt
            artifacts/warning-history/
          retention-days: 14
