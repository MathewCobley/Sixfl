name: Complete SMS inbox dispatch selection
on:
  push:
    branches: [fix/sms-receipt-recovery]
    paths: [.github/workflows/author-sms-inbox-state.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/sms-receipt-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Complete real dispatch state and pin recovery to the current attempt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def change(path,old,new):
            p=Path(path);s=p.read_text()
            if new in s: return
            assert s.count(old)==1,(path,old[:80])
            p.write_text(s.replace(old,new,1))
          change('src/app/(admin)/admin/messages/page.tsx',
            '                  id: true,\n                  metadata: true,\n                  template: {',
            '                  id: true,\n                  status: true,\n                  failureReason: true,\n                  scheduledFor: true,\n                  sentAt: true,\n                  metadata: true,\n                  template: {')
          change('src/components/admin/messages/AdminSmsReplyForm.tsx',
            'const requestId = uncertain ? draftRef.current?.requestId : recordRequestId || draftRef.current?.requestId;',
            'const requestId = draftRef.current?.attempted ? draftRef.current.requestId : recordRequestId || draftRef.current?.requestId;')
          change('tests/admin-sms-reply.browser.cjs',
            "      mode = 'save'; await page.getByRole('button', { name: 'Retry this reply safely' }).click();",
            "      // A second lookup must remain on the current missing attempt, not fall back to an older saved reply.\n      const lookup = page.waitForRequest(req => req.method()==='GET' && new URL(req.url()).pathname===endpoint);\n      await page.getByRole('button',{name:'Check status',exact:true}).click();\n      assert.equal(new URL((await lookup).url()).searchParams.get('requestId'),retryKey);\n      mode = 'save'; await page.getByRole('button', { name: 'Retry this reply safely' }).click();")
          PY
          git diff --check
          git diff
          test "$GITHUB_REF" = refs/heads/fix/sms-receipt-recovery
          git config user.name 'SIXFL maintenance'
          git config user.email 'noreply@users.noreply.github.com'
          git add 'src/app/(admin)/admin/messages/page.tsx' src/components/admin/messages/AdminSmsReplyForm.tsx tests/admin-sms-reply.browser.cjs
          git commit -m 'Keep SMS status lookup on the current attempt and select real dispatch state for both inboxes'
          git push origin HEAD:refs/heads/fix/sms-receipt-recovery
