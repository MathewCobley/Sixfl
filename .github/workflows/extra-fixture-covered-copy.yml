name: Extra fixture covered wording
on:
  pull_request:
    paths:
      - 'src/lib/fixtures/last-minute-replacement*'
      - 'src/lib/notifications/**'
      - 'src/lib/communications/**'
      - 'prisma/migrations/20260906222500_neutral_extra_fixture_covered_templates/**'
      - 'tests/extra-fixture-covered-copy.test.cjs'
      - 'scripts/check-last-minute-replacement-resolution.mjs'
      - '.github/workflows/extra-fixture-covered-copy.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/fixtures/last-minute-replacement*'
      - 'prisma/migrations/20260906222500_neutral_extra_fixture_covered_templates/**'
      - 'tests/extra-fixture-covered-copy.test.cjs'
      - '.github/workflows/extra-fixture-covered-copy.yml'
permissions:
  contents: read
jobs:
  neutral-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: covered_test_only
          POSTGRES_DB: sixfl_covered_copy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sixfl_covered_copy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:covered_test_only@localhost:5432/sixfl_covered_copy_test
      COVERED_COPY_TEST_DATABASE_URL: postgresql://postgres:covered_test_only@localhost:5432/sixfl_covered_copy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prebuild
      - run: npx prisma generate
      - name: Verify neutral email/SMS, unchanged recipients and editable migration
        run: node --test tests/extra-fixture-covered-copy.test.cjs
      - name: Retain existing fixture-resolution and critical contracts
        run: |
          node scripts/check-last-minute-replacement-resolution.mjs
          node scripts/check-critical-feature-contracts.mjs
          npx tsc --noEmit
      - name: Verify prepared send paths have no old closure copy or temporary tools
        run: |
          if git grep -n -F 'Thanks for being available' -- src; then exit 1; fi
          git grep -n -E 'last-minute-extra-fixture-covered|reconcileLastMinuteReplacement|reconcilePendingLastMinuteReplacements' -- src
          test ! -f .github/workflows/inspect-covered-copy-once.yml
          test ! -f .github/workflows/integrate-covered-copy-once.yml
