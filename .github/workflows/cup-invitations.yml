name: Cup invitations and reporting
on:
  pull_request:
    paths:
      - "src/app/(admin)/admin/cups/**"
      - "src/app/api/admin/cups/**"
      - "src/lib/cups/**"
      - "src/components/cups/**"
      - "src/components/admin/messages/**"
      - "src/app/(admin)/admin/messages/**"
      - "scripts/check-cup-foundation.mjs"
      - "scripts/check-native-cup-fixture-source.mjs"
      - "scripts/apply-team-message-template-scope.cjs"
      - "tests/cup-invitations/**"
      - "tests/native-cup-fixtures.test.cjs"
      - "tests/email-preview-isolation.test.cjs"
      - "prisma/migrations/20260911233000_inter_league_cup_foundation/**"
      - "prisma/migrations/20260913001000_cup_invitations/**"
      - ".github/workflows/cup-invitations.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cup-invitations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sixfl_cup_invitation_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sixfl_cup_invitation_test
      CUP_TEST_DATABASE: '1'
      NEXTAUTH_SECRET: isolated-cup-ci-not-a-live-secret
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      EMAIL_REPLY_DOMAIN: replies.example.invalid
      RESEND_API_KEY: re_isolated_not_real
      STRIPE_SECRET_KEY: sk_test_isolated_not_real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Native source and safe response contracts
        run: |
          node --test tests/cup-invitations/*.test.cjs
          node scripts/check-cup-foundation.mjs
          node scripts/check-native-cup-fixture-source.mjs --snapshot "$RUNNER_TEMP/cup-native.json"
      - run: npm run prebuild && npx prisma generate
      - name: Prepared source and shared regression contracts
        run: |
          node scripts/check-native-cup-fixture-source.mjs --verify "$RUNNER_TEMP/cup-native.json"
          node scripts/check-critical-feature-contracts.mjs
          node --test tests/cup-invitations/*.test.cjs tests/native-cup-fixtures.test.cjs tests/email-preview-isolation.test.cjs
      - name: Disposable schema and real additive migrations
        run: |
          npx prisma db push --skip-generate
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f prisma/migrations/20260702182000_season_team_entries/migration.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f prisma/migrations/20260725193000_fixture_placeholder_teams/migration.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f prisma/migrations/20260911233000_inter_league_cup_foundation/migration.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f prisma/migrations/20260913001000_cup_invitations/migration.sql
      - name: Real database lifecycle, templates, privacy, duplication and rollback
        run: npx tsx tests/cup-invitations/database.ts
      - name: Actual admin response action with PostgreSQL, stale edits and audit rollback
        run: CUP_ADMIN_RESPONSE_DATABASE=1 node --test tests/cup-invitations/admin-response.test.cjs
      - name: Full prepared TypeScript and production build
        run: npx tsc --noEmit && npx next build
      - name: Install isolated browser
        run: npm install --prefix /tmp/cup-browser --no-package-lock playwright@1.55.0 && /tmp/cup-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Actual mobile and desktop cup controls
        run: |
          CUP_PLAYWRIGHT=/tmp/cup-browser/node_modules/playwright node tests/cup-invitations/browser.cjs
          CUP_PLAYWRIGHT=/tmp/cup-browser/node_modules/playwright node tests/cup-invitations/admin-response-browser.cjs
      - name: Preserve final prepared response sources for review
        if: always()
        run: |
          mkdir -p artifacts/cup-invitations/prepared
          cp 'src/app/(admin)/admin/cups/[id]/invitation-actions.ts' artifacts/cup-invitations/prepared/
          cp 'src/app/(admin)/admin/cups/[id]/invitations/page.tsx' artifacts/cup-invitations/prepared/
          cp src/components/cups/CupResponseEditor.tsx artifacts/cup-invitations/prepared/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cup-invitation-evidence
          path: artifacts/cup-invitations/
          retention-days: 7
