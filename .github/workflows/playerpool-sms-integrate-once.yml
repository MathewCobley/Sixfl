name: Integrate PlayerPool SMS native callsites
on:
  push:
    branches: [feat/playerpool-sms-chase-history]
    paths: ['.github/workflows/playerpool-sms-integrate-once.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/playerpool-sms-chase-history
      - name: Apply the two reviewed native integrations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def patch(path, old, new):
              p=Path(path); s=p.read_text()
              assert s.count(old)==1, f'Expected one anchor in {path}'
              p.write_text(s.replace(old,new,1))
          page='src/app/(admin)/admin/player-pool/page.tsx'
          patch(page, 'import Link from "next/link";', 'import Link from "next/link";\nimport PlayerPoolSmsChaseHistory from "@/components/admin/player-pool/PlayerPoolSmsChaseHistory";\nimport { getPlayerPoolProfileSmsHistory } from "@/lib/player-pool/profile-sms-reminders";')
          patch(page, '  const totalAwaitingProfile = counts.awaiting + awaitingProfileLeads.length;', '  const smsHistory = await getPlayerPoolProfileSmsHistory(visibleProfiles.map((profile) => profile.id));\n\n  const totalAwaitingProfile = counts.awaiting + awaitingProfileLeads.length;')
          patch(page, '                <div className="mt-4 grid gap-2 sm:grid-cols-4">', '                <PlayerPoolSmsChaseHistory profile={profile} history={smsHistory.get(profile.id)!} />\n\n                <div className="mt-4 grid gap-2 sm:grid-cols-4">')
          processor='src/lib/notifications/processor.ts'
          patch(processor, 'import { prisma } from "@/lib/prisma";', 'import { prisma } from "@/lib/prisma";\nimport { getPlayerPoolProfileSmsDeliveryBlock } from "@/lib/player-pool/profile-sms-reminders";')
          patch(processor, '        const sendResult = await sendSmsWithTwilio({ to: dispatch.recipient.phone, body: dispatch.bodyText });', '''        const profileSmsBlock = await getPlayerPoolProfileSmsDeliveryBlock(dispatch);
                  if (profileSmsBlock) {
                    await markNotificationDispatchCancelled(dispatch.id, profileSmsBlock);
                    result.skipped += 1;
                    result.items.push({ dispatchId: dispatch.id, status: "skipped", channel: dispatch.channel, message: profileSmsBlock });
                    continue;
                  }
                  const sendResult = await sendSmsWithTwilio({ to: dispatch.recipient.phone, body: dispatch.bodyText });''')
          PY
          git diff --check
          git diff --stat
          git config user.name 'MathewCobley'
          git config user.email '262667783+MathewCobley@users.noreply.github.com'
          git add 'src/app/(admin)/admin/player-pool/page.tsx' src/lib/notifications/processor.ts
          git commit -m 'Render per-player SMS chase history and cancel stale chases before delivery'
          git push origin HEAD:feat/playerpool-sms-chase-history
