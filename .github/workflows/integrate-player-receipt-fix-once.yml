name: Integrate reviewed player receipt fix once
on:
  push:
    branches: [fix/player-partial-payment-integrity]
    paths: ['.github/workflows/integrate-player-receipt-fix-once.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-partial-payment-integrity
      - name: Apply exact hash-checked owning-source changes only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,subprocess
          from pathlib import Path
          parts=[]
          for sha in ['a877d443b89c89d1c65090496b02eb1f0d516d6d','b072e6534167255fb1aec9173e7450bff0b81352','06d24d14db992f2947e4be8ff957cb3b72b70524']:
            obj=json.loads(subprocess.check_output(['gh','api',f'repos/MathewCobley/Sixfl/git/blobs/{sha}']))
            parts.append(base64.b64decode(obj['content']).decode())
          encoded=''.join(parts).replace('YPS3kXzEPTl','YPS3kzXzEPTl')
          raw=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()=='5587618d050b49cddb24f0a4679722c3eeb6e356b67bdfadcd372281532fb828'
          edits=json.loads(raw);assert len(edits)==20
          paths=[]
          for item in edits:
            p=Path(item['path']);assert '..' not in p.parts and not p.is_absolute()
            assert p.parts[0] in ['src','scripts','prisma','tests','docs']
            if item['before'] is None:
              assert not p.exists(),str(p)
              after=item['content'].encode()
            else:
              before=p.read_bytes();assert hashlib.sha256(before).hexdigest()==item['before'],str(p)+' baseline mismatch'
              lines=before.decode().splitlines(keepends=True)
              for start,end,text in reversed(item['edits']):lines[start:end]=[text]
              after=''.join(lines).encode()
            assert hashlib.sha256(after).hexdigest()==item['after'],str(p)+' result mismatch'
            p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(after);paths.append(str(p))
            print('Verified source:',p,item['after'])
          subprocess.run(['git','config','user.name','SIXFL source integration'],check=True)
          subprocess.run(['git','config','user.email','262667783+MathewCobley@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','commit','-m','Preserve ordinary player debt and require explicit team settlement allowances'],check=True)
          subprocess.run(['git','push','origin','HEAD:fix/player-partial-payment-integrity'],check=True)
          PY
