name: Fix fixture confirmation Veo captain check

on:
  push:
    branches:
      - fix/fixture-confirmation-veo-captain-check
    paths:
      - .github/workflows/fix-fixture-confirmation-veo-captain-check.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fixture-confirmation-veo-captain-check
      - name: Remove nonexistent TeamMember isActive check
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/veo/fixture-bookings.ts')
          s = p.read_text()
          old = "AND m.role::text='CAPTAIN' AND COALESCE(m.\"isActive\",true)`"
          new = "AND m.role::text='CAPTAIN'`"
          if old not in s:
              raise SystemExit('Expected captain membership query not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify schema/query contract
        run: |
          grep -q 'model TeamMember' prisma/schema.prisma
          ! grep -q 'm\."isActive"' src/lib/veo/fixture-bookings.ts
          grep -q "m.role::text='CAPTAIN'" src/lib/veo/fixture-bookings.ts
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/veo/fixture-bookings.ts
          git commit -m "Fix captain fixture confirmation after Veo rollout"
          git push origin HEAD:fix/fixture-confirmation-veo-captain-check
