name: Apply referee extended-client type correction
on:
  push:
    branches: [fix/referee-evening-digest-20260905]
    paths: ['.github/workflows/referee-type-fix-once.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'MathewCobley/Sixfl' && github.ref == 'refs/heads/fix/referee-evening-digest-20260905'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write two verified native type corrections
        run: |
          python3 - <<'PY'
          import pathlib, hashlib
          expected = {
            'src/lib/notifications/service.ts': ('62acea06556e505d5708f10232b21fe28bdc4598','1238d4b7f70ffce04022d9905e0d59ce4cc3631fdbc5df830c44d839c279dbb8'),
            'src/lib/referees/evening-notifications.ts': ('ee2592645f781fe0d728dabf9d2c381f4075aa22','aab13c9b341ee1ded69743a14663da296b2938993503277e28f529a169e6f38a'),
          }
          outputs = []
          for filename,(before,after) in expected.items():
            p=pathlib.Path(filename); b=p.read_bytes()
            assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==before
            t=b.decode()
            if filename.endswith('/service.ts'):
              assert t.count('Prisma.TransactionClient')==3
              t=t.replace('const DISPATCH_STATUS = {','// Preserve the application\'s extended Prisma delegates in root and transactional calls.\ntype NotificationDb = Pick<typeof prisma,\n  "notificationDispatch" | "notificationTemplate" | "notificationRecipient">;\n\nconst DISPATCH_STATUS = {').replace('Prisma.TransactionClient','NotificationDb')
            else:
              assert t.count('type Db = Prisma.TransactionClient;')==1
              t=t.replace('type Db = Prisma.TransactionClient;','// Both the extended root client and its interactive transaction share these delegates.\ntype Db = Pick<typeof prisma,\n  "$queryRaw" | "$executeRaw" | "notificationDispatch" | "notificationTemplate"\n  | "notificationRecipient" | "notificationPreference">;')
            assert hashlib.sha256(t.encode()).hexdigest()==after
            outputs.append((p,t))
          for p,t in outputs:
            p.write_text(t)
            print('Verified',p)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/notifications/service.ts src/lib/referees/evening-notifications.ts
          git commit -m 'Use actual extended Prisma delegates for referee notification transactions'
          git push origin HEAD:fix/referee-evening-digest-20260905
