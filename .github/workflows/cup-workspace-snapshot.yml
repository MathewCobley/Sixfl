name: Cup isolated source workspace
on:
  push:
    branches: [feature/cup-invitations-reporting]
    paths: [.github/workflows/cup-workspace-snapshot.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package tracked source and public dependencies only
        run: |
          mkdir -p /tmp/cup-workspace
          git archive --format=tar HEAD src scripts tests config docs prisma .github AGENTS.md DEV_RULES.md ENGINEERING.md package.json package-lock.json tsconfig.json next.config.ts postcss.config.mjs next-env.d.ts | gzip > /tmp/cup-workspace/source.tar.gz
          tar -czf /tmp/cup-workspace/dependencies.tar.gz node_modules
          git rev-parse HEAD > /tmp/cup-workspace/revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cup-isolated-workspace
          path: /tmp/cup-workspace/
          retention-days: 1
          compression-level: 0
