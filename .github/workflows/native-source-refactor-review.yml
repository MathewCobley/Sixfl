name: Export verified native source objects
on:
  push:
    branches: [maintenance/native-cups-fixtures-20260912-001]
permissions:
  contents: write
  actions: read
jobs:
  export-verified-blobs:
    if: github.repository == 'MathewCobley/Sixfl'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact tested artifact and store content-addressed blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/MathewCobley/Sixfl/actions/artifacts/10287576741/zip > /tmp/verified-native.zip
          python3 - <<'PY'
          import hashlib, json, subprocess, zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/verified-native.zip') as archive:
              raw = archive.read('native-tree.json')
          assert hashlib.sha256(raw).hexdigest() == '91b8781d5e8d26fe3e04f90c032878841c9f88014502fa6f8058290ae09f0126', 'Validated source artifact differs'
          data = json.loads(raw)
          assert data['base_tree'] == '3c7fca88a58ccfcaefd06a849522b163a048cb75'
          entries = []
          for entry in data['tree']:
              assert entry['path'].startswith(('src/', 'scripts/', 'tests/', 'prisma/', '.github/workflows/'))
              assert '..' not in entry['path'].split('/')
              if 'content' in entry:
                  content = entry.pop('content')
                  expected = hashlib.sha1(b'blob ' + str(len(content.encode())).encode() + b'\0' + content.encode()).hexdigest()
                  if entry['path'].startswith('.github/workflows/'):
                      # Workflow blobs are supplied separately through the authorised
                      # connector; this CI token never updates workflows or any ref.
                      entry['sha'] = expected
                  else:
                      payload = json.dumps({'content':content, 'encoding':'utf-8'})
                      result = subprocess.run(['gh','api','--method','POST','repos/MathewCobley/Sixfl/git/blobs','--input','-'], input=payload, text=True, capture_output=True, check=True)
                      entry['sha'] = json.loads(result.stdout)['sha']
                      assert entry['sha'] == expected
              entries.append(entry)
              print(json.dumps(entry))
          Path('/tmp/verified-native-entries.json').write_text(json.dumps({'base_tree':data['base_tree'],'tree':entries}, indent=2))
          print('Verified blobs exported. No branch, workflow, production database, or deployment changed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-native-object-manifest
          path: /tmp/verified-native-entries.json
          retention-days: 2
