name: Integrate reviewed template and preview changes
on:
  push:
    branches: [fix/template-save-json-20260906]
    paths: ['.github/workflows/template-save-merge-preview-once.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'MathewCobley/Sixfl' && github.ref == 'refs/heads/fix/template-save-json-20260906'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - name: Preserve both independently reviewed changes
        run: |
          git fetch --no-tags --depth=5 origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, hashlib
          base = '5e446c3be5492f67156ebed5b216aa0e9079d34a'
          main = 'bd62f7665129e8985fd30e5dd5e23b635ab0062c'
          path = 'src/components/admin/email-templates/EmailTemplateForm.tsx'
          assert subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip() == main, 'Main advanced; re-review before merging'
          def preview(source):
              assert source.count('"use client";\n') == 1
              assert source.count('<div dangerouslySetInnerHTML={{ __html: previewHtml }} />') == 1
              return source.replace('"use client";\n', '"use client";\n\nimport EmailHtmlPreview from "@/components/admin/email/EmailHtmlPreview";\n', 1).replace('<div dangerouslySetInnerHTML={{ __html: previewHtml }} />', '<EmailHtmlPreview html={previewHtml} />', 1)
          original = subprocess.check_output(['git','show',base+':'+path],text=True)
          theirs = subprocess.check_output(['git','show',main+':'+path],text=True)
          # The preview PR places its new import immediately before the existing import block.
          expected = preview(original).replace('EmailHtmlPreview";\n\nimport {','EmailHtmlPreview";\nimport {',1)
          assert theirs == expected, 'Preview changes differ from the reviewed two-line update'
          ours = Path(path).read_text()
          blob = hashlib.sha1(f'blob {len(ours.encode())}\0'.encode()+ours.encode()).hexdigest()
          assert blob == '46c7b4618f74a193b14e49e69c17bf9b2ae817bc', 'Template save source changed'
          merged = preview(ours).replace('EmailHtmlPreview";\n\nimport {','EmailHtmlPreview";\nimport {',1)
          result = subprocess.run(['git','merge','--no-commit','--no-ff',main])
          conflicts = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert not conflicts or conflicts == [path], f'Unexpected conflicts: {conflicts}'
          assert result.returncode == 0 or conflicts == [path]
          Path(path).write_text(merged)
          subprocess.run(['git','add','--',path],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert 'useTemplateSave' in merged and '<EmailHtmlPreview html={previewHtml} />' in merged
          assert 'useActionState' not in merged and 'dangerouslySetInnerHTML' not in merged
          PY
          node scripts/check-email-template-create-completion.mjs
          git commit -m 'Merge current main and preserve isolated previews alongside bounded template saves'
          git push origin HEAD:fix/template-save-json-20260906
