name: Integrate first-match sources once
on:
  push:
    branches: [fix/first-match-ready-email]
    paths: ['.github/workflows/integrate-first-match-once.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/first-match-ready-email
      - name: Apply reviewed edits to owning source on this branch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/captain/onboarding-emails.ts');s=p.read_text()
          assert 'const STAGE_CONTENT:' in s and 'queueFirstMatchReadyEmail' not in s
          s=s.replace('  NotificationChannel,\n','').replace('import { upsertNotificationRecipient } from "@/lib/notifications/recipients";\n','')
          s=s.replace('import { queueDirectNotification } from "@/lib/notifications/service";', 'import { queueNotificationFromTemplate } from "@/lib/notifications/service";\nimport { queueFirstMatchReadyEmail } from "./first-match-ready";')
          a=s.index('const STAGE_CONTENT:');b=s.index('\nfunction getSiteUrl()',a)
          s=s[:a]+'const STAGE_TEMPLATE_KEYS: Record<CaptainOnboardingEmailStage, string> = {\n  welcome: "captain-onboarding-welcome",\n  firstFixture: "captain-first-fixture-reminder",\n  postFirstMatch: "captain-post-first-match",\n};\n'+s[b:]
          a=s.index('  const sevenDaysFromNow =');b=s.index('\n  switch',a);s=s[:a]+s[b:]
          a=s.index('    case "firstFixture":\n      return Boolean(');b=s.index('    case "postFirstMatch":',a)
          s=s[:a]+'    case "firstFixture":\n      // Shared service checks first-match history, publication and same-day catch-up.\n      return true;\n'+s[b:]
          s=s.replace('  nextFixtureAt: Date | null;\n','')
          a=s.index('    (\n      SELECT MIN(f."kickoffAt")');b=s.index('    EXISTS (',a);s=s[:a]+s[b:]
          s=s.replace('    WHERE t."captainUserId" IS NOT NULL','    WHERE t."secondaryContactEmail" IS NOT NULL\n       OR t."captainUserId" IS NOT NULL')
          s=s.replace('  const captainEmail = getCaptainEmail(input.row);','  if (input.stage === "firstFixture") {\n    return queueFirstMatchReadyEmail({ teamId: input.row.id, manual: input.manual });\n  }\n\n  const captainEmail = getCaptainEmail(input.row);')
          a=s.index('  const recipient = await upsertNotificationRecipient({');b=s.index('  const content = STAGE_CONTENT',a)
          recipient='''  const email = captainEmail.trim().toLowerCase();
            const contact = { displayName: getCaptainName(input.row), email, emailNormalized: email, lastSyncedAt: new Date() };
            const recipient = await prisma.notificationRecipient.upsert({
              where: { sourceType_sourceId: { sourceType: NotificationRecipientSourceType.TEAM, sourceId: input.row.id } },
              update: contact,
              create: { ...contact, sourceType: NotificationRecipientSourceType.TEAM, sourceId: input.row.id,
                audience: NotificationAudience.TEAM, transactionalEmailOptIn: true,
                metadata: { teamId: input.row.id, source: "captain_onboarding" } },
            });
            await prisma.notificationPreference.upsert({ where: { recipientId: recipient.id }, update: {}, create: { recipientId: recipient.id } });
          '''
          s=s[:a]+recipient+s[b:]
          s=s.replace('  const content = STAGE_CONTENT[input.stage];\n','')
          s=s.replace('  await queueDirectNotification({\n    recipientId: recipient.id,\n    channel: NotificationChannel.EMAIL,\n    audience: NotificationAudience.TEAM,\n    subject: content.subject,\n    body: content.body({ captainName }),','  const dispatch = await queueNotificationFromTemplate({\n    templateKey: STAGE_TEMPLATE_KEYS[input.stage],\n    recipientId: recipient.id,')
          s=s.replace('    emailCta: {\n      label: content.ctaLabel,\n      url: captainDashboardUrl,\n    },\n','')
          s=s.replace('  await markStageQueued({ teamId: input.row.id, stage: input.stage });','  if (dispatch.status !== "QUEUED") return "not_due" as const;\n  await markStageQueued({ teamId: input.row.id, stage: input.stage });')
          s=s.replace('Object.keys(STAGE_CONTENT)','Object.keys(STAGE_TEMPLATE_KEYS)')
          s=s.replace('        } else {\n          summary.skippedNoEmail += 1;\n        }','        } else if (result === "missing_email") {\n          summary.skippedNoEmail += 1;\n        } else {\n          summary.alreadySentOrNotDue += 1;\n        }')
          assert 'queueDirectNotification' not in s and 'STAGE_CONTENT' not in s
          p.write_text(s)
          p=Path('src/lib/notifications/processor.ts');s=p.read_text();assert 'getFirstMatchReadyDeliveryBlock' not in s
          s=s.replace('import { prisma } from "@/lib/prisma";', 'import { prisma } from "@/lib/prisma";\nimport { getFirstMatchReadyDeliveryBlock } from "@/lib/captain/first-match-ready";')
          s=s.replace('        (await getSquadActivationEmailDeliveryBlock(dispatch)) ??','        (await getFirstMatchReadyDeliveryBlock(dispatch)) ??\n        (await getSquadActivationEmailDeliveryBlock(dispatch)) ??')
          assert 'await getFirstMatchReadyDeliveryBlock(dispatch)' in s;p.write_text(s)
          p=Path('src/app/(admin)/admin/teams/onboarding/page.tsx');s=p.read_text()
          old='<div>First fixture: {formatDate(onboarding?.onboardingFirstFixtureEmailSentAt ?? null)}</div>';assert old in s
          s=s.replace('import Link from "next/link";', 'import Link from "next/link";\nimport FirstMatchReadyStatus from "@/components/admin/teams/FirstMatchReadyStatus";').replace(old,'<FirstMatchReadyStatus teamId={team.id} />');p.write_text(s)
          p=Path('docs/critical-feature-contracts.md');s=p.read_text();s+='\n\n## First-match readiness briefing\n\nThe shared first-match-ready service replaces the existing firstFixture onboarding stage. Automatic eligibility is the whole 48-hour interval before the first published scheduled fixture, including same-day publication; kick-off is an exclusive boundary. Completed/results history and earlier published past fixtures prevent established teams being reintroduced. The original template key and legacy queue markers remain authoritative for duplicate suppression; rollout does not resend or rewrite old messages. The default template is migrated only when unchanged, retaining edits and disabled state. Manual and automatic requests use the same transactional queue, with a final provider guard and read-only dispatch status on Admin Captain onboarding. Tests use disposable PostgreSQL and block provider HTTP calls.\n';p.write_text(s)
          PY
          git diff --check
          git config user.name 'SIXFL maintenance'
          git config user.email 'maintenance@sixfl.co.uk'
          git add src/lib/captain/onboarding-emails.ts src/lib/notifications/processor.ts 'src/app/(admin)/admin/teams/onboarding/page.tsx' docs/critical-feature-contracts.md
          git diff --cached --stat
          git commit -m 'Route onboarding and delivery through the shared first-match briefing policy'
          git push origin HEAD:refs/heads/fix/first-match-ready-email
