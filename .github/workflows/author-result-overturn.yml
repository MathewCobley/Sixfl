name: Apply reviewed scorer consistency follow-up once
on:
  push:
    branches: [feature/result-overturn-on-pitch]
permissions:
  contents: write
jobs:
  apply-reviewed-source:
    if: github.ref == 'refs/heads/feature/result-overturn-on-pitch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/result-overturn-on-pitch
      - name: Apply exact reviewed two-file consistency patch
        shell: bash
        run: |
          if [ ! -f .github/result-overturn-scorers.patch ]; then exit 0; fi
          echo 'afdb35409bb061d7ae1088c22f64f96d55527271d23fd9666b3e6eafd896f669  .github/result-overturn-scorers.patch' | sha256sum -c -
          git apply --check .github/result-overturn-scorers.patch
          git apply --index .github/result-overturn-scorers.patch
          git rm .github/result-overturn-scorers.patch
          git diff --cached --check
          git config user.name 'SIXFL source preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep scorer limits on the played score without changing the awarded outcome'
          git push origin HEAD:feature/result-overturn-on-pitch
