name: Apply reviewed result-overturn source once
on:
  push:
    branches: [feature/result-overturn-on-pitch]
permissions:
  contents: write
jobs:
  apply-reviewed-source:
    if: github.ref == 'refs/heads/feature/result-overturn-on-pitch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/result-overturn-on-pitch
      - name: Apply exact reviewed native patch without running application code
        shell: bash
        run: |
          if [ ! -f .github/result-overturn.part1 ]; then exit 0; fi
          python3 - <<'PY'
          import pathlib, zlib, hashlib, subprocess
          data = b''.join(pathlib.Path(f'.github/result-overturn.part{i}').read_bytes() for i in (1,2,3))
          patch = zlib.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == 'c5b07e1b5e7996b6277e8f2622b1ff24eb3fd99618e8830f0a2ad9f59c24cc5b'
          assert b'diff --git a/.github/' not in patch
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          PY
          git rm .github/result-overturn.part1 .github/result-overturn.part2 .github/result-overturn.part3
          git diff --cached --check
          git config user.name 'SIXFL source preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add audited result overturns and preserve on-pitch predictor history'
          git push origin HEAD:feature/result-overturn-on-pitch
