name: Referee evening communications
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: referee-evening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  referee-evening:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sixfl_referee_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Disposable CI service only. No production secrets or delivery API keys.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sixfl_referee_test
      EMAIL_REPLY_DOMAIN: example.invalid
      SIXFL_ISOLATED_REFEREE_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prebuild
      - run: npx prisma generate
      - name: Check timing, content and regression contracts
        run: npx tsx --test tests/referee-evening-comms.test.ts
      - name: Type check
        run: npx tsc --noEmit
      - name: Create isolated test schema
        run: |
          npx prisma db push --skip-generate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260626120500_add_referee_nights/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260626133000_add_referee_profiles/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260706193000_referee_night_confirmations/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'ALTER TABLE "League" ADD COLUMN IF NOT EXISTS "minutesPerGame" INTEGER;'
      - name: Exercise migration, transactions, duplicates and confirmations
        run: |
          npx tsx --test tests/referee-evening-database.test.ts
          npx tsx --test tests/referee-evening-cashup-sync.test.ts
