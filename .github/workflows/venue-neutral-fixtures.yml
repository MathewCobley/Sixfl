name: Venue-neutral fixture scheduling

on:
  pull_request:
    paths:
      - "src/app/(admin)/admin/fixtures/generate/division-actions.ts"
      - "src/app/api/admin/fixtures/generate-next-week/route.ts"
      - "src/app/api/admin/fixtures/matchup-grid/route.ts"
      - "src/components/admin/fixtures/FixtureMatchupGrid.tsx"
      - "src/app/(admin)/admin/fixtures/generate/page.tsx"
      - "scripts/check-venue-neutral-fixtures.mjs"
      - ".github/workflows/venue-neutral-fixtures.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: venue-neutral-fixtures-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  venue-neutral-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check native venue-neutral implementation before preparation
        run: node scripts/check-venue-neutral-fixtures.mjs
      - name: Prepare final production source
        run: npm run prebuild
      - run: npx prisma generate
      - name: Check venue-neutral fixture contracts
        run: node scripts/check-venue-neutral-fixtures.mjs
      - name: Check critical feature contracts
        run: node scripts/check-critical-feature-contracts.mjs
      - name: Type check
        run: npx tsc --noEmit
