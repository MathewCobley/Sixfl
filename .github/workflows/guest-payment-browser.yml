name: Guest payment browser controls
on:
  pull_request:
    paths:
      - "src/app/captain/team/**/player-payments/**"
      - "src/components/payments/**"
      - "src/lib/payments/**"
      - "tests/guest-payment-links-ui.mjs"
      - "scripts/check-standard-team-player-payment-links.mjs"
      - ".github/workflows/guest-payment-browser.yml"
  workflow_dispatch:
concurrency:
  group: guest-payment-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guest-payment-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prebuild
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Exercise actual guest payment controls without production data
        run: node tests/guest-payment-links-ui.mjs
