name: Admin-only matchweek reports

on:
  pull_request:
    paths:
      - "src/app/(admin)/admin/matchweek-reports/**"
      - "src/components/admin/matchweek-reports/**"
      - "src/lib/matchweek-reports/**"
      - "src/app/(admin)/admin/layout.tsx"
      - "src/components/admin/AdminSidebar.tsx"
      - "src/components/layout/AppHeader.tsx"
      - "src/components/leagues/LeagueQuickLinks.tsx"
      - "src/app/(public)/leagues/[slug]/weekly-report/**"
      - "src/lib/requireAdmin.ts"
      - "tests/admin-matchweek-reports.test.cjs"
      - ".github/workflows/admin-matchweek-reports.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-matchweek-reports-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Find existing report routes and shared navigation
        run: git grep -l -i -E 'weekly-report|matchweek.?report|LeagueQuickLinks' HEAD^ -- src scripts || true
      - run: npm ci
      - name: Test native report privacy and navigation
        run: node --test tests/admin-matchweek-reports.test.cjs
      - run: npm run prebuild
      - name: Test final production-prepared report privacy and navigation
        run: node --test tests/admin-matchweek-reports.test.cjs
      - name: Search final source for report routes and navigation
        run: git grep -l -i -E 'weekly-report|matchweek.?report|LeagueQuickLinks' -- src scripts
