name: Inspect email preview layout isolation (temporary)
on:
  push:
    branches: [fix/isolate-admin-email-previews]
    paths: [.github/workflows/email-preview-audit-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Inspect actual preview consumers and email CSS
        shell: bash
        run: |
          echo '=== NATIVE HTML CONSUMERS ==='
          git grep -nE 'dangerouslySetInnerHTML|srcDoc=|sandbox=' -- src || true
          echo '=== EMAIL CSS ==='
          git grep -nE '<style|height:100|height: 100|\.container|\.grid|div ?\{' -- src/lib/email src/lib/notifications || true
          npm ci > /tmp/email-preview-install.log 2>&1 || { tail -60 /tmp/email-preview-install.log; exit 1; }
          npm run prebuild > /tmp/email-preview-prebuild.log 2>&1 || { tail -60 /tmp/email-preview-prebuild.log; exit 1; }
          echo '=== PREPARED HTML CONSUMERS ==='
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('src').rglob('*'):
              if p.suffix not in ('.tsx','.ts'): continue
              lines=p.read_text().splitlines()
              hits=[i for i,s in enumerate(lines) if 'dangerouslySetInnerHTML' in s or 'srcDoc=' in s or 'sandbox=' in s]
              for i in hits:
                  print('\nFILE',p,'LINE',i+1)
                  print('\n'.join(f'{j+1}: {lines[j]}' for j in range(max(0,i-5),min(len(lines),i+7))))
          PY
          echo '=== CSS AND PREBUILD OWNERS ==='
          git grep -nE 'dangerouslySetInnerHTML|srcDoc' -- scripts | cut -c1-320 | head -100 || true
          echo '=== TEST DEPENDENCIES ==='
          node -e 'const p=require("./package.json"); console.log(JSON.stringify({dependencies:p.dependencies, devDependencies:p.devDependencies},null,2))'
