          edit.write_text(text)

          night = Path("src/app/(admin)/admin/night-board/page.tsx")
          text = night.read_text()
          text = text.replace('''  const fixture = await prisma.fixture.findUnique({ where: { id: fixtureId }, select: { id: true, kickoffAt: true } });
  if (!fixture) redirect(returnTo);
''', '''  const fixture = await prisma.fixture.findUnique({ where: { id: fixtureId }, select: { id: true, kickoffAt: true, status: true } });
  if (!fixture) redirect(returnTo);
  if (fixture.status === FixtureStatus.COMPLETED) redirect(returnTo);
''', 1)
          night.write_text(text)

      - name: Commit lock and remove one-time workflow
        run: |
          rm .github/workflows/lock-completed-fixtures.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/(admin)/admin/fixtures/actions.ts src/app/(admin)/admin/fixtures/[id]/edit/page.tsx src/app/(admin)/admin/night-board/page.tsx .github/workflows/lock-completed-fixtures.yml
          git commit -m "Lock completed fixtures against edits"
          git push origin main
