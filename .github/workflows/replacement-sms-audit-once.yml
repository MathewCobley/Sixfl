name: Preserve replacement SMS cancellation provenance (temporary)
on:
  push:
    branches: [fix/cancel-resolved-replacement-sms]
    paths: [.github/workflows/replacement-sms-audit-once.yml]
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cancel-resolved-replacement-sms
      - name: Retain previous status in internal cancellation metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/fixtures/replacement-sms-lifecycle.ts');s=p.read_text()
          anchor='      UPDATE "NotificationDispatch" d SET "status" = \'CANCELLED\','
          assert s.count(anchor)==2
          s=s.replace(anchor,anchor+'\n        "metadata" = d."metadata" || jsonb_build_object(\'replacementSmsCancelledFrom\', d."status"::text),')
          p.write_text(s)
          p=Path('prisma/migrations/20260906225000_cancel_resolved_replacement_sms/migration.sql');s=p.read_text()
          anchor='    UPDATE "NotificationDispatch" d SET "status" = \'CANCELLED\','
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+'\n      "metadata" = d."metadata" || jsonb_build_object(\'replacementSmsCancelledFrom\', d."status"::text),')
          p.write_text(s)
          p=Path('src/lib/fixtures/last-minute-replacement-resolution.ts');s=p.read_text()
          anchor='OR (dispatch."status"::text = \'CANCELLED\' AND dispatch."failureReason" = ${REPLACEMENT_SMS_CANCEL_REASON}))'
          assert s.count(anchor)==3
          s=s.replace(anchor,'OR (dispatch."status"::text = \'CANCELLED\' AND dispatch."failureReason" = ${REPLACEMENT_SMS_CANCEL_REASON}\n          AND dispatch."metadata"->>\'replacementSmsCancelledFrom\' IN (\'QUEUED\', \'PROCESSING\')))')
          p.write_text(s)
          p=Path('tests/replacement-sms-lifecycle.test.cjs');s=p.read_text()
          anchor="  for(const id of cancelledIds){assert.match("
          assert s.count(anchor)==1
          s=s.replace(anchor,"  for(const id of cancelledIds)assert.equal(state().find(d=>d.id===id).metadata.replacementSmsCancelledFrom,id==='retry'?'FAILED':'QUEUED');\n"+anchor)
          anchor="  assert.ok(resolution.includes('dispatch.\"failureReason\" = ${REPLACEMENT_SMS_CANCEL_REASON}'));"
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+"\n  assert.ok(resolution.includes(\"dispatch.\\\"metadata\\\"->>'replacementSmsCancelledFrom' IN ('QUEUED', 'PROCESSING')\"),'Failed or queue-time-blocked attempts must not expand email recipients');")
          p.write_text(s)
          PY
          git diff --check
          git diff
          git config user.name 'SIXFL automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/fixtures/replacement-sms-lifecycle.ts src/lib/fixtures/last-minute-replacement-resolution.ts prisma/migrations/20260906225000_cancel_resolved_replacement_sms/migration.sql tests/replacement-sms-lifecycle.test.cjs
          git rm .github/workflows/replacement-sms-audit-once.yml
          git commit -m 'Retain prior SMS status without changing email recipient eligibility'
          git push origin HEAD:fix/cancel-resolved-replacement-sms
