name: CI workflow scope policy

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/check-ci-workflow-scope.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-workflow-scope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve comparison commit
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Reject queue-amplifying workflow changes
        run: node scripts/check-ci-workflow-scope.mjs --changed-from "${{ steps.base.outputs.sha }}"
