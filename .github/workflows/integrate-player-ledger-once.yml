name: Integrate player ledger sources once
on:
  push:
    branches: [feat/player-ledger-small-payments]
    paths: ['.github/workflows/integrate-player-ledger-once.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/player-ledger-small-payments
      - name: Apply exact reviewed owning-source edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,subprocess
          from pathlib import Path
          edits=[]
          for sha in ['e7fd2de5c38355ef7d0efb45ecaf2c622c72cd34','6e491cd90c0abaa4829da971a34aec90868194dc','a3fdaee4e8bbce416b45ded229a17f97df2145d8']:
            obj=json.loads(subprocess.check_output(['gh','api',f'repos/MathewCobley/Sixfl/git/blobs/{sha}']))
            edits.extend(json.loads(base64.b64decode(obj['content'])))
          assert len(edits)==29
          paths=[]
          for item in edits:
            p=Path(item['path']);assert '..' not in p.parts and not p.is_absolute()
            before=p.read_bytes();assert hashlib.sha256(before).hexdigest()==item['before'],str(p)+' baseline mismatch'
            lines=before.decode().splitlines(keepends=True)
            for start,end,text in reversed(item['edits']):lines[start:end]=[text]
            after=''.join(lines).encode();assert hashlib.sha256(after).hexdigest()==item['after'],str(p)+' result mismatch'
            p.write_bytes(after);paths.append(str(p));print('Verified native source:',p)
          subprocess.run(['git','config','user.name','SIXFL source integration'],check=True)
          subprocess.run(['git','config','user.email','262667783+MathewCobley@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','commit','-m','Integrate shared player ledger into existing payment, notification and native UI paths'],check=True)
          subprocess.run(['git','push','origin','HEAD:feat/player-ledger-small-payments'],check=True)
          PY
