name: Integrate automatic activation once
on:
  push:
    branches: [fix/automatic-pending-squad-activation]
    paths: ['.github/workflows/activation-integrate-once.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/automatic-pending-squad-activation
      - name: Apply reviewed edits only to the native owning source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def change(path,fn):
            p=Path(path);s=p.read_text();n=fn(s);assert s!=n,path;p.write_text(n)
          def one(s,a,b):
            assert s.count(a)==1,(s.count(a),a[:80]);return s.replace(a,b)
          def manual(s):
            start=s.index('import {\n  NotificationAudience');end=s.index('function getSiteUrl()')
            s=s[:start]+'import { requireCaptain } from "@/lib/requireCaptain";\nimport { queuePendingSquadActivationEmail } from "@/lib/squad/activation-emails";\n\n'+s[end:]
            start=s.index('function getDisplayName(');end=s.index('export async function POST(');s=s[:start]+s[end:]
            start=s.index('  const team = await prisma.team.findUnique(');end=s.index('  revalidatePath(',start)
            replacement='\n'.join([
              '  let result;', '  try {', '    result = await queuePendingSquadActivationEmail({',
              '      prospectId, teamId: teamid,', '      mode: formData.get("resend") === "1" ? "resend" : "initial",',
              '      createdByUserId: user?.id ?? null,', '    });', '  } catch (error) {',
              '    console.error("Squad activation could not be queued", { prospectId, error });',
              '    return NextResponse.redirect(getSquadRedirectUrl(request, teamid,',
              '      "?error=Activation%20could%20not%20be%20queued.%20Check%20Prospect%20comms%20and%20System%20Templates."));',
              '  }', '  if (!result.queued) {',
              '    return NextResponse.redirect(getSquadRedirectUrl(request, teamid, `?error=${encodeURIComponent(result.reason)}`));',
              '  }', '', '',
            ])
            s=s[:start]+replacement+s[end:]
            return s.replace('${prospect.id}/communications','${prospectId}/communications')
          change('src/app/captain/team/[teamid]/squad/send-activation/route.ts',manual)
          def cron(s):
            s=one(s,'import { prisma } from "@/lib/prisma";', 'import { prisma } from "@/lib/prisma";\nimport { runPendingSquadActivationEmailJob } from "@/lib/squad/activation-emails";')
            s=one(s,'  const onboarding = await runCronStep(', '  const pendingSquadActivations = await runCronStep(\n    "pending-squad-activation-emails", failures, runPendingSquadActivationEmailJob,\n  );\n\n  const onboarding = await runCronStep(')
            return one(s,'    existingQueue,\n    onboarding,','    existingQueue,\n    pendingSquadActivations,\n    onboarding,')
          change('src/app/api/cron/notifications/route.ts',cron)
          def processor(s):
            s=one(s,'import { prisma } from "@/lib/prisma";', 'import { prisma } from "@/lib/prisma";\nimport { getSquadActivationEmailDeliveryBlock } from "@/lib/squad/activation-emails";')
            return one(s,'        unpublishedFixtureBlockReason ??','        unpublishedFixtureBlockReason ??\n        (await getSquadActivationEmailDeliveryBlock(dispatch)) ??')
          change('src/lib/notifications/processor.ts',processor)
          def page(s):
            s=one(s,'import Link from "next/link";', 'import Link from "next/link";\nimport PendingActivationEmailStatus from "@/components/admin/squad/PendingActivationEmailStatus";')
            return one(s,'                                <div className="mt-2 rounded-xl border border-white/10 bg-white/[0.03] px-3 py-2 text-xs font-medium text-white/50">\n                                  No activation account email sent yet.\n                                </div>','                                <PendingActivationEmailStatus prospectId={prospect.id} />')
          change('src/app/captain/team/[teamid]/squad/page.tsx',page)
          def layout(s):
            s=one(s,'import Link from "next/link";', 'import Link from "next/link";\nimport PendingActivationEmailStatus from "@/components/admin/squad/PendingActivationEmailStatus";')
            s=one(s,'  action,\n  disabled,','  action,\n  resend = false,\n  disabled,')
            s=one(s,'  action: "send-activation" | "send-activation-sms";','  action: "send-activation" | "send-activation-sms";\n  resend?: boolean;')
            s=one(s,'    <form method="post" action={`/captain/team/${teamid}/squad/${action}`}>','    <form method="post" action={`/captain/team/${teamid}/squad/${action}`}>\n      {resend && action === "send-activation" ? <input type="hidden" name="resend" value="1" /> : null}')
            s=one(s,'{getDispatchStatusText({ label: "Activation email", dispatch: emailDispatch })}','{emailDispatch ? getDispatchStatusText({ label: "Activation email", dispatch: emailDispatch }) : <PendingActivationEmailStatus prospectId={prospect.id} />}')
            s=one(s,'                  action="send-activation"\n                  disabled={!hasEmail}','                  action="send-activation"\n                  resend={Boolean(emailDispatch)}\n                  disabled={!hasEmail}')
            return s
          change('src/app/captain/team/[teamid]/squad/layout.tsx',layout)
          PY
          git diff --check
          git diff --stat
          git config user.name 'SIXFL maintenance'
          git config user.email 'maintenance@sixfl.co.uk'
          git add src/app/api/cron/notifications/route.ts src/lib/notifications/processor.ts 'src/app/captain/team/[teamid]/squad'
          git commit -m 'Wire pending activation state sweep and shared manual-email and delivery safeguards'
          git push origin HEAD:refs/heads/fix/automatic-pending-squad-activation
