name: Integrate last-minute confirmation checks once
on:
  pull_request:
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.pull_request.number == 475 && github.event.pull_request.head.repo.full_name == 'MathewCobley/Sixfl' && github.event.pull_request.head.ref == 'fix/last-minute-replacement-confirmations'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply reviewed edits only to the six owning files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(name, old, new, count=1):
              p=Path(name);s=p.read_text();assert s.count(old)==count,(name,old,s.count(old));p.write_text(s.replace(old,new))
          for name in ['confirmation-emails.ts','confirmation-reminders.ts','confirmation-warning-emails.ts']:
              replace('src/lib/fixtures/'+name,'import { prisma } from "@/lib/prisma";', 'import { prisma } from "@/lib/prisma";\nimport { getAllocatedReplacementConfirmationBlock } from "./replacement-confirmation-policy";')
          replace('src/lib/fixtures/confirmation-emails.ts','  const confirmation = fixture.captainConfirmations[0];','  if (await getAllocatedReplacementConfirmationBlock(input)) return "skipped";\n\n  const confirmation = fixture.captainConfirmations[0];')
          replace('src/lib/fixtures/confirmation-emails.ts','    for (const teamId of [fixture.homeTeam.id, fixture.awayTeam.id]) {','    for (const teamId of [fixture.homeTeam.id, fixture.awayTeam.id]) {\n      if (await getAllocatedReplacementConfirmationBlock({ fixtureId: fixture.id, teamId })) {\n        summary.skipped += 1;\n        continue;\n      }')
          replace('src/lib/fixtures/confirmation-reminders.ts','  const existingConfirmation = fixture.captainConfirmations[0] ?? null;','  if (await getAllocatedReplacementConfirmationBlock(input)) {\n    return { ok: false, status: "not_available", teamName: team.name };\n  }\n\n  const existingConfirmation = fixture.captainConfirmations[0] ?? null;')
          replace('src/lib/fixtures/confirmation-warning-emails.ts','  const existingDispatch = await prisma.notificationDispatch.findFirst({','  if (await getAllocatedReplacementConfirmationBlock(warning)) {\n    return { status: "not_queued" as const, queued: 0, dispatchId: null, dispatchStatus: "CANCELLED" as const };\n  }\n  const existingDispatch = await prisma.notificationDispatch.findFirst({')
          replace('src/lib/notifications/processor.ts','import { NotificationChannel } from "@prisma/client";','import { NotificationChannel } from "@prisma/client";\nimport { getFixtureConfirmationDeliveryBlock } from "@/lib/fixtures/replacement-confirmation-policy";')
          block='        const confirmationBlock = await getFixtureConfirmationDeliveryBlock(dispatch);\n        if (confirmationBlock) {\n          await markNotificationDispatchCancelled(dispatch.id, confirmationBlock);\n          result.skipped += 1;\n          result.items.push({ dispatchId: dispatch.id, status: "skipped", channel: dispatch.channel, message: confirmationBlock });\n          continue;\n        }\n'
          for fn in ['sendEmailWithResend','sendSmsWithTwilio']:
              anchor='        const sendResult = await '+fn+'('
              replace('src/lib/notifications/processor.ts',anchor,block+anchor)
          replace('src/lib/fixtures/last-minute-replacement-resolution.ts','import { randomUUID } from "node:crypto";','import { randomUUID } from "node:crypto";\nimport { cancelAllocatedReplacementConfirmationRequests } from "./replacement-confirmation-policy";')
          anchor='  try {\n    const cancelled = await cancelClosedReplacementSms(input.fixtureId);'
          replacement='  try {\n    await cancelAllocatedReplacementConfirmationRequests(input.fixtureId);\n  } catch (error) {\n    console.error("[replacement-confirmations] Cleanup failed; final delivery checks remain active", error);\n  }\n'+anchor
          replace('src/lib/fixtures/last-minute-replacement-resolution.ts',anchor,replacement)
          replace('src/lib/fixtures/last-minute-replacement.ts','          kickoffAt: fixture.kickoffAt.toISOString(),','          kickoffAt: fixture.kickoffAt.toISOString(),\n          replacementContext: { leagueId: fixture.leagueId, venueId: fixture.venue?.id ?? null, pitch: fixture.pitch?.trim() || null },',2)
          replace('src/lib/fixtures/last-minute-replacement.ts','venue: { select: { name: true } }','venue: { select: { id: true, name: true } }')
          PY
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/fixtures/confirmation-emails.ts src/lib/fixtures/confirmation-reminders.ts src/lib/fixtures/confirmation-warning-emails.ts src/lib/fixtures/last-minute-replacement-resolution.ts src/lib/fixtures/last-minute-replacement.ts src/lib/notifications/processor.ts
          test "$(git diff --cached --name-only | wc -l)" = 6
          git commit -m 'Integrate replacement-aware confirmation creation, queue cleanup and both provider guards'
          git push origin HEAD:refs/heads/fix/last-minute-replacement-confirmations
