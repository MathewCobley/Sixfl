name: Materialize live league reassurance source

on:
  push:
    branches:
      - feature/live-league-reassurance-email

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/live-league-reassurance-email
          fetch-depth: 0

      - name: Generate the adaptive reassurance action
        run: node scripts/apply-live-league-reassurance-email.cjs

      - name: Remove temporary source-generation files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-admin-team-kickoff-summary.cjs")
          text = path.read_text(encoding="utf-8")
          marker = 'require("./apply-live-league-reassurance-email.cjs");\n'
          if marker not in text:
              raise SystemExit("Could not find temporary reassurance source-preparation hook")
          path.write_text(text.replace(marker, "", 1), encoding="utf-8")
          PY

          rm -rf scripts/payloads/live-league-reassurance-action
          rm scripts/apply-live-league-reassurance-email.cjs
          rm .github/workflows/_materialize-live-league-reassurance.yml

      - name: Commit the generated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize live league reassurance email source"
          git push origin HEAD:feature/live-league-reassurance-email
