name: SIXFL critical feature contracts

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: critical-feature-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Preserve existing critical features
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check PWA version-aware updates
        run: node --test tests/pwa-version-aware-updates.test.cjs

      - name: Check native homepage night copy
        run: node --test tests/critical-pages/league-night-copy.test.cjs

      - name: Check native admin latest activity
        run: node --test tests/critical-pages/admin-latest-activity.test.cjs

      - name: Check native admin stale-deployment recovery
        run: node --test tests/admin-stale-deployment-recovery.test.cjs

      - name: Check native player YES team restore
        run: node --test tests/critical-pages/player-interest-team-restore.test.cjs

      - name: Check native exact captain preview and squad numbers
        run: node --test tests/captain-preview-squad-number.test.cjs

      - name: Check native referee welcome and dashboard status
        run: node --test tests/critical-pages/referee-welcome-status.test.cjs

      - name: Check native referee new emails and email/SMS replies
        run: node --test tests/critical-pages/referee-comms-email.test.cjs tests/critical-pages/referee-new-email.test.cjs

      - name: Check native shared resend disclosure and safeguards
        run: node --test tests/admin-email-resend/disclosure.test.cjs tests/admin-email-resend/source.test.cjs

      - name: Apply the complete production source-preparation chain
        run: npm run prebuild

      - name: Check prepared homepage night copy
        run: node --test tests/critical-pages/league-night-copy.test.cjs

      - name: Check prepared admin latest activity
        run: node --test tests/critical-pages/admin-latest-activity.test.cjs

      - name: Check prepared admin stale-deployment recovery
        run: node --test tests/admin-stale-deployment-recovery.test.cjs

      - name: Check prepared player YES team restore
        run: node --test tests/critical-pages/player-interest-team-restore.test.cjs

      - name: Check prepared exact captain preview and squad numbers
        run: node --test tests/captain-preview-squad-number.test.cjs

      - name: Check prepared referee welcome and dashboard status
        run: node --test tests/critical-pages/referee-welcome-status.test.cjs

      - name: Check prepared referee new emails and email/SMS replies
        run: SIXFL_PREPARED_SOURCE=1 node --test tests/critical-pages/referee-comms-email.test.cjs tests/critical-pages/referee-new-email.test.cjs

      - name: Check prepared shared resend disclosure and safeguards
        run: node --test tests/admin-email-resend/disclosure.test.cjs tests/admin-email-resend/source.test.cjs

      - name: Audit shared resend component, send action and preparation paths
        run: git grep -n -E 'AdminEmailResendPanel|Resend a sent email|Resend an email|resendAdminEmailAction|queueStoredAdminEmailResend' -- src scripts

      - name: Audit shared reply entry points and send actions
        shell: bash
        run: |
          git grep -n -E 'AdminMessageThreadReplyRouter|sendAdminEmailReplyAction|getAdminSmsReplyTarget|sendCentralRefereeEmailAction|NewRefereeEmailPage|NewEmailForm' -- src scripts || true
          if git grep -n -E '<AdminMessageThread\s|as never|Start with the referee welcome email' -- ':(literal)src/app/(admin)/admin/messages/referees/[id]/page.tsx'; then
            echo 'Referee conversations must retain shared replies and allow new emails without a welcome prerequisite.'
            exit 1
          fi

      - name: Audit referee welcome presentation and sending routes
        shell: bash
        run: |
          git grep -n -E 'formatWelcomeLabel|REFEREE_INVITE|referee-welcome-login-email|central_referee_welcome_invite' -- src scripts || true
          if git grep -n -F 'Welcome cancelled' -- src; then
            echo 'The ambiguous referee welcome cancellation wording must not return.'
            exit 1
          fi

      - name: Check restrained PWA push notifications
        run: node --test tests/pwa-push-notifications/contract.test.cjs

      - name: Check critical feature contracts
        run: node scripts/check-critical-feature-contracts.mjs

      - name: Check team confirmation workflow
        run: node scripts/check-team-confirmation-contract.mjs

      - name: Check Night Board fixture-change notifications
        run: node scripts/check-night-board-fixture-notifications.mjs

      - name: Check Night Board fixture issue resolution
        run: node scripts/check-night-board-fixture-issue-resolution.mjs

      - name: Check standard-team player payment links
        run: node scripts/check-standard-team-player-payment-links.mjs

      - name: Check last-minute replacement resolution
        run: node scripts/check-last-minute-replacement-resolution.mjs

      - name: Check fixture card ordering
        run: node scripts/check-fixture-card-ordering.mjs

      - name: Check sign-in link activity
        run: node scripts/check-sign-in-link-activity-contract.mjs

      - name: Check AI prediction matchup integrity
        run: node scripts/check-ai-prediction-matchup-integrity.mjs

      - name: Check AI prediction text/team integrity
        run: node scripts/check-ai-prediction-text-team-integrity.mjs

      - name: Check opponent-adjusted AI predictor
        run: npx tsx scripts/check-ai-predictor-opponent-adjusted.ts

      - name: Check fixture abandonment workflow
        run: node scripts/check-fixture-abandonment-workflow.mjs

      - name: Check abandoned result decision
        run: node scripts/check-abandoned-result-decision.mjs

      - name: Check abandonment runtime resilience
        run: node scripts/check-fixture-abandonment-runtime-resilience.mjs

      - name: Check abandonment email recovery
        run: node scripts/check-fixture-abandonment-email-recovery.mjs

      - name: Check formal conduct notice
        run: node scripts/check-fixture-formal-conduct-notice.mjs

      - name: Check native admin Kits navigation
        run: node scripts/check-native-admin-kits-navigation.mjs

      - name: Check managed squad to PlayerPool handoff
        run: node scripts/check-managed-squad-playerpool-handoff.mjs

      - name: Check admin referral email status
        run: node scripts/check-admin-referral-email-status.mjs

      - name: Check captain collection removal
        run: node scripts/check-captain-collected-removal.mjs

      - name: Snapshot protected kit source
        run: |
          git diff --binary -- \
            src/app/captain/team/\[teamid\]/kit/page.tsx \
            src/app/captain/team/\[teamid\]/kit/actions.ts \
            src/app/captain/team/\[teamid\]/kit/save-v2.ts \
            src/components/captain/TeamKitOrderForm.tsx \
            > /tmp/kit-contract-before.diff

      - name: Re-run the kit reservation preparation
        run: node scripts/apply-league-kit-design-lock.cjs

      - name: Reject non-idempotent kit reservation preparation
        shell: bash
        run: |
          git diff --binary -- \
            src/app/captain/team/\[teamid\]/kit/page.tsx \
            src/app/captain/team/\[teamid\]/kit/actions.ts \
            src/app/captain/team/\[teamid\]/kit/save-v2.ts \
            src/components/captain/TeamKitOrderForm.tsx \
            > /tmp/kit-contract-after.diff
          if ! diff -u /tmp/kit-contract-before.diff /tmp/kit-contract-after.diff; then
            echo ""
            echo "ERROR: the kit reservation preparation changed already-prepared kit source."
            echo "The reservation safeguard must be idempotent and safe to apply after the complete prebuild chain."
            exit 1
          fi

      - name: Re-check critical feature contracts
        run: |
          node scripts/check-critical-feature-contracts.mjs
          node scripts/check-team-confirmation-contract.mjs
          node scripts/check-night-board-fixture-notifications.mjs
          node scripts/check-night-board-fixture-issue-resolution.mjs
          node scripts/check-standard-team-player-payment-links.mjs
          node scripts/check-last-minute-replacement-resolution.mjs
          node scripts/check-fixture-card-ordering.mjs
          node scripts/check-sign-in-link-activity-contract.mjs
          node scripts/check-ai-prediction-matchup-integrity.mjs
          node scripts/check-ai-prediction-text-team-integrity.mjs
          npx tsx scripts/check-ai-predictor-opponent-adjusted.ts
          node scripts/check-fixture-abandonment-workflow.mjs
          node scripts/check-abandoned-result-decision.mjs
          node scripts/check-fixture-abandonment-runtime-resilience.mjs
          node scripts/check-fixture-abandonment-email-recovery.mjs
          node scripts/check-fixture-formal-conduct-notice.mjs

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check protected application source
        run: npx tsc --noEmit
