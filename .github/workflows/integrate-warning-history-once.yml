name: Integrate warning history native callsites once
on:
  pull_request:
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.pull_request.number == 472 && github.event.pull_request.head.repo.full_name == 'MathewCobley/Sixfl' && github.event.pull_request.head.ref == 'fix/player-payment-warning-history'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply reviewed native page and test changes on the feature branch only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/(admin)/admin/payments/page.tsx');s=p.read_text()
          changes=[
            ('import FormListboxField', 'import PlayerPaymentWarningStatus from "@/components/admin/payments/PlayerPaymentWarningStatus";\nimport RefreshPaymentWarningStatus from "@/components/admin/payments/RefreshPaymentWarningStatus";\nimport { getLatestPlayerPaymentWarnings } from "@/lib/payments/player-payment-warning-history";\nimport FormListboxField'),
            ('  const showTeamCharges =', '  const latestPlayerWarnings = await getLatestPlayerPaymentWarnings(showPlayerFees ? visibleOpenPlayerFees.map(fee => fee.id) : []);\n  const showTeamCharges ='),
          ]
          anchor='                        {formatLastChasedLabel(fee.lastChasedAt)}\n                      </div>'
          changes.append((anchor,anchor+'\n                      <PlayerPaymentWarningStatus feeId={fee.id} warning={latestPlayerWarnings.get(fee.id)} showHistoryLink />'))
          anchor='Showing {visibleOpenPlayerFees.length} of {filteredOpenPlayerFees.length} matching open player fees.\n              </p>'
          changes.append((anchor,anchor+'\n              <div className="mt-3"><RefreshPaymentWarningStatus /></div>'))
          for old,new in changes:
              assert s.count(old)==1,(old,s.count(old))
              s=s.replace(old,new)
          p.write_text(s)
          p=Path('tests/player-payment-warning.test.cjs');s=p.read_text()
          assert 'warning status reads existing outbox' not in s
          p.write_text(s+'''
          test('warning status reads existing outbox records for the exact fee, including queued, sent and later failure', async () => {
            const history = load('src/lib/payments/player-payment-warning-history.ts');
            const first = await target(), second = await target();
            const originalFees = await prisma.playerMatchFee.findMany({ orderBy: { id: 'asc' } });
            const queued = await send(await preview(first));
            let latest = await history.getLatestPlayerPaymentWarnings([first.fee.id, second.fee.id]);
            assert.equal(latest.get(first.fee.id).label, 'Warning queued');
            assert.equal(latest.has(second.fee.id), false);
            assert.equal(providerCalls.length, 0);
            const initialDispatchCount = await prisma.notificationDispatch.count();
            await history.getPlayerPaymentWarningHistory(first.fee.id);
            assert.equal(await prisma.notificationDispatch.count(), initialDispatchCount);
            await processor.processNotificationQueue(100);
            latest = await history.getLatestPlayerPaymentWarnings([first.fee.id]);
            assert.equal(latest.get(first.fee.id).label, 'Warning sent');
            assert.match(latest.get(first.fee.id).deadline, /10 Sept 2026/);
            await prisma.notificationDispatch.update({ where: { id: queued.dispatchId }, data: { status: 'FAILED', failedAt: now, failureReason: 'Simulated later delivery failure' } });
            const records = await history.getPlayerPaymentWarningHistory(first.fee.id);
            assert.equal(records[0].label, 'Warning failed');
            assert.equal(records[0].failureReason, 'Simulated later delivery failure');
            assert.deepEqual(await prisma.playerMatchFee.findMany({ orderBy: { id: 'asc' } }), originalFees);
            assert.equal(providerCalls.length, 1);
          });
          ''')
          PY
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/(admin)/admin/payments/page.tsx' tests/player-payment-warning.test.cjs
          test "$(git diff --cached --name-only | wc -l)" = 2
          git commit -m 'Render exact-fee warning history on the native payment cards and test the real outbox'
          git push origin HEAD:refs/heads/fix/player-payment-warning-history
