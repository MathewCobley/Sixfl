name: Reassurance auto SMS build check

on:
  pull_request:
    paths:
      - "src/app/(admin)/admin/leads/reassurance-email-actions.ts"
      - "src/components/admin/leads/LeadConfirmationQuickSendButton.tsx"
      - ".github/workflows/reassurance-auto-sms-build-check.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check application
        id: typecheck
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee tsc-output.txt
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload type-check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reassurance-auto-sms-typecheck-${{ github.sha }}
          path: tsc-output.txt
          retention-days: 1

      - name: Fail if type-check failed
        if: steps.typecheck.outputs.status != '0'
        run: exit 1
