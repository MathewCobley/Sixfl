name: Reassurance auto SMS build check

on:
  pull_request:
    paths:
      - "src/app/(admin)/admin/leads/reassurance-email-actions.ts"
      - "src/components/admin/leads/LeadConfirmationQuickSendButton.tsx"
      - ".github/workflows/reassurance-auto-sms-build-check.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check application
        run: npx tsc --noEmit
