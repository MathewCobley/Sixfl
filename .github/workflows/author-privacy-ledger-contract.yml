name: Update privacy-aware ledger contract
on:
  push:
    branches: [fix/admin-only-payment-adjustment-visibility]
    paths: [.github/workflows/author-privacy-ledger-contract.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Strengthen existing native presentation assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/player-ledger.test.ts')
          s=p.read_text()
          old=r'''  assert.match(readFileSync("src/app/captain/team/[teamid]/payments/page.tsx","utf8"),/getPlayerPaymentDisplay\(fee, playerReceiptStates.get\(fee.id\)\)/);'''
          new=r'''  const captainPayments=readFileSync("src/app/captain/team/[teamid]/payments/page.tsx","utf8");
            assert.match(captainPayments,/const correctionAccess = await requireCaptain\(teamid\)/);
            assert.match(captainPayments,/const showAdjustmentDetails = mayViewPaymentAdjustments\(correctionAccess\)/);
            assert.match(captainPayments,/getPlayerPaymentDisplay\(fee, playerReceiptStates.get\(fee.id\), showAdjustmentDetails \? "admin" : "captain"\)/);'''
          assert s.count(old)==1, 'Expected original exact shared-display assertion'
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git diff -- tests/player-ledger.test.ts
          test "$GITHUB_REF" = refs/heads/fix/admin-only-payment-adjustment-visibility
          git config user.name 'SIXFL maintenance'
          git config user.email 'noreply@users.noreply.github.com'
          git add tests/player-ledger.test.ts
          git commit -m 'Verify authenticated admin/captain audience in the existing ledger contract'
          git push origin HEAD:refs/heads/fix/admin-only-payment-adjustment-visibility
