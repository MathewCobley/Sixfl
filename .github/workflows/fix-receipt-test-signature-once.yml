name: Correct receipt webhook test signature typing once
on:
  push:
    branches: [fix/player-partial-payment-integrity]
    paths: ['.github/workflows/fix-receipt-test-signature-once.yml']
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-partial-payment-integrity
      - name: Correct only the isolated signed test request helper
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('tests/player-ledger.test.ts')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='600a2edb5929b22e415d41528461b446b1c1a10c1521adc3e0f1fd258e8c6a5e'
          s=p.read_text().replace('import { randomUUID, randomBytes }','import { randomUUID, randomBytes, createHmac }')
          assert s.count('stripe.webhooks.generateTestHeaderString({payload,secret})')==2
          s=s.replace('stripe.webhooks.generateTestHeaderString({payload,secret})','signedTestHeader(payload,secret)')
          s=s.replace('const past=()=>','''function signedTestHeader(payload: string, secret: string) {
            const timestamp = Math.floor(Date.now() / 1000);
            return `t=${timestamp},v1=${createHmac("sha256", secret).update(`${timestamp}.${payload}`).digest("hex")}`;
          }
          const past=()=>''')
          p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='8c851a99cbddb4f585d50aadcb52aaa39beff22be1b17ccdfa216aec0190badc'
          PY
          git config user.name 'SIXFL source integration'
          git config user.email '262667783+MathewCobley@users.noreply.github.com'
          git add tests/player-ledger.test.ts
          git commit -m 'Use actual HMAC signatures in ordinary and team webhook regression tests'
          git push origin HEAD:fix/player-partial-payment-integrity
