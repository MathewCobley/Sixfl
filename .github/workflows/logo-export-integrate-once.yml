name: Prepare logo export entry point once
on:
  push:
    branches: [feat/select-team-logo-export]
    paths: ['.github/workflows/logo-export-integrate-once.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/select-team-logo-export
      - name: Add the native Teams header link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/(admin)/admin/teams/page.tsx')
          s=p.read_text()
          anchor='''        <Link
                    href="/admin/teams/new"'''
          # Match the existing header without reformatting or replacing its other controls.
          anchor='        <Link\n          href="/admin/teams/new"'
          assert s.count(anchor)==1
          s=s.replace(anchor, '        <div className="flex flex-wrap items-center gap-3">\n          <Link href="/admin/teams/logos" className="inline-flex items-center justify-center rounded-xl border border-emerald-400/30 bg-emerald-500/10 px-4 py-2.5 text-sm font-semibold text-emerald-200 hover:bg-emerald-500/20">Download team logos</Link>\n'+anchor)
          end='          Add team\n        </Link>'
          assert s.count(end)==1
          s=s.replace(end,end+'\n        </div>')
          p.write_text(s)
          PY
          git config user.name 'SIXFL maintenance'
          git config user.email 'maintenance@sixfl.co.uk'
          git add 'src/app/(admin)/admin/teams/page.tsx'
          git commit -m 'Add native Download team logos link to Teams header'
          git push origin HEAD:refs/heads/feat/select-team-logo-export
      - name: Review existing export and image sources
        run: |
          git grep -nE 'archiver|fflate|jszip|createZip|application/zip|team-logos|isFixturePlaceholder' -- src/lib src/app/api/admin/teams src/app/api/team-badges | head -90 || true
          git ls-files '*AGENTS.md' '*badge*' '*logo*' '*zip*' '*critical-feature*'
