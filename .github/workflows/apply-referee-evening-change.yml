name: Apply checked referee source transfer
on:
  push:
    branches: [fix/referee-evening-digest-20260905]
    paths:
      - '.sixfl-referee-change.*.b64'
      - '.github/workflows/apply-referee-evening-change.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'MathewCobley/Sixfl' && github.ref == 'refs/heads/fix/referee-evening-digest-20260905'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate complete transfer and every original/result hash before writing
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          root = pathlib.Path('.')
          parts = sorted(root.glob('.sixfl-referee-change.*.b64'))
          assert len(parts) == 7, 'All seven transfer chunks are required'
          text = ''.join(p.read_text().strip() for p in parts)
          for p in parts:
              print(p, hashlib.sha256(p.read_text().strip().encode()).hexdigest(), flush=True)
          assert hashlib.sha256(text.encode()).hexdigest() == 'a32a4459997872c778c8e47288004654d13a9c917591feff96d00e0d434f6a8c', 'Transfer checksum mismatch'
          entries = json.loads(gzip.decompress(base64.b64decode(text, validate=True)))
          assert len(entries) == 20
          outputs = []
          for entry in entries:
              path = pathlib.Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert str(path).startswith(('src/', 'prisma/migrations/', 'tests/', 'scripts/check-', 'docs/'))
              old = path.read_bytes() if path.exists() else None
              before = hashlib.sha256(old).hexdigest() if old is not None else None
              assert before == entry['before'], f'Original changed: {path}'
              lines = (old or b'').decode().splitlines(keepends=True)
              for start, end, replacement in reversed(entry['edits']):
                  lines[start:end] = replacement.splitlines(keepends=True)
              new = ''.join(lines).encode()
              assert hashlib.sha256(new).hexdigest() == entry['after'], f'Result mismatch: {path}'
              outputs.append((path, new))
          for path, data in outputs:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              print('Verified native source:', path, hashlib.sha256(data).hexdigest(), flush=True)
          for part in parts:
              part.unlink()
          subprocess.run(['git', 'add', '--', *[str(p) for p, _ in outputs], *[str(p) for p in parts]], check=True)
          PY
      - name: Commit native source without changing workflows or main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Consolidate referee evening booking and reminder delivery'
          git push origin HEAD:fix/referee-evening-digest-20260905
          git show --stat --oneline HEAD
