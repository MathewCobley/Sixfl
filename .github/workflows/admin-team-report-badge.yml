name: Admin team match-report badges
on:
  pull_request:
    paths:
      - 'src/lib/admin/team-match-report-activity.ts'
      - 'src/components/admin/teams/TeamMatchReportBadge.tsx'
      - 'src/app/(admin)/admin/teams/**'
      - 'src/app/captain/team/**/results/page.tsx'
      - 'prisma/**'
      - 'scripts/**'
      - 'tests/admin-team-match-report-badge.test.cjs'
      - '.github/workflows/admin-team-report-badge.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/admin/team-match-report-activity.ts'
      - 'src/components/admin/teams/TeamMatchReportBadge.tsx'
      - 'src/app/(admin)/admin/teams/**'
      - 'src/app/captain/team/**/results/page.tsx'
      - 'tests/admin-team-match-report-badge.test.cjs'
      - '.github/workflows/admin-team-report-badge.yml'
permissions:
  contents: read
concurrency:
  group: report-badge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  badges:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: sixfl_report_badge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sixfl_report_badge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test_only_password@127.0.0.1:5432/sixfl_report_badge_test
      REPORT_BADGE_TEST_DATABASE_URL: postgresql://postgres:test_only_password@127.0.0.1:5432/sixfl_report_badge_test
      NEXTAUTH_SECRET: report-badge-ci-only
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      RESEND_API_KEY: re_report_badge_ci_placeholder
      EMAIL_FROM: SIXFL <noreply@example.invalid>
      EMAIL_REPLY_DOMAIN: example.invalid
      CRON_SECRET: report-badge-ci-unused
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Test native badges, owning pages and real read-only SQL
        run: node --test tests/admin-team-match-report-badge.test.cjs
      - name: Record shared source fingerprints
        run: sha256sum src/lib/admin/team-match-report-activity.ts src/components/admin/teams/TeamMatchReportBadge.tsx > /tmp/badge.sha
      - run: npm run prebuild
      - run: npx prisma generate
      - name: Repeat against complete production-prepared source
        run: |
          sha256sum -c /tmp/badge.sha
          node --test tests/admin-team-match-report-badge.test.cjs
          node scripts/check-critical-feature-contracts.mjs
          node --test tests/team-move-confirmation.test.cjs tests/team-move-confirmation-review.test.cjs
      - run: npx tsc --noEmit
      - run: npx next build
      - name: Audit private placement and absence of temporary authoring
        run: |
          git grep -n 'TeamMatchReportBadge\|getAdminTeamMatchReportActivity' -- src
          test ! -f .github/workflows/report-badge-workspace.yml
          test ! -f .github/workflows/report-badge-integrate.yml
          test ! -f .github/workflows/report-badge-repair.yml
