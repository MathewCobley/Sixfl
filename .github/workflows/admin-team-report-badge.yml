name: Admin team match-report badge retirement
on:
  pull_request:
    paths:
      - 'src/app/(admin)/admin/teams/**'
      - 'src/components/admin/teams/TeamMatchReportBadge.tsx'
      - 'src/lib/admin/team-match-report-activity.ts'
      - '.github/workflows/admin-team-report-badge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: report-badge-retired-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Keep retired match-report badges out of admin team pages
        run: |
          if git grep -n -E 'TeamMatchReportBadge|getAdminTeamMatchReportActivity|Match reports ·' -- 'src/app/(admin)/admin/teams' 'src/components/admin/teams' 'src/lib/admin' 2>/dev/null; then
            echo "Legacy admin match-report badge wiring has been reintroduced."
            exit 1
          fi
          echo "Admin match-report badge remains retired; SIXFL TV Priority is the team activity signal."
