name: Isolated native PlayerPool verification
on:
  push:
    branches: [maintenance/playerpool-native-verify-20260912]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sixfl_pool_response_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sixfl_pool_response_test
      NEXTAUTH_SECRET: isolated-playerpool-response-only
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      EMAIL_REPLY_DOMAIN: replies.example.invalid
      RESEND_API_KEY: re_isolated_no_delivery
      EMAIL_FROM: SIXFL <noreply@example.invalid>
      SIXFL_POOL_RESPONSE_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load exact reviewed patch into disposable developer checkout
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout --detach f6d0fcca6b42b6e036cd0debff6fa71e455e98ea
          python3 - <<'PY'
          import base64,gzip,hashlib,json,subprocess
          from pathlib import Path
          chunks=[]
          for sha in ['1b9aa7bada150f09340681e8fd3f331b0cf60e89','be00bd8b5218f6bb1876392443a07e076559a252','9ce2e83cd36949d0fedf3dcec8a3b1e11182cd7a']:
              response=json.loads(subprocess.check_output(['gh','api','repos/MathewCobley/Sixfl/git/blobs/'+sha]))
              chunks.append(base64.b64decode(response['content']).decode())
          patch=gzip.decompress(base64.b64decode(''.join(chunks)))
          assert hashlib.sha256(patch).hexdigest()=='1135e069bb5285700c8d699d3a2c3bdbaab73430361cc08e1d77798c078226a7'
          Path('/tmp/native-playerpool.patch').write_bytes(patch)
          subprocess.run(['git','apply','--index','/tmp/native-playerpool.patch'],check=True)
          p=Path('src/lib/player-pool/response-chase.ts');s=p.read_text()
          s=s.replace("SELECT pg_advisory_xact_lock(hashtext('playerpool-response:' || ${email}))`", "SELECT pg_advisory_xact_lock(hashtext('playerpool-response:' || ${email}))::text`")
          p.write_text(s)
          # This obsolete preparation step cannot recognise the newer native
          # edit/comms buttons. Remove it, retaining the actual owning page.
          p=Path('package.json');s=p.read_text();assert 'node scripts/apply-player-pool-comms-link.cjs && ' in s
          p.write_text(s.replace('node scripts/apply-player-pool-comms-link.cjs && ',''))
          Path('scripts/apply-player-pool-comms-link.cjs').unlink()
          subprocess.run(['git','add','-u'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(names)==21
          assert not any('playerpool-verify-native' in x for x in names)
          entries=[]
          for name in names:
              entry={'path':name,'mode':'100644','type':'blob'}
              if Path(name).exists(): entry['content']=Path(name).read_text()
              else: entry['sha']=None
              entries.append(entry)
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          Path('/tmp/playerpool-native-source.json').write_text(json.dumps({'base_tree':tree,'tree':entries}))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Native-source checks and current application preparation
        run: |
          node scripts/check-player-pool-profile-reminders.mjs
          test ! -f scripts/apply-player-pool-nudge-history.cjs
          test ! -f scripts/apply-player-pool-comms-link.cjs
          npm run prebuild
          node scripts/check-critical-feature-contracts.mjs
          npx prisma generate
      - run: npx tsc --noEmit
      - run: npx prisma db push --skip-generate
      - name: Isolated PostgreSQL regressions; no customer providers
        run: |
          node -e 'require("esbuild").buildSync({entryPoints:["tests/playerpool-response-chase.test.ts"],outfile:".playerpool-response-tests.cjs",bundle:true,platform:"node",packages:"external",jsx:"automatic"})'
          node --test .playerpool-response-tests.cjs
      - run: npx next build
      - name: Export reviewable native objects without updating any branch
        if: always() && steps.native.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          data=json.loads(Path('/tmp/playerpool-native-source.json').read_text())
          for entry in data['tree']:
              if 'content' not in entry: continue
              content=entry.pop('content');raw=content.encode()
              expected=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              if entry['path'].startswith('.github/workflows/'):
                  entry['sha']=expected
              else:
                  reply=subprocess.check_output(['gh','api','--method','POST','repos/MathewCobley/Sixfl/git/blobs','--input','-'],input=json.dumps({'content':content,'encoding':'utf-8'}).encode())
                  entry['sha']=json.loads(reply)['sha'];assert entry['sha']==expected
          Path('/tmp/playerpool-native-objects.json').write_text(json.dumps(data,indent=2))
          print('Native source objects exported for PR review. Test results above remain authoritative. No branch or production data changed.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playerpool-native-source-review
          path: |
            /tmp/playerpool-native-source.json
            /tmp/playerpool-native-objects.json
          retention-days: 2
