name: Prepare native ledger consistency
on:
  push:
    branches: [fix/consistent-player-fixture-ledger]
    paths: [.github/workflows/author-ledger-consistency.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/consistent-player-fixture-ledger'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Author native source only (no production access)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def once(text, old, new):
              assert text.count(old)==1, (old[:120],text.count(old))
              return text.replace(old,new,1)
          p=Path('src/lib/payments/player-payment-display.ts');s=p.read_text()
          s=once(s,'  return { statusLabel, detail, amountPence, receivedPence: received, captainReceivedPence: captainReceived,', '''  // Fixture contribution is distinct from the player-facing charge/receipt
            // amount above. Captain-held money is not received by SIXFL until remitted.
            // Pending liabilities and unverified historic differences add no coverage.
            const fixtureContributionPence = received + subsidy;
            return { statusLabel, detail, amountPence, receivedPence: received, captainReceivedPence: captainReceived,
              fixtureContributionPence, adjustmentPence: subsidy, assignedPence: assigned,''')
          p.write_text(s)
          p=Path('src/app/captain/team/[teamid]/payments/page.tsx');s=p.read_text()
          s='import { getChargeDescriptionForDisplay, getCurrentSettlementText, getPlayerSettlementBreakdown } from "@/lib/payments/payment-ledger-presentation";\n'+s
          s=once(s,'      statusLabel: string;\n      statusMeta: string;','      outstandingPence: number;\n      statusLabel: string;\n      statusMeta: string;')
          s=once(s,'    const displayAmountPence = display.amountPence;','    const displayAmountPence = display.fixtureContributionPence;')
          s=once(s,'      amountPence: displayAmountPence,\n      statusLabel,','      amountPence: displayAmountPence,\n      outstandingPence: display.outstandingPence,\n      statusLabel,')
          s=once(s,'''              const playerSettledPence =
                          entry.playerPaidPence + entry.playerSubsidyPence;'''.replace('                          ','                '),'''              const playerSettlement = getPlayerSettlementBreakdown(entry);
                        const playerSettledPence = playerSettlement.totalPence;
                        const displayedPlayerTotalPence = playerCollectionDetails.reduce((sum, payment) => sum + payment.amountPence, 0);'''.replace('                        const','              const'))
          s=once(s,'''                playerCollectionDetails
                            .filter((payment) => payment.statusLabel === "Awaiting payment")
                            .reduce((sum, payment) => sum + payment.amountPence, 0),'''.replace('                            ','                  '),'''                playerCollectionDetails.reduce((sum, payment) => sum + payment.outstandingPence, 0),''')
          s=once(s,'{entry.description || "No description"}','{getChargeDescriptionForDisplay(entry.description) || "No description"}')
          s=once(s,'''                      {entry.latePaymentFeeStatus === "APPLIED"''','''                      <p data-current-settlement className="mt-2 text-sm text-white/70">{getCurrentSettlementText(entry)}</p>

                                {entry.latePaymentFeeStatus === "APPLIED"'''.replace('                                {','                      {'))
          s=once(s,'''                            Player payment details
                                    </div>'''.replace('                                    ','                          '),'''                            Player payment details
                                    </div>
                                    <p className="px-3 py-2 text-xs leading-5 text-white/60">
                                      Bold amounts are contributions received by SIXFL plus recorded SIXFL adjustments. Unpaid requests and money still held by the captain are not included.
                                    </p>'''.replace('                                    ','                          ').replace('                                      ','                            '))
          s=once(s,'                                key={payment.id}\n                                className=', '                                key={payment.id}\n                                data-player-contribution-pence={payment.amountPence}\n                                className=')
          s=once(s,'className="flex shrink-0 items-center gap-3 sm:justify-end"','className="flex min-w-0 flex-wrap items-center gap-3 sm:justify-end"')
          s=once(s,'''                                      {formatMoney(payment.amountPence)}
                                              </div>'''.replace('                                              ','                                    '),'''                                      {formatMoney(payment.amountPence)}
                                              </div>
                                              <div className="text-[10px] text-white/50">Contribution to fixture</div>'''.replace('                                              ','                                    '))
          s=once(s,'className="mt-0.5 text-[11px] text-white/40"','className="mt-0.5 max-w-md break-words text-[11px] text-white/50"')
          anchor='''                            ))}
                                    </div>
                                  </div>
                                ) : entry.playerPaidPence'''.replace('                                    ','                          ').replace('                                  ','                        ').replace('                                ','                      ')
          replacement='''                            ))}
                                    </div>
                                    <div data-player-contributions-total={displayedPlayerTotalPence} className="flex items-center justify-between gap-4 border-t border-white/10 px-3 py-3 text-sm font-semibold text-white">
                                      <span>Total player contributions shown</span><span>{formatMoney(displayedPlayerTotalPence)}</span>
                                    </div>
                                    {displayedPlayerTotalPence !== playerSettledPence ? (
                                      <p role="status" className="px-3 pb-3 text-xs text-amber-100">The player rows total {formatMoney(displayedPlayerTotalPence)}, but the fixture ledger records {formatMoney(playerSettledPence)} from players and adjustments. SIXFL needs to review the linked records; no balancing adjustment has been assumed.</p>
                                    ) : null}
                                  </div>
                                ) : entry.playerPaidPence'''.replace('                                      ','                            ').replace('                                    ','                          ').replace('                                  ','                        ').replace('                                ','                      ')
          s=once(s,anchor,replacement)
          anchor='''                          {!isKitCharge ? (
                                      <div className="flex items-center justify-between gap-4">
                                        <span>Player shares settled</span>'''.replace('                                      ','                            ').replace('                                        ','                              ')
          replacement='''                          {!isKitCharge ? (
                                      <>
                                        <div data-player-cash-pence={playerSettlement.cashPence} className="flex items-center justify-between gap-4">
                                          <span>Player payments received</span><span className="font-semibold text-white">{formatMoney(playerSettlement.cashPence)}</span>
                                        </div>
                                        <div data-player-adjustments-pence={playerSettlement.adjustmentPence} className="flex items-center justify-between gap-4">
                                          <span>SIXFL player adjustments</span><span className="font-semibold text-white">{formatMoney(playerSettlement.adjustmentPence)}</span>
                                        </div>
                                      <div data-player-settled-pence={playerSettledPence} className="flex items-center justify-between gap-4 border-t border-white/10 pt-2">
                                        <span>Player shares settled</span>'''.replace('                                          ','                                ').replace('                                        ','                              ').replace('                                      ','                            ')
          s=once(s,anchor,replacement)
          s=once(s,'''                                {formatMoney(playerSettledPence)}
                                        </span>
                                      </div>
                                    ) : null}'''.replace('                                        ','                              ').replace('                                      ','                            ').replace('                                    ','                          '),'''                                {formatMoney(playerSettledPence)}
                                        </span>
                                      </div>
                                      </>
                                    ) : null}'''.replace('                                        ','                              ').replace('                                      ','                            ').replace('                                    ','                          '))
          s=once(s,'''                        <div className="mt-3 border-t border-white/10 pt-3">''','''                        {entry.settledPence > totalAppliedPence ? (
                                    <p className="mt-3 text-xs text-white/65">Recorded payments, credit and adjustments total {formatMoney(entry.settledPence)}. {formatMoney(entry.settledPence - totalAppliedPence)} is above this charge; only {formatMoney(totalAppliedPence)} is applied below. Adjustments do not create cash or team credit.</p>
                                  ) : null}
                                  <div className="mt-3 border-t border-white/10 pt-3">'''.replace('                                    ','                          ').replace('                                  ','                        '))
          s=once(s,'{formatMoney(totalAppliedPence)} settled.','{formatMoney(entry.settledPence)} recorded settlement. {formatMoney(totalAppliedPence)} is applied to this fixture.')
          s=s.replace('getChargeStatusTone(entry.displayStatus)', 'getChargeStatusTone(entry.displayStatus)')
          s=once(s,'{formatChargeStatus(entry.displayStatus, entry.waivedPence)}','{formatChargeStatus(entry.displayStatus, entry.waivedPence + entry.playerSubsidyPence)}')
          p.write_text(s)
          p=Path('src/app/captain/team/[teamid]/player-payments/PaymentPageServer.tsx');s=p.read_text()
          s='import { getCurrentSettlementText, getPlayerSettlementBreakdown } from "@/lib/payments/payment-ledger-presentation";\n'+s
          s=once(s,'  const captainSettledPence = collectedPence + zeroFeeSettledPence;', '''  const playerSettlement = getPlayerSettlementBreakdown(selectedEntry ?? { playerPaidPence: 0, playerSubsidyPence: 0 });
            const captainSettledPence = playerSettlement.totalPence;''')
          s=once(s,'summaryText = `${formatMoney(selectedEntry.amountPence)} has been covered: ${formatMoney(directPaidPence)} paid directly by the team and ${formatMoney(captainSettledPence)} of player shares settled.`;','summaryText = `${getCurrentSettlementText(selectedEntry)} Player contributions: ${playerSettlement.detail}. Any direct team payments, credit or waivers are included in the team ledger.`;')
          s=once(s,'text: `${selectedSettledPlayerCount} player share${selectedSettledPlayerCount === 1 ? "" : "s"} settled.`,','text: playerSettlement.detail,')
          s=once(s,'const captainPlayerSettledPence = entry.playerPaidPence + zeroFeeSettledPence;','const fixturePlayerSettlement = getPlayerSettlementBreakdown(entry);\n              const captainPlayerSettledPence = fixturePlayerSettlement.totalPence;')
          s=once(s,'<div>Player shares settled: {formatMoney(captainPlayerSettledPence)}</div>','<div>Player shares settled: {formatMoney(captainPlayerSettledPence)}</div>\n                        <div>{fixturePlayerSettlement.detail}</div>')
          p.write_text(s)
          PY
          git diff --check
          git diff --stat
          git diff -- src/lib/payments/player-payment-display.ts 'src/app/captain/team/[teamid]/payments/page.tsx' 'src/app/captain/team/[teamid]/player-payments/PaymentPageServer.tsx'
      - name: Commit source to fix branch only
        run: |
          test "$GITHUB_REF" = refs/heads/fix/consistent-player-fixture-ledger
          git config user.name 'SIXFL maintenance'
          git config user.email 'noreply@users.noreply.github.com'
          git add src/lib/payments/player-payment-display.ts 'src/app/captain/team/[teamid]/payments/page.tsx' 'src/app/captain/team/[teamid]/player-payments/PaymentPageServer.tsx'
          git commit -m 'Show consistent fixture contributions and split cash from verified adjustments'
          git push origin HEAD:refs/heads/fix/consistent-player-fixture-ledger
