name: Integrate reviewed admin charge correction once
on:
  push:
    branches: [feat/admin-player-charge-correction]
    paths: ['.github/workflows/integrate-admin-charge-correction-once.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-player-charge-correction
      - name: Apply hash-checked native source only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,subprocess
          from pathlib import Path
          parts=[]
          for sha in ['4143fe1d8caa452f10d42f2442654276663b6bb5','d35aeb95dbc3c01d9e25f97262c816c85c9addf3','4f95425606b3278dfdc89aedeaae133b651211fe']:
            blob=json.loads(subprocess.check_output(['gh','api',f'repos/MathewCobley/Sixfl/git/blobs/{sha}']))
            parts.append(base64.b64decode(blob['content']).decode())
          raw=gzip.decompress(base64.b64decode(''.join(parts)))
          assert hashlib.sha256(raw).hexdigest()=='e8bda86d04b5fe3c3cffd8ed70ae0c21e5c95494354a921e8575c48693616b42'
          edits=json.loads(raw);assert len(edits)==12
          paths=[]
          for item in edits:
            p=Path(item['path']);assert not p.is_absolute() and '..' not in p.parts
            if p.parts[0]=='.github':continue
            assert p.parts[0] in ['src','tests','docs']
            if item['before'] is None:
              assert not p.exists(),str(p)
              data=item['content'].encode()
            else:
              before=p.read_bytes();assert hashlib.sha256(before).hexdigest()==item['before'],str(p)+' baseline mismatch'
              lines=before.decode().splitlines(keepends=True)
              for start,end,text in reversed(item['edits']):lines[start:end]=[text]
              data=''.join(lines).encode()
            assert hashlib.sha256(data).hexdigest()==item['after'],str(p)+' output mismatch'
            p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data);paths.append(str(p))
            print('Verified source:',p,item['after'])
          subprocess.run(['git','config','user.name','SIXFL source integration'],check=True)
          subprocess.run(['git','config','user.email','262667783+MathewCobley@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','commit','-m','Add admin-only verified original player charge correction with paused collection'],check=True)
          subprocess.run(['git','push','origin','HEAD:feat/admin-player-charge-correction'],check=True)
          PY
