name: Apply fixture card sort

on:
  push:
    branches:
      - fix/fixture-cards-newest-first

permissions:
  contents: write

jobs:
  apply-source-change:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/fixture-cards-newest-first
          fetch-depth: 0

      - name: Update fixture card ordering in the owning component
        run: |
          python <<'PY'
          from pathlib import Path

          component = Path("src/components/admin/fixtures/FixtureMatchupGrid.tsx")
          source = component.read_text(encoding="utf-8")

          old = "\n".join([
              '  const fixturesByRound = useMemo(() => {',
              '    const grouped = new Map<string, GridFixture[]>();',
              '    for (const fixture of fixtures) {',
              '      const key = getWeekLabel(fixture.round);',
              '      grouped.set(key, [...(grouped.get(key) ?? []), fixture]);',
              '    }',
              '    return Array.from(grouped.entries()).sort(([a], [b]) => {',
              '      const aNumber = Number(a.replace("Week ", ""));',
              '      const bNumber = Number(b.replace("Week ", ""));',
              '      if (Number.isFinite(aNumber) && Number.isFinite(bNumber)) return aNumber - bNumber;',
              '      return a.localeCompare(b);',
              '    });',
              '  }, [fixtures]);',
          ])

          new = "\n".join([
              '  const fixturesByRound = useMemo(() => {',
              '    const grouped = new Map<string, GridFixture[]>();',
              '    for (const fixture of fixtures) {',
              '      const key = getWeekLabel(fixture.round);',
              '      grouped.set(key, [...(grouped.get(key) ?? []), fixture]);',
              '    }',
              '',
              '    const fixtureDayFormatter = new Intl.DateTimeFormat("en-GB", {',
              '      timeZone: "Europe/London",',
              '      year: "numeric",',
              '      month: "2-digit",',
              '      day: "2-digit",',
              '    });',
              '',
              '    return Array.from(grouped.entries())',
              '      .map(',
              '        ([roundLabel, roundFixtures]) =>',
              '          [',
              '            roundLabel,',
              '            [...roundFixtures].sort((a, b) => {',
              '              const aKickoff = new Date(a.kickoffAt).getTime();',
              '              const bKickoff = new Date(b.kickoffAt).getTime();',
              '              const sameMatchDay =',
              '                fixtureDayFormatter.format(aKickoff) === fixtureDayFormatter.format(bKickoff);',
              '',
              '              if (!sameMatchDay) return bKickoff - aKickoff;',
              '              if (aKickoff !== bKickoff) return aKickoff - bKickoff;',
              '              return (a.position ?? Number.MAX_SAFE_INTEGER) -',
              '                (b.position ?? Number.MAX_SAFE_INTEGER);',
              '            }),',
              '          ] as [string, GridFixture[]],',
              '      )',
              '      .sort(([a], [b]) => {',
              '        const aNumber = Number(a.replace("Week ", ""));',
              '        const bNumber = Number(b.replace("Week ", ""));',
              '        if (Number.isFinite(aNumber) && Number.isFinite(bNumber)) return bNumber - aNumber;',
              '        if (Number.isFinite(aNumber)) return -1;',
              '        if (Number.isFinite(bNumber)) return 1;',
              '        return a.localeCompare(b);',
              '      });',
              '  }, [fixtures]);',
          ])

          if new in source:
              print("Fixture card ordering is already updated.")
          elif old not in source:
              raise SystemExit("Expected fixturesByRound block was not found; refusing a blind edit.")
          else:
              component.write_text(source.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/apply-fixture-card-sort.yml")
          workflow.unlink()
          PY

      - name: Commit native source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/fixtures/FixtureMatchupGrid.tsx .github/workflows/apply-fixture-card-sort.yml
          git commit -m "Sort fixture cards newest first"
          git push origin HEAD:fix/fixture-cards-newest-first
