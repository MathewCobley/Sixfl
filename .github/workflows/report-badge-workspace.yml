name: Temporary report badge source
on:
  push:
    branches: [feature/admin-team-match-report-badge]
    paths: [.github/workflows/report-badge-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz -o /tmp/report-badge-source.tar.gz HEAD src prisma scripts tests config docs .github package.json package-lock.json tsconfig.json next-env.d.ts next.config.ts postcss.config.mjs eslint.config.mjs AGENTS.md ENGINEERING.md DEV_RULES.md
      - uses: actions/upload-artifact@v4
        with:
          name: report-badge-source
          path: /tmp/report-badge-source.tar.gz
          retention-days: 1
