name: Prepare native fixture reminder fix
on:
  push:
    branches: [fix/fixture-publish-reminder-context]
    paths: [.github/workflows/author-fixture-reminder-fix.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/fixture-publish-reminder-context'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare native source (temporary authoring only)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(text, old, new):
              assert text.count(old) == 1, (old[:90], text.count(old))
              return text.replace(old,new,1)
          p=Path('src/lib/payments/fixture-match-fees.ts'); s=p.read_text()
          helper='''/** Load editable copy for reminderIntro; never weaken the unresolved-field guard.
           * The first/follow-up messages retain their existing 24h/72h schedule.
           * No saved dispatch is changed or replayed by this context repair. */
          async function getFixtureMatchFeeReminderIntro(channel: "EMAIL" | "SMS", hoursAfterKickoff: number) {
            const stage = hoursAfterKickoff === 24 ? "first" : "follow-up";
            const key = `match-fee-reminder-intro-${channel.toLowerCase()}-${stage}`;
            const template = await prisma.notificationTemplate.findUnique({
              where: { key },
              select: { body: true, isActive: true, channel: true },
            });
            if (!template?.isActive || template.channel !== channel) {
              throw new Error(`Match-fee reminder introduction template is missing or inactive: ${key}`);
            }
            return template.body;
          }

          '''
          s=replace_once(s,'export async function queueFixtureMatchFeeEmails(',helper+'export async function queueFixtureMatchFeeEmails(')
          for key, channel in [('match-fee-reminder-email','EMAIL'),('match-fee-reminder-sms','SMS')]:
              start=s.index('templateKey: "'+key+'"'); pos=s.index('variables: {',start)+len('variables: {')
              indent='              ' if channel=='EMAIL' else '          '
              s=s[:pos]+'\n'+indent+'reminderIntro: await getFixtureMatchFeeReminderIntro("'+channel+'", schedule.hoursAfterKickoff),'+s[pos:]
          p.write_text(s)
          p=Path('src/app/(admin)/admin/fixtures/publish-actions.ts');s=p.read_text()
          s=replace_once(s,'publish: "success" | "none" | "error";','publish: "success" | "none" | "error" | "partial";')
          start=s.index('  for (const fixture of unpublishedFixtures) {',s.index('async function publishAndEmailFixtureBatch'))
          end=s.index('  revalidatePath("/admin/fixtures");',start)
          body=s[start:end].rstrip()
          s=s[:start]+'''  // Publication has committed. A later setup failure must not masquerade as
            // an unpublished fixture or cause an unsafe full-publication retry.
            let postPublishSetupFailed = false;
            try {
          '''+'\n'.join('  '+line if line else '' for line in body.split('\n'))+'''
            } catch (error) {
              postPublishSetupFailed = true;
              console.error("Fixture publication saved; subsequent setup incomplete", {
                leagueId: input.leagueId,
                fixtureIds: unpublishedFixtures.map((fixture) => fixture.id),
                error,
              });
            }

          '''+s[end:]
          s=replace_once(s,'    publish: "success",\n    leagueId: input.leagueId,','    publish: postPublishSetupFailed ? "partial" : "success",\n    leagueId: input.leagueId,')
          p.write_text(s)
          p=Path('src/app/(admin)/admin/fixtures/page.tsx');s=p.read_text()
          s=replace_once(s,'  if (publish === "success") {','''  if (publish === "partial") {
              return {
                tone: "error",
                message: `${formatCount(published, "fixture")} published for ${scopeLabel}, but fee or notification setup did not finish. Your fixtures remain published and any messages already queued have been kept. Do not republish or regenerate these fixtures. Check System Templates and delivery status before recovering missing items.`,
              };
            }

            if (publish === "success") {''')
          p.write_text(s)
          p=Path('src/app/api/admin/fixtures/publish-one/route.ts');s=p.read_text()
          old='''  const stats = await queueEverythingForPublishedFixture({
              fixture,
              league: fixtureInfo.league,
            });

            return NextResponse.json({
              ok: true,
              published: true,
              fixtureId,
              ...stats,
            });'''
          # Normalise indentation in this exact final block only.
          start=s.index('  const stats = await queueEverythingForPublishedFixture({',s.index('export async function POST'))
          end=s.rindex('\n}')
          assert '...stats' in s[start:end]
          s=s[:start]+'''  try {
              const stats = await queueEverythingForPublishedFixture({
                fixture,
                league: fixtureInfo.league,
              });
              return NextResponse.json({ ok: true, published: true, fixtureId, ...stats });
            } catch (error) {
              console.error("Fixture publication saved; subsequent setup incomplete", { fixtureId, error });
              revalidatePath("/admin/fixtures");
              revalidatePath("/admin/payments");
              revalidatePath("/admin/night-board");
              revalidatePath(`/admin/leagues/${fixtureInfo.league.id}`);
              revalidatePath(`/admin/leagues/${fixtureInfo.league.id}/fixtures`);
              if (fixtureInfo.league.slug) {
                revalidatePath(`/leagues/${fixtureInfo.league.slug}`);
                revalidatePath(`/leagues/${fixtureInfo.league.slug}/fixtures`);
              }
              return NextResponse.json({
                ok: false,
                published: true,
                fixtureId,
                error: "The fixture is published, but fee or notification setup did not finish. Do not republish or regenerate it. Existing queued messages have been kept; check System Templates and delivery status before recovering missing items.",
              }, { status: 500 });
            }'''+s[end:]
          p.write_text(s)
          PY
          git diff --check
          git diff --stat
          git diff -- src/lib/payments/fixture-match-fees.ts 'src/app/(admin)/admin/fixtures/publish-actions.ts' 'src/app/(admin)/admin/fixtures/page.tsx' src/app/api/admin/fixtures/publish-one/route.ts
      - name: Commit native source to the fix branch only
        run: |
          test "$GITHUB_REF" = refs/heads/fix/fixture-publish-reminder-context
          git config user.name 'SIXFL maintenance'
          git config user.email 'noreply@users.noreply.github.com'
          git add src/lib/payments/fixture-match-fees.ts 'src/app/(admin)/admin/fixtures/publish-actions.ts' 'src/app/(admin)/admin/fixtures/page.tsx' src/app/api/admin/fixtures/publish-one/route.ts
          git commit -m 'Restore editable reminder context and distinguish saved publication from failed message setup'
          git push origin HEAD:refs/heads/fix/fixture-publish-reminder-context
