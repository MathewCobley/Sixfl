name: Harden player ledger sources once
on:
  push:
    branches: [feat/player-ledger-small-payments]
    paths: ['.github/workflows/harden-player-ledger-once.yml']
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/player-ledger-small-payments
      - name: Apply exact reviewed native compatibility corrections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,subprocess
          obj=json.loads(subprocess.check_output(['gh','api','repos/MathewCobley/Sixfl/git/blobs/f739eb8f0a1054ea9d131219f57be018fbe9dbbe']))
          original=base64.b64decode(obj['content']).decode()
          script=original.split("          python3 - <<'PY'\n",1)[1].split('\n          PY\n',1)[0]
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          exec(compile(script,'reviewed-player-ledger-hardening','exec'))
          PY
          git config user.name 'SIXFL source integration'
          git config user.email '262667783+MathewCobley@users.noreply.github.com'
          git add src scripts prisma tests
          git commit -m 'Preserve payment-source compatibility and prevent draft balance exposure'
          git push origin HEAD:feat/player-ledger-small-payments
