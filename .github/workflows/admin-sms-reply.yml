name: Admin SMS reply reliability
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: sms-reply-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sms-reply:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sixfl_sms_reply_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sixfl_sms_reply_test
      SMS_REPLY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sixfl_sms_reply_test
      NEXTAUTH_SECRET: isolated-sms-reply-test-only
      NEXTAUTH_URL: http://localhost:3000
      EMAIL_REPLY_DOMAIN: reply.example.test
      RESEND_API_KEY: re_isolated_test_only
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare actual production sources and isolated schema
        run: |
          set -euo pipefail
          npm run prebuild
          npx prisma generate
          node -e "const u=new URL(process.env.DATABASE_URL);if(u.hostname!=='127.0.0.1'||u.pathname!=='/sixfl_sms_reply_test')throw Error('Isolated database required')"
          npx prisma db push --skip-generate
      - name: Real PostgreSQL service and route contracts (no provider calls)
        run: |
          set -euo pipefail
          mkdir -p test-results
          node --test tests/admin-sms-reply.test.cjs 2>&1 | tee test-results/sms-database.log
      - name: Verify duplicate-protection tests detect a regression
        run: |
          set -euo pipefail
          cp src/lib/messaging/admin-sms-reply.ts /tmp/sms-reply-original.ts
          trap 'cp /tmp/sms-reply-original.ts src/lib/messaging/admin-sms-reply.ts' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/messaging/admin-sms-reply.ts')
          s=p.read_text(); assert 'if (existing) {' in s
          p.write_text(s.replace('if (existing) {', 'if (false && existing) {', 1))
          PY
          # Use a sequential repeated-send test for the deliberate failure.
          # The unmodified suite separately tests six truly concurrent retries.
          set +e
          timeout 60s node --test --test-name-pattern='lost-response retry after sent' tests/admin-sms-reply.test.cjs > test-results/negative-control.log 2>&1
          exit_code=$?
          set -e
          test "$exit_code" -eq 1
          grep -Eq 'P2002|Unique constraint failed' test-results/negative-control.log
      - name: Browser tooling isolated from application package files
        run: |
          npm install --prefix "$RUNNER_TEMP/sms-browser" --no-audit --no-fund playwright esbuild
          "$RUNNER_TEMP/sms-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Native reply UI desktop and mobile (local synthetic server only)
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/sms-browser/node_modules" node tests/admin-sms-reply.browser.cjs 2>&1 | tee test-results/sms-browser.log
      - name: Typecheck and existing feature contracts
        run: |
          set -euo pipefail
          npx tsc --noEmit
          node scripts/check-critical-feature-contracts.mjs 2>&1 | tee test-results/critical-contracts.log
          npm run audit:dom
          npm run audit:dom:changed
      - name: Production build of the fully prepared sources
        run: |
          set -euo pipefail
          # Full prebuild ran above and its outputs were tested. Do not run that
          # legacy rewriting chain twice: the unrelated captain-payment patch
          # is not idempotent after the complete chain. This still runs the real
          # build command (prisma generate && next build), without another hook.
          npm run build --ignore-scripts 2>&1 | tee test-results/production-build.log
      - name: Capture committed and prepared owning sources for final review
        if: always()
        run: |
          set -euo pipefail
          mkdir -p test-results
          node - <<'JS'
          const fs=require('node:fs'), cp=require('node:child_process'), crypto=require('node:crypto');
          const paths=['src/lib/messaging/admin-sms-reply.ts','src/lib/messaging/sms-reply-display.ts','src/lib/messaging/service.ts','src/app/api/admin/messages/sms-reply/route.ts','src/app/(admin)/admin/messages/actions.ts','src/app/(admin)/admin/messaging/page.tsx','src/components/admin/messages/AdminSmsReplyForm.tsx','src/components/admin/messages/AdminMessageThread.tsx','src/components/admin/messages/AdminMessagesInbox.tsx','scripts/apply-message-sender-attribution.cjs','tests/admin-sms-reply.test.cjs','tests/admin-sms-reply.browser.cjs','.github/workflows/admin-sms-reply.yml','docs/critical-feature-contracts.md'];
          const files=paths.map(path=>{const committed=cp.execFileSync('git',['show','HEAD:'+path],{encoding:'utf8'});const prepared=fs.readFileSync(path,'utf8');return {path,committed,prepared,unchanged:committed===prepared,committedHash:crypto.createHash('sha256').update(committed).digest('hex')};});
          const tracked=cp.execFileSync('git',['ls-files'],{encoding:'utf8'}).split('\n');
          const helpers=tracked.filter(p=>/sms-(type|repair)-workbench|author-sms-repair/.test(p));
          if(helpers.length)throw Error('Temporary authoring tools remain: '+helpers.join(','));
          fs.writeFileSync('test-results/source-review.json',JSON.stringify({head:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),helpers,files},null,2));
          JS
          git grep -n -E 'sendAdminMessageReplyAction|queueAdminSmsReply|<AdminSmsReplyForm|smsReplyStatusLabel' -- src > test-results/reply-entrypoints.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sms-reply-verification
          path: test-results/
