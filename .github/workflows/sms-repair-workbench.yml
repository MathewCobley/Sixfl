name: SMS repair source workbench
on:
  push:
    branches: [fix/admin-sms-reply-reliable-submit]
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'MathewCobley/Sixfl' && github.ref == 'refs/heads/fix/admin-sms-reply-reliable-submit'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/admin-sms-reply-reliable-submit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialise owning React and server sources, without production access
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/admin-sms-reply-reliable-submit'
          test -f scripts/author-sms-repair.cjs
          node scripts/author-sms-repair.cjs
          node - <<'JS'
          const fs = require('node:fs');
          function replace(p,b,a) { const s=fs.readFileSync(p,'utf8'); if(s.split(b).length!==2)throw Error('Expected one anchor: '+p);fs.writeFileSync(p,s.replace(b,a)); }
          replace('src/components/admin/messages/AdminMessageThread.tsx', '  const replyEmail =', '  const replyPhoneLabel = formatPhone(replyPhoneRaw);\n  const replyEmail =');
          replace('src/components/admin/messages/AdminSmsReplyForm.tsx', '      </div>\n      {record ? <div', '        {record && ["FAILED", "SKIPPED", "CANCELLED"].includes(record.status) ? <button type="button" disabled={busy || checking || uncertain} onClick={() => { save(newDraft(phone)); setRecord(null); setRecordRequestId(""); setUncertain(false); setNotice("New empty draft opened. The previous reply has not been retried."); }} className="min-h-11 rounded-xl border border-white/20 px-3 text-sm text-white disabled:opacity-50">Write another reply</button> : null}\n      </div>\n      {record ? <div');
          replace('tests/admin-sms-reply.browser.cjs', '      assert.ok(gets >= 4); assert.deepEqual(errors, []);', '      const beforeNewDraft = posts.length; await page.getByRole("button", { name: "Write another reply" }).click(); await page.getByText("New empty draft opened. The previous reply has not been retried.", { exact: true }).waitFor(); assert.equal(await field.inputValue(), ""); assert.equal(await field.getAttribute("readonly"), null); assert.equal(posts.length, beforeNewDraft);\n      assert.ok(gets >= 4); assert.deepEqual(errors, []);');
          JS
          git diff --check
          git diff --stat
          git grep -n -E 'sendAdminMessageReplyAction|<AdminSmsReplyForm|smsReplyStatusLabel' -- src
      - name: Commit integration only to fix branch; remove authoring tools
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/admin-sms-reply-reliable-submit'
          git rm scripts/author-sms-repair.cjs .github/workflows/sms-repair-workbench.yml
          git add src/lib/messaging/service.ts 'src/app/(admin)/admin/messaging/page.tsx' src/components/admin/messages/AdminMessagesInbox.tsx src/components/admin/messages/AdminMessageThread.tsx 'src/app/(admin)/admin/messages/actions.ts' src/components/admin/messages/AdminSmsReplyForm.tsx scripts/apply-message-sender-attribution.cjs docs/critical-feature-contracts.md tests/admin-sms-reply.browser.cjs
          git diff --cached --check
          git config user.name 'SIXFL SMS repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire native SMS reply form, atomic service, accurate delivery states and preserved attribution'
          git push origin HEAD:refs/heads/fix/admin-sms-reply-reliable-submit
          git rev-parse HEAD
