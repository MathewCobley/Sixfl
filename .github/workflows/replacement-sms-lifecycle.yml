name: Resolved replacement SMS cancellation
on:
  pull_request:
    paths:
      - 'src/lib/fixtures/*replacement*'
      - 'src/lib/notifications/**'
      - 'src/lib/communications/**'
      - 'prisma/migrations/20260906225000_cancel_resolved_replacement_sms/**'
      - 'tests/replacement-sms-lifecycle.test.cjs'
      - '.github/workflows/replacement-sms-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/fixtures/*replacement*'
      - 'src/lib/notifications/**'
      - 'prisma/migrations/20260906225000_cancel_resolved_replacement_sms/**'
      - 'tests/replacement-sms-lifecycle.test.cjs'
      - '.github/workflows/replacement-sms-lifecycle.yml'
permissions:
  contents: read
jobs:
  cancelled-sms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: replacement_test_only
          POSTGRES_DB: sixfl_replacement_sms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sixfl_replacement_sms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:replacement_test_only@localhost:5432/sixfl_replacement_sms_test
      REPLACEMENT_SMS_TEST_DATABASE_URL: postgresql://postgres:replacement_test_only@localhost:5432/sixfl_replacement_sms_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prebuild
      - run: npx prisma generate
      - name: Test migration, future queues, exact scope and stale worker delivery without real messages
        run: node --test tests/replacement-sms-lifecycle.test.cjs
      - name: Check existing fixture and critical features and all TypeScript
        run: |
          node scripts/check-last-minute-replacement-resolution.mjs
          node scripts/check-critical-feature-contracts.mjs
          npx tsc --noEmit
      - name: Check native callers and final source scope
        run: |
          git grep -nE 'cancelClosedReplacementSms|getReplacementSmsCancellationReason|cancelOwnedReplacementSms' -- src
          git grep -nE 'reconcileLastMinuteReplacement|reconcilePendingLastMinuteReplacements' -- src/app
          test ! -f .github/workflows/inspect-replacement-sms-once.yml
          test ! -f .github/workflows/integrate-replacement-sms-once.yml
