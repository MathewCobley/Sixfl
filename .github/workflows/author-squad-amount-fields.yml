name: Preserve exact collection amount input
on:
  push:
    branches: [fix/squad-collection-save-feedback]
    paths: [.github/workflows/author-squad-amount-fields.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/squad-collection-save-feedback
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/captain/team/[teamid]/player-payments/PaymentPageServer.tsx');s=p.read_text()
          pairs=[('                    id="amount"\n                    type="number"','                    id="amount"\n                    type="text"\n                    inputMode="decimal"'),('                    min="0.01"\n                    step="0.01"\n',''),('                            type="number"\n                            name={amountName}','                            type="text"\n                            inputMode="decimal"\n                            name={amountName}'),('                            min="0"\n                            step="0.01"\n','')]
          for old,new in pairs:
            assert s.count(old)==1,old
            s=s.replace(old,new)
          p.write_text(s)
          p=Path('tests/squad-collection-save.browser.cjs');s=p.read_text()
          old="  // Defaults/unselected controls are irrelevant if every selected amount is explicit."
          new="""  // Invalid number text must not be silently emptied by the browser and fall back to the default.
            await page.getByLabel('Amount for Player 8',{exact:true}).fill('oops');await page.getByRole('button',{name:'Save player collection',exact:true}).click();await page.getByRole('alert').filter({hasText:/fractions of a penny/}).waitFor();assert.equal(await page.evaluate(()=>window.calls.length),1);
            assert.equal(await page.getByLabel('Amount for Player 8',{exact:true}).inputValue(),'oops');
          """+old
          assert s.count(old)==1;s=s.replace(old,new);p.write_text(s)
          PY
          git rm .github/workflows/author-squad-amount-fields.yml
          git add 'src/app/captain/team/[teamid]/player-payments/PaymentPageServer.tsx' tests/squad-collection-save.browser.cjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep exact decimal input so invalid selected amounts cannot silently become defaults'
          git push origin HEAD:fix/squad-collection-save-feedback
