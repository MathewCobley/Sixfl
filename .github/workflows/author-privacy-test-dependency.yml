name: Complete privacy test isolation
on:
  push:
    branches: [fix/admin-only-payment-adjustment-visibility]
    paths: [.github/workflows/author-privacy-test-dependency.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/payment-ledger-consistency.test.cjs');s=p.read_text()
          old="    '@/lib/payments/player-ledger':{money},"
          assert s.count(old)==1
          s=s.replace(old,old+"\n    '@/lib/datetime/london':{formatDateTimeInLondon:()=> '25 Aug 2026'},")
          p.write_text(s)
          PY
          git diff --check
          test "$GITHUB_REF" = refs/heads/fix/admin-only-payment-adjustment-visibility
          git config user.name 'SIXFL maintenance'
          git config user.email 'noreply@users.noreply.github.com'
          git add tests/payment-ledger-consistency.test.cjs
          git commit -m 'Mock unrelated date formatting in standalone privacy table test'
          git push origin HEAD:refs/heads/fix/admin-only-payment-adjustment-visibility
