name: Abandonment fee override
on:
  pull_request:
    paths:
      - 'src/lib/fixtures/abandonment*'
      - 'src/lib/payments/fixture-match-fees.ts'
      - 'src/lib/payments/player-ledger.ts'
      - 'src/lib/payments/player-payment-warning.ts'
      - 'src/components/referee/Abandon*'
      - 'src/app/**/abandonment*'
      - 'src/app/**/abandonment*/**'
      - 'tests/abandonment*'
      - 'prisma/migrations/**'
      - 'prisma/schema.prisma'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/abandonment-fee-override.yml'
  workflow_dispatch:
concurrency:
  group: abandonment-fee-override-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sixfl_abandonment_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d sixfl_abandonment_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sixfl_abandonment_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prebuild
      - name: Generate client and create disposable schema
        run: npx prisma generate && npx prisma db push --skip-generate
      - name: Real PostgreSQL financial non-mutation and default-rule regressions
        run: node --test tests/abandonment-fee-override.test.cjs
      - name: Existing abandonment contracts
        run: |
          node scripts/check-fixture-abandonment-workflow.mjs
          node scripts/check-abandoned-result-decision.mjs
          node scripts/check-fixture-abandonment-runtime-resilience.mjs
          node scripts/check-fixture-abandonment-email-recovery.mjs
          node scripts/check-fixture-formal-conduct-notice.mjs
      - name: Type-check prepared application
        run: npx tsc --noEmit
      - name: Inspect final shared sources
        if: always()
        run: |
          git grep -n -E 'recordFixtureAbandonment|resendFixtureAbandonmentEmails|AbandonmentFeeDecisionFields|getFeePreservedAbandonmentIds|feeDecision' -- src/lib/fixtures src/lib/payments src/components/referee 'src/app/(public)/referee' > /tmp/abandonment-consumers.txt || true
          tar -czf /tmp/abandonment-prepared.tgz src scripts prisma tests docs .github package.json package-lock.json tsconfig.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abandonment-source-review
          path: |
            /tmp/abandonment-prepared.tgz
            /tmp/abandonment-consumers.txt
          retention-days: 3
