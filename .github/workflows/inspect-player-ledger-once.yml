name: Inspect player ledger sources once
on:
  push:
    branches: [feat/player-ledger-small-payments]
    paths: ['.github/workflows/inspect-player-ledger-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: tar -czf /tmp/player-ledger-native.tar.gz src scripts tests docs prisma .github config package.json package-lock.json tsconfig.json AGENTS.md next.config.*
      - run: npm ci
      - run: npm run prebuild
      - run: npx prisma generate
      - run: tar -czf /tmp/player-ledger-prepared.tar.gz src scripts tests docs prisma .github config package.json package-lock.json tsconfig.json AGENTS.md next.config.*
      - uses: actions/upload-artifact@v4
        with:
          name: player-ledger-sources
          path: /tmp/player-ledger-*.tar.gz
          retention-days: 1
