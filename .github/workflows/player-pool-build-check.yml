name: PlayerPool build check

on:
  push:
    branches:
      - agent/sixfl-player-pool
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sixfl
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: build-check-secret
      RESEND_API_KEY: re_build_check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        id: build
        continue-on-error: true
        run: npm run build > build.log 2>&1
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-pool-build-log
          path: build.log
          if-no-files-found: error
      - name: Show build failure
        if: steps.build.outcome == 'failure'
        run: |
          tail -n 120 build.log
          exit 1
