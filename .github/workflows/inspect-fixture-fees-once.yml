name: Inspect fixture fee sources once
on:
  push:
    branches: [fix/next-week-team-fees]
    paths: ['.github/workflows/inspect-fixture-fees-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sixfl_unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Capture source before preparation
        run: tar -czf /tmp/fee-source.tar.gz src scripts tests config docs prisma .github package.json package-lock.json tsconfig.json AGENTS.md
      - run: npm ci
      - run: npm run prebuild
      - name: Inspect all fee creation and publishing routes
        run: |
          git ls-files '*AGENTS.md'
          git grep -nE 'fixture\.(create|createMany)|INSERT INTO "Fixture"' -- src
          git grep -nE 'homeMatchFeePence|awayMatchFeePence|standardMatchFeePence' -- src/app/api/admin/fixtures/generate-next-week/route.ts 'src/app/(admin)/admin/fixtures/publish-actions.ts' src/app/api/admin/fixtures/publish-one/route.ts
          git grep -nE 'publish-tbc|fixture-team-fee|final-guard' -- scripts
          tar -czf /tmp/fee-prepared.tar.gz src scripts tests config docs prisma .github package.json package-lock.json tsconfig.json AGENTS.md
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-fee-source
          path: /tmp/fee-*.tar.gz
          retention-days: 1
