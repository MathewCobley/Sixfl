name: Goal of the Month
on:
  push:
    branches: [feat/goal-of-month-nominee-clips, main]
    paths:
      - 'src/**'
      - 'prisma/migrations/20260907153000_goal_of_month/**'
      - 'tests/goal-of-month*'
      - '.github/workflows/goal-of-month.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'prisma/migrations/20260907153000_goal_of_month/**'
      - 'tests/goal-of-month*'
      - '.github/workflows/goal-of-month.yml'
permissions:
  contents: read
concurrency:
  group: goal-of-month-${{ github.ref }}
  cancel-in-progress: true
jobs:
  monthly-goals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: goal_test_only
          POSTGRES_DB: sixfl_goal_month_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sixfl_goal_month_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:goal_test_only@localhost:5432/sixfl_goal_month_test
      GOAL_MONTH_TEST_DATABASE_URL: postgresql://postgres:goal_test_only@localhost:5432/sixfl_goal_month_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Identify all existing award owners for compatibility review
        run: |
          git grep -n -E 'Goal of the Week|GOAL OF THE WEEK|goal-of-the-week|GoalOfWeekDashboardPromo' -- src scripts tests | cut -c1-240
          git ls-files prisma/migrations | grep -Ei 'goal|community' || true
      - run: npm ci
      - run: npm run prebuild
      - run: npx prisma generate
      - run: node --test tests/goal-of-month.test.cjs
      - run: node scripts/check-critical-feature-contracts.mjs
      - run: npx tsc --noEmit
      - name: Verify monthly native owners after full prebuild
        run: |
          git grep -n 'goal-of-month\|Goal of the Month' -- src/components/goal-of-month src/components/goal-of-week/GoalOfWeekDashboardPromo.tsx src/app/api/goal-of-month src/lib/goal-of-month
