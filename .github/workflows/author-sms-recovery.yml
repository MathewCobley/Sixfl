name: Prepare native SMS receipt recovery
on:
  push:
    branches: [fix/sms-receipt-recovery]
    paths: [.github/workflows/author-sms-recovery.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/sms-receipt-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed native source edits (no production access)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          def edit(path,old,new):
              p=root/path;s=p.read_text();assert s.count(old)==1,(path,old[:100],s.count(old));p.write_text(s.replace(old,new,1))
          form='src/components/admin/messages/AdminSmsReplyForm.tsx'
          edit(form,'  if (!value) return "the next queue run";','  if (!value || !Number.isFinite(Date.parse(value))) return "the next queue run";')
          edit(form,'  const [recordRequestId, setRecordRequestId] = useState("");','''  const [recordRequestId, setRecordRequestId] = useState("");
            const [recordCheckedAt, setRecordCheckedAt] = useState<string | null>(null);
            const [recent, setRecent] = useState<SmsReplyReceipt[] | null>(null);
            const [finding, setFinding] = useState(false);
            const [recentNotice, setRecentNotice] = useState("");''')
          edit(form,'    draftRef.current = initial;\n    setDraft(initial);','''    try {
                const last = JSON.parse(sessionStorage.getItem(`${storageKey}:receipt`) || "null");
                if (last && typeof last.requestId === "string" && /^[a-zA-Z0-9_-]{16,100}$/.test(last.requestId)
                  && typeof last.checkedAt === "string" && Date.now() - Date.parse(last.checkedAt) < 24 * 60 * 60 * 1000
                  && last.record && typeof last.record.messageId === "string" && typeof last.record.body === "string"
                  && typeof last.record.status === "string") {
                  setRecord(last.record as SmsReplyReceipt);
                  setRecordRequestId(last.requestId);
                  setRecordCheckedAt(last.checkedAt);
                  setNotice("Your last saved reply has been restored. Check status for its latest progress; it has not been resent.");
                }
              } catch { /* Recent replies can still be recovered from the server without browser storage. */ }
              draftRef.current = initial;
              setDraft(initial);''')
          edit(form,'    setRecord(saved);\n    setRecordRequestId(requestId);','''    // Persist the acknowledgement before replacing the submitted draft. React
              // state alone is lost on a reload or when another conversation is selected.
              const checkedAt = new Date().toISOString();
              try { sessionStorage.setItem(`${storageKey}:receipt`, JSON.stringify({ requestId, checkedAt, record: saved })); } catch { /* Server-side recent history remains available. */ }
              setRecord(saved);
              setRecordRequestId(requestId);
              setRecordCheckedAt(checkedAt);''')
          edit(form,'  async function submit(event: FormEvent<HTMLFormElement>) {','''  async function findRecentReplies() {
              if (finding || busy || !actorId) return;
              setFinding(true);
              setRecentNotice("Checking recorded SMS replies…");
              try {
                const response = await fetch(`${ENDPOINT}?${new URLSearchParams({ threadId, recent: "1" })}`, {
                  cache: "no-store", credentials: "same-origin", redirect: "error", signal: AbortSignal.timeout(20000),
                });
                const data = await response.json();
                if (!response.ok || !data.ok || !Array.isArray(data.records)) throw new Error(data.error || "Recorded replies could not be checked. Nothing has been resent.");
                if (!alive.current) return;
                setRecent(data.records as SmsReplyReceipt[]);
                setRecentNotice(data.records.length ? "Latest recorded administrator SMS replies in this conversation (up to 10 from the last seven days). This check has not sent or retried anything."
                  : "No recorded administrator SMS replies were found in this conversation in the last seven days. This does not establish what happened to a missing submission. Nothing has been resent.");
              } catch (error) {
                if (alive.current) setRecentNotice(error instanceof Error ? error.message : "Recorded replies could not be checked. Nothing has been resent.");
              } finally { if (alive.current) setFinding(false); }
            }

            async function submit(event: FormEvent<HTMLFormElement>) {''')
          edit(form,'    if (inFlight.current || !draftRef.current || !canReply || !actorId || uncertain) return;','''    if (inFlight.current) return; // Ignore repeated clicks on the same in-flight request.
              if (!draftRef.current) { setNotice("The reply form is still loading. No reply has been submitted."); return; }
              if (!actorId) { setNotice("Please sign in as an administrator before sending. Your draft is kept."); return; }
              if (!canReply) { setNotice("This conversation cannot receive an SMS reply. Check its contact number and open status. Your draft is kept."); return; }
              if (uncertain) { setNotice("Check the previous attempt's status before retrying. Your draft is kept."); return; }''')
          edit(form,'save(newDraft(phone)); setRecord(null); setRecordRequestId(""); setUncertain(false);','save(newDraft(phone)); try { sessionStorage.removeItem(`${storageKey}:receipt`); } catch { /* No send. */ } setRecord(null); setRecordRequestId(""); setRecordCheckedAt(null); setUncertain(false);')
          edit(form,'        <div className="font-semibold text-white">{smsReplyStatusLabel(record.status, record.providerStatus)}</div>','''        <div className="font-semibold text-white">{smsReplyStatusLabel(record.status, record.providerStatus)}</div>
                  {recordCheckedAt ? <p className="text-xs text-white/60">Last checked {queueTime(recordCheckedAt)}. Use Check status for the latest result.</p> : null}
                  <p className="break-all text-xs text-white/60">Reply reference: {record.messageId}</p>''')
          edit(form,'      <p className="text-xs text-white/45">A queued reply is saved, not yet delivered. Check status only reads its progress and never sends another copy.</p>','''      <div className="space-y-3 border-t border-white/10 pt-4">
                  <button type="button" onClick={findRecentReplies} disabled={finding || busy || !actorId}
                    className="min-h-11 rounded-xl border border-white/20 px-3 text-sm text-white disabled:opacity-50">
                    {finding ? "Checking recorded replies…" : "Find recent SMS replies"}
                  </button>
                  {recentNotice ? <p role="status" className="text-sm text-white/70">{recentNotice}</p> : null}
                  {recent?.map(reply => <div key={reply.messageId} className="space-y-2 rounded-xl border border-white/10 p-3 text-sm">
                    <div className="font-semibold text-white">{smsReplyStatusLabel(reply.status, reply.providerStatus)}</div>
                    {reply.createdAt ? <p className="text-xs text-white/60">Recorded {queueTime(reply.createdAt)}</p> : null}
                    <p className="whitespace-pre-wrap break-words text-white/75">{reply.body}</p>
                    {reply.failureReason ? <p className="text-amber-200">{reply.failureReason}</p> : null}
                    <p className="break-all text-xs text-white/60">Reply reference: {reply.messageId}</p>
                    {reply.dispatchId ? <a href={`/admin/queue?q=${encodeURIComponent(reply.dispatchId)}`} className="inline-block text-emerald-200 underline">View recorded reply in Queue</a> : null}
                  </div>)}
                </div>
                <p className="text-xs text-white/45">A queued reply is saved, not yet delivered. Status and recent-history checks only read records and never send another copy.</p>''')
          service='src/lib/messaging/admin-sms-reply.ts'
          edit(service,'export type SmsReplyReceipt = {\n  messageId: string;','export type SmsReplyReceipt = {\n  createdAt?: string;\n  messageId: string;')
          edit(service,'    messageId: entry.id, dispatchId: entry.notificationDispatchId,','    createdAt: entry.createdAt.toISOString(),\n    messageId: entry.id, dispatchId: entry.notificationDispatchId,')
          edit(service,'export async function queueAdminSmsReply(input: SmsReplyInput): Promise<SmsReplyReceipt> {','''/** Lost browser references are not a dead end. An administrator can read the
           * latest recorded manual SMS replies in this exact thread, including attempts
           * made by another administrator. No queue, repair or provider calls occur. */
          export async function readRecentAdminSmsReplies(threadId: string): Promise<SmsReplyReceipt[]> {
            await actorId();
            validateIdentity({ threadId, requestId: "recent-sms-history" });
            const entries = await prisma.messageEntry.findMany({
              where: { threadId, channel: "SMS", direction: "OUTBOUND", participantRole: "ADMIN",
                createdAt: { gte: new Date(Date.now() - 7 * 24 * 60 * 60 * 1000) } },
              orderBy: [{ createdAt: "desc" }, { id: "desc" }], take: 10, include: receiptInclude,
            });
            return entries.map(receipt);
          }

          export async function queueAdminSmsReply(input: SmsReplyInput): Promise<SmsReplyReceipt> {''')
          edit(service,'  return prisma.$transaction(async (tx) => {','''  // Trace identifiers only, after authentication/validation. Never log the
            // message body, phone number, session, or provider credentials.
            console.info("[admin-sms-reply]", { event: "request_received", threadId: input.threadId, requestId: input.requestId });
            const saved = await prisma.$transaction(async (tx) => {''')
          edit(service,'  }, { maxWait: 10000, timeout: 15000 });\n}', '''  }, { maxWait: 10000, timeout: 15000 });
            console.info("[admin-sms-reply]", { event: "reply_recorded", threadId: input.threadId, requestId: input.requestId,
              messageId: saved.messageId, dispatchId: saved.dispatchId, status: saved.status });
            return saved;
          }''')
          route='src/app/api/admin/messages/sms-reply/route.ts'
          edit(route,'queueAdminSmsReply, readAdminSmsReply, SmsReplyError','queueAdminSmsReply, readAdminSmsReply, readRecentAdminSmsReplies, SmsReplyError')
          edit(route,'export async function GET(request: NextRequest) {\n  try {','''export async function GET(request: NextRequest) {
            try {
              if (request.nextUrl.searchParams.get("recent") === "1") {
                const records = await readRecentAdminSmsReplies(request.nextUrl.searchParams.get("threadId") || "");
                return NextResponse.json({ ok: true, records }, { headers });
              }''')
          page='src/app/(admin)/admin/messages/page.tsx'
          edit(page,'import { requireAdmin } from "@/lib/requireAdmin";','import { requireAdmin } from "@/lib/requireAdmin";\nimport { getAdminSmsReplyTarget } from "@/lib/messaging/admin-sms-reply";')
          edit(page,'  await requireAdmin();','  const { user: replyActor } = await requireAdmin();')
          edit(page,'  return (\n    <div className="w-full', '  const smsReplyTarget = fallbackThread ? await getAdminSmsReplyTarget(fallbackThread) : null;\n\n  return (\n    <div className="w-full')
          edit(page,'                    id: fallbackThread.id,','                    id: fallbackThread.id,\n                    smsReplyPhone: smsReplyTarget?.phone ?? null,\n                    smsReplyActorId: replyActor?.id ?? "",')
          edit(page,'                            id: message.dispatch.id,','''                            id: message.dispatch.id,
                                      status: message.dispatch.status,
                                      failureReason: message.dispatch.failureReason,
                                      scheduledFor: message.dispatch.scheduledFor?.toISOString() ?? null,
                                      sentAt: message.dispatch.sentAt?.toISOString() ?? null,''')
          browser='tests/admin-sms-reply.browser.cjs'
          edit(browser,"if (req.method() === 'GET') { gets++; return route.fulfill({ contentType: 'application/json', body: JSON.stringify({ ok: true, record: stored }) }); }", "if (req.method() === 'GET') { gets++; return route.fulfill({ contentType: 'application/json', body: JSON.stringify(new URL(req.url()).searchParams.get('recent')==='1' ? {ok:true,records:stored?[stored]:[]} : { ok: true, record: stored }) }); }")
          edit(browser,"      // Refresh reads genuine dispatch state, does not send again.",'''      // Regression: the former form discarded its only receipt/reference on a
                // reload or conversation switch even though the server had saved it.
                await page.reload(); await page.getByText('Your last saved reply has been restored. Check status for its latest progress; it has not been resent.', {exact:true}).waitFor();
                assert.equal(await field.inputValue(),''); assert.equal(posts.length,1);
                await page.getByRole('link',{name:'View this reply in Queue',exact:true}).waitFor();
                await page.evaluate(()=>window.show('thread-two')); await page.waitForTimeout(80);
                assert.equal(await page.getByRole('link',{name:'View this reply in Queue',exact:true}).count(),0);
                await page.evaluate(()=>window.show('thread-one','admin-two')); await page.waitForTimeout(80);
                assert.equal(await page.getByRole('link',{name:'View this reply in Queue',exact:true}).count(),0);
                await page.evaluate(()=>window.show()); await page.getByRole('link',{name:'View this reply in Queue',exact:true}).waitFor();
                assert.equal(posts.length,1);
                // Refresh reads genuine dispatch state, does not send again.''')
          edit(browser,'      assert.ok(gets >= 4); assert.deepEqual(errors, []);','''      // Lost tab storage/reference: a bounded server lookup still finds recorded
                // replies. It must not mutate the next draft or issue another POST.
                await field.fill('Next draft must be kept');
                await page.getByRole('button',{name:'Find recent SMS replies',exact:true}).click();
                await page.getByRole('link',{name:'View recorded reply in Queue',exact:true}).waitFor();
                assert.equal(await field.inputValue(),'Next draft must be kept'); assert.equal(posts.length,beforeNewDraft);
                stored=null; await page.getByRole('button',{name:'Find recent SMS replies',exact:true}).click();
                await page.getByText(/No recorded administrator SMS replies were found/).waitFor();
                assert.equal(posts.length,beforeNewDraft); assert.equal(await field.inputValue(),'Next draft must be kept');
                assert.ok(gets >= 6); assert.deepEqual(errors, []);''')
          p=root/'tests/admin-sms-reply.test.cjs';s=p.read_text();s+='''

          test('lost-reference history is authenticated, bounded, thread-specific and read-only', async () => {
            const saved=await queue();
            const historyRequest=()=>new NextRequest('https://app.example.test/api/admin/messages/sms-reply?'+new URLSearchParams({threadId:thread.id,recent:'1'}));
            const other=await raw.messageThread.create({data:{contactName:'Other thread',channel:'SMS'}});
            const copy={threadId:thread.id,channel:'SMS',direction:'OUTBOUND',participantRole:'ADMIN',body:'Synthetic history record',createdByUserId:actor};
            await raw.messageEntry.createMany({data:[
              {...copy,id:'history-other',threadId:other.id},
              {...copy,id:'history-old',createdAt:new Date(Date.now()-8*86400000)},
              {...copy,id:'history-inbound',direction:'INBOUND'},
              {...copy,id:'history-system',participantRole:'SYSTEM'},
              {...copy,id:'history-email',channel:'EMAIL'},
            ]});
            const before=JSON.stringify([await raw.messageEntry.findMany(),await raw.notificationDispatch.findMany()]);
            const response=await route.GET(historyRequest());assert.equal(response.status,200);assert.match(response.headers.get('cache-control'),/no-store/);
            const data=await response.json();assert.deepEqual(data.records.map(r=>r.messageId),[saved.messageId]);assert.ok(data.records[0].createdAt);
            assert.equal(JSON.stringify([await raw.messageEntry.findMany(),await raw.notificationDispatch.findMany()]),before);
            await raw.messageEntry.createMany({data:Array.from({length:12},(_,i)=>({...copy,id:'history-recent-'+i}))});
            assert.equal((await (await route.GET(historyRequest())).json()).records.length,10);
            authorised=false;assert.equal((await route.GET(historyRequest())).status,401);
          });

          test('both inbox routes retain reply identity and recent-history diagnostics after preparation',()=>{
            for(const name of ['messaging','messages']){
              const source=fs.readFileSync(path.join(root,`src/app/(admin)/admin/${name}/page.tsx`),'utf8');
              assert.match(source,/smsReplyActorId: replyActor/);assert.match(source,/smsReplyPhone: smsReplyTarget/);
              assert.match(source,/status: message\\.dispatch\\.status/);
            }
            const source=fs.readFileSync(path.join(root,'src/components/admin/messages/AdminSmsReplyForm.tsx'),'utf8');
            assert.match(source,/:receipt/);assert.match(source,/Find recent SMS replies/);
            assert.match(source,/Reply reference:/);assert.match(source,/Last checked/);
          });
          ''';p.write_text(s)
          p=root/'docs/critical-feature-contracts.md';s=p.read_text();s+='''

          ### SMS reply receipt recovery

          A saved SMS acknowledgement and request reference must survive a reload and returning to the conversation, not just a failed-send draft. The last checked status is dated and is never described as a new delivery confirmation. Browser storage remains per administrator and per thread. A read-only, authenticated recent-history GET retrieves up to ten manual outbound SMS entries from the exact conversation in the last seven days even when the browser reference has been lost. It never repairs, requeues or calls the provider. Both inbox entry routes pass authenticated reply identity and the real queue status to the shared native form. Trace logging contains only request/thread/message/dispatch identifiers and saved status; no phone numbers, message text or credentials. New browser and real PostgreSQL tests preserve duplicates, lost responses, separate actors/threads, opt-outs and quiet hours.

          These safeguards address verified receipt-loss and recovery gaps. They do not assert that an untraced historical reply was delivered or replay it. Deployment/startup and historical provider delivery remain separate verification steps.
          ''';p.write_text(s)
          PY
          git diff --check
          git diff --stat
          test "$GITHUB_REF" = refs/heads/fix/sms-receipt-recovery
          git config user.name 'SIXFL maintenance'
          git config user.email 'noreply@users.noreply.github.com'
          git add src/components/admin/messages/AdminSmsReplyForm.tsx src/lib/messaging/admin-sms-reply.ts src/app/api/admin/messages/sms-reply/route.ts 'src/app/(admin)/admin/messages/page.tsx' tests/admin-sms-reply.browser.cjs tests/admin-sms-reply.test.cjs docs/critical-feature-contracts.md
          git commit -m 'Preserve SMS reply receipts and add authenticated read-only recovery without a browser reference'
          git push origin HEAD:refs/heads/fix/sms-receipt-recovery
