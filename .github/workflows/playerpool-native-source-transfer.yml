name: Prepare native PlayerPool owner files
on:
  push:
    branches: [maintenance/playerpool-native-source-transfer]
permissions:
  contents: write
jobs:
  prepare-blobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4982718c5017733b542227ab6c5fcca5691f9b6e
          persist-credentials: false
      - name: Store one native owner correction; no source writers or refs deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, json, hashlib
          p='src/app/(admin)/admin/player-pool/page.tsx'
          source=Path(p).read_text()
          before='type ProfileRow = {\n  id: string;\n  leadId: string | null;\n  prospectId: string;'
          after='type ProfileRow = {\n  id: string;\n  prospectId: string;\n  leadId: string | null;'
          assert source.count(before)==1
          source=source.replace(before,after)
          before='        profile."id",\n        profile."leadId",\n        profile."prospectId",'
          after='        profile."id",\n        profile."prospectId",\n        profile."leadId",'
          assert source.count(before)==1
          source=source.replace(before,after)
          response=subprocess.run(['gh','api','--method','POST','repos/MathewCobley/Sixfl/git/blobs','--input','-'],input=json.dumps({'content':source,'encoding':'utf-8'}),capture_output=True,text=True,check=True)
          sha=json.loads(response.stdout)['sha']
          raw=source.encode(); assert sha==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          data=[{'path':p,'mode':'100644','type':'blob','sha':sha}]
          Path('/tmp/playerpool-owner-files.json').write_text(json.dumps(data))
          print(json.dumps(data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: playerpool-owner-file-manifest
          path: /tmp/playerpool-owner-files.json
          retention-days: 2
