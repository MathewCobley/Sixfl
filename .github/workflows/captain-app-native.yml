name: Captain app native UI

on:
  pull_request:
    paths:
      - "src/app/captain/team/**"
      - "src/components/captain/CaptainApp*.tsx"
      - "src/components/captain/CaptainApp*.module.css"
      - "src/components/captain/CaptainPwa*.tsx"
      - "src/lib/captain/app-navigation.ts"
      - "src/components/messaging/PortalChat.tsx"
      - "src/lib/portal-messaging.ts"
      - "src/app/api/player/team/**/chat-unread/**"
      - "src/components/news/LatestNews.tsx"
      - "src/components/news/NewsCard.tsx"
      - "tests/captain-pwa-dashboard.test.cjs"
      - "tests/captain-app/**"
      - ".github/workflows/captain-app-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: captain-app-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://invalid:invalid@127.0.0.1:65432/unused
      NEXTAUTH_SECRET: captain-app-native-test-only
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      RESEND_API_KEY: re_nonfunctional_captain_app_placeholder
      EMAIL_FROM: SIXFL <noreply@example.invalid>
      EMAIL_REPLY_DOMAIN: example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Native captain UI and rendered behaviour
        run: node --test tests/captain-pwa-dashboard.test.cjs tests/captain-app/behaviour.test.cjs tests/captain-app/fixtures-contract.test.cjs tests/captain-app/chat.test.cjs
      - name: Prepare production source
        run: npm run prebuild
      - name: Prepared captain UI and rendered behaviour
        run: node --test tests/captain-pwa-dashboard.test.cjs tests/captain-app/behaviour.test.cjs tests/captain-app/chat.test.cjs
      - run: npx prisma generate
      - run: node scripts/check-critical-feature-contracts.mjs
      - run: npx tsc --noEmit
      - run: npx next build
      - name: Install browser tooling without changing application dependencies
        run: npm install --prefix "$RUNNER_TEMP/captain-browser" --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: node "$RUNNER_TEMP/captain-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check phone and tablet component layouts
        run: NODE_PATH="$RUNNER_TEMP/captain-browser/node_modules" node tests/captain-app/browser.cjs
      - name: Chat tab and live unread badge without production requests
        run: NODE_PATH="$RUNNER_TEMP/captain-browser/node_modules" node tests/captain-app/chat-browser.cjs
      - name: Capture prepared Chat navigation and source inventory
        if: always()
        run: |
          mkdir -p artifacts/captain-app
          git grep -n -E 'CaptainPwaBottomNav|getCaptainAppSection|getPortalChatUnreadCount|label: "Inbox"|SIXFL inbox' -- src scripts tests > artifacts/captain-app/chat-source-inventory.txt
          tar -czf artifacts/captain-app/chat-source.tgz src/lib/captain/app-navigation.ts src/components/captain/CaptainPwaBottomNav.tsx 'src/app/captain/team/[teamid]/chat/page.tsx' 'src/app/captain/team/[teamid]/more/page.tsx' 'src/app/api/player/team/[teamid]/chat-unread/route.ts' tests/captain-app/chat*.cjs tests/captain-app/behaviour.test.cjs tests/captain-pwa-dashboard.test.cjs
      - name: Upload captain app layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captain-app-layouts-${{ github.sha }}
          path: artifacts/captain-app/
          if-no-files-found: warn
          retention-days: 14
