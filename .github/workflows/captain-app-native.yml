name: Captain app native UI

on:
  pull_request:
    paths:
      - "src/app/captain/team/[teamid]/**"
      - "src/components/captain/CaptainApp*.tsx"
      - "src/components/captain/CaptainPwa*.tsx"
      - "src/components/news/LatestNews.tsx"
      - "src/components/news/NewsCard.tsx"
      - "tests/captain-pwa-dashboard.test.cjs"
      - ".github/workflows/captain-app-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: captain-app-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DATABASE_URL: postgresql://invalid:invalid@127.0.0.1:65432/unused
      NEXTAUTH_SECRET: captain-app-native-test-only
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      RESEND_API_KEY: re_nonfunctional_captain_app_placeholder
      EMAIL_FROM: SIXFL <noreply@example.invalid>
      EMAIL_REPLY_DOMAIN: example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Native captain app contracts
        run: node --test tests/captain-pwa-dashboard.test.cjs
      - name: Prepare production source
        run: npm run prebuild
      - name: Prepared captain app contracts
        run: node --test tests/captain-pwa-dashboard.test.cjs
      - run: npx prisma generate
      - run: npx tsc --noEmit
