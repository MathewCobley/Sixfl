name: Finalize native lead decline regression wiring
on:
  push:
    branches: [fix/team-lead-decline-stop-chasing]
    paths: [.github/workflows/finalize-lead-decline-tests.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/team-lead-decline-stop-chasing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve existing reply tests and finish the scoped legacy guard
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          function edit(file, before, after) {
            const text = fs.readFileSync(file, 'utf8');
            if (text.split(before).length !== 2) throw new Error('Expected one anchor: ' + file);
            fs.writeFileSync(file, text.replace(before, after));
          }
          edit('tests/lead-communication-evidence.test.cjs',
            "    '@/components/admin/leads/LeadReplyEvidence': { default: ReplyPanel, __esModule: true },",
            "    // The decision panel is exercised by the separate decline suite; retain every reply assertion here.\n    '@/components/admin/leads/TeamLeadDecisionPanel': { default: () => null, __esModule: true },\n    '@/components/admin/leads/LeadReplyEvidence': { default: ReplyPanel, __esModule: true },");
          edit('src/app/(admin)/admin/leads/team-confirmation-bulk-action.ts',
            'await prisma.interestLead.update({\n          where: { id: lead.id },',
            'await prisma.interestLead.updateMany({\n          where: { id: lead.id, status: LeadStatus.NEW },');
          const file = 'src/app/(admin)/admin/leads/[id]/actions.ts';
          edit(file, '"use server";', '"use server";\n\nimport { getTeamLeadChaseBlockReason } from "@/lib/leads/team-lead-chases";');
          edit(file, '    await resend.emails.send({',
            '    // Fixed-purpose registration links must also respect a decline on the legacy direct-email path.\n    if (ctaUrlKey === TEAM_PLACE_CONFIRMATION_CTA_KEY) {\n      const stopped = await getTeamLeadChaseBlockReason({ sourceType: "LEAD_TEAM_CONFIRMATION", sourceId: lead.id });\n      if (stopped) return { ok: false, error: stopped };\n    }\n    await resend.emails.send({');
          const tests = 'tests/team-lead-decline.test.cjs';
          fs.appendFileSync(tests, String.raw`
          
          for (const channel of ['EMAIL', 'SMS']) for (const mode of ['template', 'direct']) {
            test('actual ' + mode + ' queue blocks declined ' + channel + ' and preserves normal recipient checks', async () => {
              const created = [];
              const recipient = {
                id: 'synthetic-recipient', email: 'test@example.test', phone: '+447700900123',
                isSuppressed: false, transactionalEmailOptIn: true, transactionalSmsOptIn: true,
                marketingEmailOptIn: false, marketingSmsOptIn: false,
                preferences: { emailEnabled: true, smsEnabled: true, marketingEmailEnabled: false, marketingSmsEnabled: false },
              };
              const template = { id: 'synthetic-template', key: 'team-place-confirmation-email', kind: 'TRANSACTIONAL', channel, audience: 'LEAD', subject: 'Isolated test', body: 'Isolated registration request', isActive: true, ctaLabel: null, ctaUrlKey: null };
              const runtimeDb = {
                $queryRaw: query => db.$queryRaw(query),
                notificationTemplate: { findUnique: async () => template },
                notificationRecipient: { findUnique: async () => recipient },
                notificationDispatch: { create: async ({data}) => { const row = { id: 'created-' + created.length, ...data }; created.push(row); return row; } },
              };
              const service = loadTs('src/lib/notifications/service.ts', {
                '@/lib/prisma': { prisma: runtimeDb },
                './recipients': { getNotificationRecipientById: async () => recipient },
                '@/lib/fixtures/publishing': { getUnpublishedFixtureBlockReason: async () => null },
                '@/lib/fixtures/replacement-sms-lifecycle': { getReplacementSmsCancellationReason: async () => null },
                '@/lib/referees/evening-policy': { isLegacyRefereeNotice: () => false },
                '@/lib/resend/client': { getEmailReplyDomain: () => 'example.test' },
              });
              const queue = () => mode === 'template'
                ? service.queueNotificationFromTemplate({ ...reference, recipientId: recipient.id, templateKey: template.key })
                : service.queueDirectNotification({ ...reference, recipientId: recipient.id, channel, audience: 'LEAD', subject: template.subject, body: template.body });
              recipient.isSuppressed = true;
              assert.equal((await queue()).status, 'SKIPPED');
              recipient.isSuppressed = false;
              assert.equal((await queue()).status, 'QUEUED');
              await decline();
              const stopped = await queue();
              assert.equal(stopped.status, 'CANCELLED');
              assert.equal(stopped.failureReason, policy.TEAM_LEAD_STOP_REASON);
              assert.equal(created.length, 3);
            });
          }
          `);
          JS
      - name: Inspect native edits and remove this one-time workflow
        run: |
          git diff --check
          git diff --stat
          git rm .github/workflows/finalize-lead-decline-tests.yml
          git add src tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Verify real queue declines and preserve reply layout coverage'
          git push origin HEAD:refs/heads/fix/team-lead-decline-stop-chasing
