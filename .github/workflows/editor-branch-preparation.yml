name: Prepare native editor changes on feature branch
on:
  pull_request:
    paths:
      - scripts/prepare-editor-branch.cjs
      - .github/workflows/editor-branch-preparation.yml
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/template-referral-and-italics'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply reviewed edits to native source (never to main)
        run: node scripts/prepare-editor-branch.cjs
      - name: Source inventory for remaining CTA consumers
        run: |
          git grep -n -E 'function .*Cta|function .*CTA|ctaUrlKey ===|urlKey ===|ALLOWED_CTA_URL_KEYS|type .*CtaUrl' -- src || true
      - name: Commit native source changes to this feature branch only
        run: |
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if ! git diff --cached --quiet; then
            git commit -m 'Add native referral-page CTA and italic editor formatting'
            git push origin HEAD:refs/heads/feat/template-referral-and-italics
          fi
