name: Integrate native report badge
on:
  push:
    branches: [feature/admin-team-match-report-badge]
    paths: [.github/workflows/report-badge-integrate.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feature/admin-team-match-report-badge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-team-match-report-badge
      - name: Apply tested native source patch and remove temporary tooling
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          encoded = ''''''
          Path('/tmp/report-badge.patch').write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          git apply --check /tmp/report-badge.patch
          git apply --index /tmp/report-badge.patch
          git rm .github/workflows/report-badge-integrate.yml
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add native admin match-report activity badges and regression coverage'
          git push origin HEAD:feature/admin-team-match-report-badge
