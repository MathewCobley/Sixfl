name: Team-focused payment copy (temporary)
on:
  push:
    branches: [fix/team-focused-payment-summary]
    paths: [.github/workflows/team-focused-copy-once.yml]
permissions:
  contents: write
jobs:
  native-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/team-focused-payment-summary
      - name: Inspect wording and update only the owning team summary
        run: |
          echo '=== WHOLE REPOSITORY WORDING SEARCH ==='
          git grep -nF 'Future fixture payment links' -- ':!.github/workflows/team-focused-copy-once.yml' || true
          echo '=== TEAM PAYMENT OWNERS ==='
          git grep -nE 'ledger.outstandingPence|Due now|Match fees are due on match day' -- src/app src/components | head -70 || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/captain/team/[teamid]/payments/page.tsx')
          s=p.read_text()
          old_title='            Due now\n'
          old_copy='Match fees are due on match day. Future fixture payment links are still available for teams who want to pay early.'
          assert s.count(old_title)==1
          assert s.count(old_copy)==1
          for other in Path('src').rglob('*'):
              if other.is_file() and other.suffix in ('.ts','.tsx','.js','.jsx') and other != p:
                  assert old_copy not in other.read_text(), f'Additional owner requires review: {other}'
          s=s.replace(old_title,'            Your team’s balance due\n')
          s=s.replace(old_copy,'Your team’s match fees are due on match day. Once any earlier balance is cleared, you can pay for upcoming fixtures in advance.')
          p.write_text(s)
          PY
          git diff --check
          git diff -- 'src/app/captain/team/[teamid]/payments/page.tsx'
          git config user.name 'SIXFL automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/captain/team/[teamid]/payments/page.tsx'
          git rm .github/workflows/team-focused-copy-once.yml
          git commit -m 'Address the team directly in the payment balance summary'
          git push origin HEAD:fix/team-focused-payment-summary
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify the actual prepared page retains the team-focused copy and balance
        run: |
          npm run prebuild
          node scripts/check-critical-feature-contracts.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/app/captain/team/[teamid]/payments/page.tsx').read_text()
          title='Your team’s balance due'
          copy='Your team’s match fees are due on match day. Once any earlier balance is cleared, you can pay for upcoming fixtures in advance.'
          assert s.count(title)==1
          assert s.count(copy)==1
          assert '{formatMoney(ledger.outstandingPence)}' in s[s.index(title):s.index(copy)]
          assert 'Future fixture payment links are still available for teams' not in s
          assert 'paymentOrder.decision(entry.chargeId)' in s
          assert 'const canPayOnline = paymentDecision.allowed' in s
          print('PASS: prepared native copy, original ledger value and payment-order controls retained.')
          PY
          echo '=== POST-PREBUILD OLD WORDING SEARCH ==='
          git grep -nF 'Future fixture payment links' -- src scripts || true
          echo '=== POST-PREBUILD TEAM COPY ==='
          git grep -nF 'Your team’s' -- 'src/app/captain/team/[teamid]/payments/page.tsx' || true
