name: Apply reviewed Veo source on development branch
on:
  push:
    branches: [feature/veo-fixture-confirmation-options]
    paths: [.github/workflows/veo-materialize-source.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'MathewCobley/Sixfl' && github.ref == 'refs/heads/feature/veo-fixture-confirmation-options'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Validate exact source patch and apply native files
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = c0b79a4bd177fd80525dba9661b2d58f2d2ddfb5
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          data=''.join(pathlib.Path(f'.veo-transfer/part-{i}.b64').read_text().strip() for i in range(1,9))
          patch=gzip.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='a8b0f316510443824e3b29f2c5e0212fe34cd2c5c1ff9dd91b722c29f215f62f', 'Source checksum mismatch; no changes applied'
          pathlib.Path('/tmp/veo-native.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/veo-native.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/veo-native.patch'],check=True)
          # CI configuration is applied separately through the connected GitHub
          # writer. This job only commits native application, test and doc files.
          subprocess.run(['git','reset','HEAD','--','.github/workflows/veo-priority.yml'],check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==24, paths
          assert all(p.startswith(('src/','tests/veo-priority/','prisma/migrations/20260912140000_veo_fixture_choices/','docs/veo-fixture-confirmation.md')) for p in paths),paths
          print('Verified native changed files:', '\n'.join(paths))
          PY
          git config user.name 'SIXFL development'
          git config user.email 'development@sixfl.co.uk'
          git commit -m 'Add native per-fixture Veo choices, shared camera decisions and separate optional charges'
          git push origin HEAD:refs/heads/feature/veo-fixture-confirmation-options
      - name: Record committed source for verification
        run: |
          git rev-parse HEAD
          git diff HEAD^ HEAD --stat
          git ls-tree -r HEAD > /tmp/veo-committed-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: veo-committed-tree
          path: /tmp/veo-committed-tree.txt
          retention-days: 1
