name: Temporary matchweek workspace
on:
  push:
    branches: [feature/openai-matchweek-drafts]
    paths: [.github/workflows/matchweek-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle repository source and installed dependencies only
        run: |
          tar -czf /tmp/matchweek-workspace.tar.gz src prisma scripts tests config docs .github package.json package-lock.json tsconfig.json next-env.d.ts next.config.ts postcss.config.mjs eslint.config.mjs AGENTS.md ENGINEERING.md DEV_RULES.md node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: matchweek-workspace
          path: /tmp/matchweek-workspace.tar.gz
          retention-days: 1
