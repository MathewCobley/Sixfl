name: Multi-captain fixture notifications

on:
  pull_request:
    paths:
      - "src/lib/notifications/team-operational-recipients.ts"
      - "src/lib/fixtures/confirmation-emails.ts"
      - "src/lib/fixtures/confirmation-reminders.ts"
      - "src/lib/notifications/team-contacts.ts"
      - "src/lib/notifications/team-captain-contact-sync.ts"
      - "prisma/migrations/20260911203000_backfill_captain_contact_phones/**"
      - "scripts/check-multi-captain-fixture-notifications.mjs"
      - ".github/workflows/multi-captain-fixture-notifications.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multi-captain-fixtures-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  multi-captain-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare final production source
        run: npm run prebuild
      - run: npx prisma generate
      - name: Check all-captain fixture communications
        run: node scripts/check-multi-captain-fixture-notifications.mjs
      - name: Type check
        run: npx tsc --noEmit
