name: Inspect first-match sources once
on:
  push:
    branches: [fix/first-match-ready-email]
    paths: ['.github/workflows/inspect-first-match-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: tar -czf /tmp/first-match-native.tar.gz src scripts tests docs prisma .github config package.json package-lock.json tsconfig.json AGENTS.md
      - run: npm ci
      - run: npm run prebuild
      - run: tar -czf /tmp/first-match-prepared.tar.gz src scripts tests docs prisma .github config package.json package-lock.json tsconfig.json AGENTS.md
      - uses: actions/upload-artifact@v4
        with:
          name: first-match-sources
          path: /tmp/first-match-*.tar.gz
          retention-days: 1
