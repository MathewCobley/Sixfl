          old='''    paymentSummary: input.paymentSummary,
            });
            const scheduledFor = resolveScheduledFor({ channel: input.channel, scheduledFor: input.scheduledFor });'''
          new='''    paymentSummary: input.paymentSummary,
            });
            const unresolvedEmailReason = getUnresolvedEmailPlaceholderReason({ channel: input.channel, ...rendered });
            if (unresolvedEmailReason) throw new Error(unresolvedEmailReason);
            const scheduledFor = resolveScheduledFor({ channel: input.channel, scheduledFor: input.scheduledFor });'''
          s=once(s,old,new); p.write_text(s)
          p=Path('src/lib/notifications/processor.ts'); s=p.read_text()
          s=once(s,'import { NotificationChannel } from "@prisma/client";','import { NotificationChannel } from "@prisma/client";\nimport { getUnresolvedEmailPlaceholderReason } from "./renderer";')
          s=once(s,'      const cancellationReason =\n        unpublishedFixtureBlockReason ??','      const cancellationReason =\n        getUnresolvedEmailPlaceholderReason(dispatch) ??\n        unpublishedFixtureBlockReason ??')
