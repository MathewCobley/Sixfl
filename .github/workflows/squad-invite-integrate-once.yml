          git config user.email 'noreply@github.com'
          git add src/lib/managed-squad/prospectJoinConfirmation.ts src/app/api/admin/player-prospects/change-team/route.ts src/lib/notifications/renderer.ts src/lib/notifications/service.ts src/lib/notifications/processor.ts
