name: Data health source review
on:
  push:
    branches: [fix/player-data-health-identity-review]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip HEAD -o /tmp/data-health-current-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: data-health-current-source
          path: /tmp/data-health-current-source.zip
          retention-days: 2
