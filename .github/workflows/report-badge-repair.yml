name: Verify native report badge patch
on:
  push:
    branches: [feature/admin-team-match-report-badge]
    paths: [.github/workflows/report-badge-repair.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feature/admin-team-match-report-badge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-team-match-report-badge
      - name: Verify and apply only product source with the job's contents permission
        run: |
          python3 - <<'PY'
          import base64, zlib, re, hashlib
          from pathlib import Path
          source = Path('.github/workflows/report-badge-integrate.yml').read_text()
          encoded = re.search("encoded = '''(.*?)'''", source, re.S).group(1)
          encoded = encoded.replace('70XIjoYcIpGW', '70XIjoYIpGW').replace('jKRenEPnbPP9hCt', 'jKRenEPnbP9hCt')
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '573ea0147e272b44f401d2300c93e181d05f854ab085308629534801edc64ee1'
          fixed = ''
          for block in patch.decode().split('diff --git ')[1:]:
              head, rest = block.split('\n', 1)
              if '.github/' in head:
                  continue
              mode = 'new file mode 100644\n' if rest.startswith('--- /dev/null\n') else 'deleted file mode 100644\n' if '\n+++ /dev/null\n' in '\n' + rest else ''
              fixed += 'diff --git ' + head + '\n' + mode + rest
          Path('/tmp/report-badge.patch').write_text(fixed)
          PY
          git apply --check /tmp/report-badge.patch
          git apply --index /tmp/report-badge.patch
          test -z "$(git diff --cached --name-only -- .github)"
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add native admin match-report activity badges and regression coverage'
          git push origin HEAD:feature/admin-team-match-report-badge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-badge-verified-patch
          path: /tmp/report-badge.patch
          retention-days: 1
