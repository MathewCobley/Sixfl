name: PlayerPool profile reminders

on:
  pull_request:
    paths:
      - "src/lib/player-pool/profile-reminders.ts"
      - "src/lib/player-pool/response-check.ts"
      - "src/app/api/admin/player-pool/**"
      - "src/components/admin/player-pool/**"
      - "src/app/(admin)/admin/player-pool/page.tsx"
      - "prisma/migrations/20260912183000_player_pool_response_check/**"
      - "scripts/check-player-pool-profile-reminders.mjs"
      - ".github/workflows/player-pool-profile-reminders.yml"
  workflow_dispatch:

concurrency:
  group: player-pool-profile-reminders-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile-reminders:
    name: Preserve PlayerPool profile reminder workflow
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sixfl
      NEXTAUTH_SECRET: player-pool-reminder-ci-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      RESEND_API_KEY: re_player_pool_reminder_ci_placeholder
      EMAIL_FROM: SIXFL <noreply@sixfl.test>
      EMAIL_REPLY_DOMAIN: replies.sixfl.test
      CRON_SECRET: player-pool-reminder-ci-cron-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply production source preparation
        run: npm run prebuild

      - name: Check PlayerPool profile reminders
        run: node scripts/check-player-pool-profile-reminders.mjs

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Type-check application source
        run: npx tsc --noEmit

      - name: Build the production application
        run: npx next build
