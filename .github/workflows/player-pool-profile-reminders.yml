name: PlayerPool profile reminders

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  profile-reminders:
    name: Preserve PlayerPool profile reminder workflow
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sixfl

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply production source preparation
        run: npm run prebuild

      - name: Check PlayerPool profile reminders
        run: node scripts/check-player-pool-profile-reminders.mjs

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Type-check application source
        run: npx tsc --noEmit
