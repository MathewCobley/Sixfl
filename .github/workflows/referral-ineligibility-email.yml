name: Referral eligibility update email
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: referral-ineligibility-email-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sixfl_referral_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sixfl_referral_test
      REFERRAL_TEST_DATABASE: '1'
      NEXTAUTH_SECRET: referral-email-isolated-test
      NEXTAUTH_URL: http://127.0.0.1:3100
      EMAIL_REPLY_DOMAIN: replies.example.invalid
      RESEND_API_KEY: re_isolated_not_real
      STRIPE_SECRET_KEY: sk_test_isolated_not_real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/referral-ineligibility-email/*.test.cjs
      - run: npm run prebuild && npx prisma generate
      - run: node --test tests/referral-ineligibility-email/*.test.cjs tests/referral-eligibility/*.test.cjs tests/email-preview-isolation.test.cjs
      - name: Disposable schema and actual migrations
        run: |
          npx prisma db push --skip-generate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260805002000_team_referral_rewards/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260825162500_team_referral_payout_details/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260819232000_fixture_abandonment_workflow/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260912193000_referral_ineligibility/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260912203000_referral_ineligibility_email/migration.sql
      - name: Actual template queue, privacy, recipient, rollback and duplicate tests
        run: npx tsx tests/referral-ineligibility-email/database.ts
      - name: Prepared full typecheck and production build
        run: npx tsc --noEmit && npx next build
      - name: Install isolated browser
        run: npm install --prefix /tmp/referral-browser --no-package-lock playwright@1.55.0 && /tmp/referral-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Real save and catch-up controls
        run: |
          REFERRAL_PLAYWRIGHT=/tmp/referral-browser/node_modules/playwright node tests/referral-eligibility/browser.cjs
          REFERRAL_PLAYWRIGHT=/tmp/referral-browser/node_modules/playwright node tests/referral-ineligibility-email/browser.cjs
          REFERRAL_PLAYWRIGHT=/tmp/referral-browser/node_modules/playwright node tests/referral-ineligibility-email/layout-browser.cjs
      - name: Reproduce the post-render width restriction and verify the native admin shell
        run: REFERRAL_PLAYWRIGHT=/tmp/referral-browser/node_modules/playwright node tests/referral-ineligibility-email/admin-shell-browser.cjs
      - name: Preserve real email preview isolation
        run: EMAIL_PREVIEW_PLAYWRIGHT_MODULE=/tmp/referral-browser/node_modules/playwright node --test tests/email-preview-isolation.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: referral-ineligibility-email-evidence
          path: artifacts/referral-ineligibility-email/
          retention-days: 7
