name: Save verified native ledger source
on:
  push:
    branches: [fix/consistent-player-fixture-ledger]
    paths: [.github/workflows/author-ledger-source-only.yml]
permissions:
  contents: write
jobs:
  save:
    if: github.ref == 'refs/heads/fix/consistent-player-fixture-ledger'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Repeat exact source authoring already verified in run 34468357287
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          filename='.github/workflows/author-ledger-cap-compat.yml'
          assert subprocess.check_output(['git','hash-object',filename],text=True).strip()=='770c5e8af00dffba48994d4a2c61b887e2cc5ed9'
          workflow=Path(filename).read_text()
          code=workflow.split("python3 - <<'PY'\n",1)[1].split('\n          PY\n',1)[0]
          exec(compile(textwrap.dedent(code),filename,'exec'))
          PY
          git diff --check
          git add scripts/apply-player-match-fee-cap.cjs scripts/apply-modern-payment-script-compatibility.cjs scripts/apply-waiver-payment-ui-consistency.cjs 'src/app/captain/team/[teamid]/player-payments/PaymentPageServer.tsx' tests/payment-ledger-consistency.test.cjs
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --stat
          git config user.name 'SIXFL maintenance'
          git config user.email 'noreply@users.noreply.github.com'
          git commit -m 'Use canonical cap presentation and preserve recoverable waivers without legacy boost rewrites'
          git push origin HEAD:refs/heads/fix/consistent-player-fixture-ledger
