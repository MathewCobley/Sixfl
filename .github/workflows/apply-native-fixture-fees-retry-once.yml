name: Apply native fee sources only
on:
  push:
    branches: [fix/next-week-team-fees]
    paths: ['.github/workflows/apply-native-fixture-fees-retry-once.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/next-week-team-fees
      - name: Apply the reviewed source transformation without workflow changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/apply-native-fixture-fees-once.yml').read_text()
          block=text.split("          python3 - <<'PY'\n",1)[1].split('\n          PY\n',1)[0]
          lines=[line[10:] for line in block.splitlines()]
          lines=[line for line in lines if not line.startswith("change('.github/workflows/")]
          exec(compile('\n'.join(lines),'reviewed-native-fee-change','exec'))
          PY
          git diff --check
          git config user.name 'SIXFL maintenance'
          git config user.email 'maintenance@sixfl.co.uk'
          git add src scripts docs
          git diff --cached --stat
          git commit -m 'Preserve team fees natively from next-week generation through publishing'
          git push origin HEAD:refs/heads/fix/next-week-team-fees
