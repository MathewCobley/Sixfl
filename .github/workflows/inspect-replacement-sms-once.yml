name: Inspect replacement SMS lifecycle (temporary)
on:
  push:
    branches: [fix/cancel-resolved-replacement-sms]
    paths: [.github/workflows/inspect-replacement-sms-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source only; never send messages or read live secrets
        run: |
          cat AGENTS.md
          cat docs/critical-feature-contracts.md
          echo '=== MESSAGE OWNERS ==='
          git grep -n -E 'night-board-last-minute-replacement|reconcileLastMinuteReplacement|reconcilePendingLastMinuteReplacements|sendSmsWithTwilio|markNotificationDispatchCancelled' -- src scripts tests
          echo '=== DISPATCH SCHEMA ==='
          sed -n '/^model NotificationDispatch {/,/^}/p' prisma/schema.prisma
          sed -n '/^model NotificationAttempt {/,/^}/p' prisma/schema.prisma
          sed -n '/^model MessageEntry {/,/^}/p' prisma/schema.prisma
          echo '=== RESOLUTION SCHEMA ==='
          cat prisma/migrations/20260818170000_last_minute_replacement_resolution/migration.sql
          echo '=== PROCESSOR TEST LOADERS ==='
          git grep -n -E "notifications/(service|processor)|fromTemplate" -- tests | head -100
