name: Prepare native announcement feedback
on:
  push:
    branches: [fix/announcement-queue-feedback]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/announcement-queue-feedback
      - name: Edit the owning files once
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          function once(s, a, b) { if (s.split(a).length !== 2) throw new Error('Missing or repeated anchor: ' + a.slice(0,100)); return s.replace(a,b); }
          const service = 'src/lib/notifications/service.ts';
          let s = fs.readFileSync(service,'utf8');
          let start = s.indexOf('async function createNonQueuedDirectDispatch(');
          let end = s.indexOf('export async function queueNotificationFromTemplate(', start);
          let block = s.slice(start,end);
          block = once(block, '}) {', '}, db: NotificationDb = prisma) {');
          block = once(block, 'prisma.notificationDispatch.create(', 'db.notificationDispatch.create(');
          block = once(block, 'return applySmsShortLinks(dispatch);', 'return applySmsShortLinks(dispatch, db);');
          s = s.slice(0,start) + block + s.slice(end);
          start = s.indexOf('export async function queueDirectNotification(');
          end = s.indexOf('export async function getDueNotificationDispatches(', start);
          block = s.slice(start,end);
          block = once(block, 'input: QueueDirectNotificationInput)', 'input: QueueDirectNotificationInput, db: NotificationDb = prisma)');
          block = once(block, 'const recipient = await getNotificationRecipientById(input.recipientId);', 'const recipient = db === prisma ? await getNotificationRecipientById(input.recipientId) : await db.notificationRecipient.findUnique({ where: { id: input.recipientId }, include: { preferences: true } });');
          block = once(block, 'prisma.notificationDispatch.create(', 'db.notificationDispatch.create(');
          block = once(block, 'return applySmsShortLinks(dispatch);', 'return applySmsShortLinks(dispatch, db);');
          const callEnd = 'createdByUserId: input.createdByUserId,\n    });';
          if (block.split(callEnd).length !== 3) throw new Error('Expected two non-queued direct paths');
          block = block.replaceAll(callEnd, 'createdByUserId: input.createdByUserId,\n    }, db);');
          s = s.slice(0,start) + block + s.slice(end);
          fs.writeFileSync(service,s);
          const page = 'src/app/(admin)/admin/messaging/announcements/page.tsx';
          s = fs.readFileSync(page,'utf8');
          s = once(s, '  getAnnouncementAlreadyQueuedEmails,\n','');
          s = once(s, 'import { sendSystemAnnouncementAction } from "./actions";', 'import AnnouncementSendPanel from "@/components/admin/communications/AnnouncementSendPanel";\nimport { getAnnouncementProgress, getAnnouncementAudienceKey } from "@/lib/communications/announcement-queue";');
          s = once(s, '  const alreadyQueuedEmails = announcementSourceId\n    ? await getAnnouncementAlreadyQueuedEmails(announcementSourceId)\n    : new Set<string>();', '  const initialProgress = announcementSourceId ? await getAnnouncementProgress(announcementSourceId, audience) : null;\n  const audienceKey = getAnnouncementAudienceKey(audience);');
          s = once(s, '  const alreadyCount = audience.filter((person) =>\n    alreadyQueuedEmails.has(person.email),\n  ).length;', '  const alreadyCount = initialProgress?.recorded ?? 0;');
          s = once(s, 'Already queued / sent', 'Recorded recipients');
          s = once(s, 'For this saved announcement revision', 'At page load; includes skipped or failed outcomes');
          s = once(s, '<strong>Announcement processed.</strong>', '<strong>Queueing request completed.</strong>');
          start = s.indexOf('            <form action={sendSystemAnnouncementAction}');
          end = s.indexOf('            </form>', start);
          if (start < 0 || end < 0) throw new Error('Missing owning announcement form');
          end += '            </form>'.length;
          s = s.slice(0,start) + '            {announcementSourceId && initialProgress ? <AnnouncementSendPanel\n              key={`${announcementSourceId}:${audienceKey}`}\n              review={{ templateId: selectedTemplate.id, sourceId: announcementSourceId, audienceKey }}\n              initialProgress={initialProgress}\n              compatible={Boolean(compatibility?.compatible)}\n            /> : null}' + s.slice(end);
          fs.writeFileSync(page,s);
          const lib = 'src/lib/communications/announcement-queue.ts';
          s = fs.readFileSync(lib,'utf8');
          s = once(s, 'r."email")))))', 'r."email"))))');
          fs.writeFileSync(lib,s);
          JS
          git diff --check
          git diff --stat
      - name: Commit native changes and remove this temporary workflow
        run: |
          git rm .github/workflows/prepare-announcement-feedback.yml
          git add src
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire native announcement progress and queue-only transactional submission'
          git push origin HEAD:refs/heads/fix/announcement-queue-feedback
