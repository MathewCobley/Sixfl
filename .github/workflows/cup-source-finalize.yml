name: Finalize reviewed cup source
on:
  push:
    branches: [feature/cup-invitations-reporting]
    paths: [.github/workflows/cup-source-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.ref == 'refs/heads/feature/cup-invitations-reporting'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cup-invitations-reporting
      - name: Apply the reviewed shared-source edits and verify exact file hashes
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def change(path, old, new):
            p=Path(path); s=p.read_text()
            assert s.count(old)==1, (path,old,s.count(old))
            p.write_text(s.replace(old,new))
          p='src/app/captain/team/[teamid]/layout.tsx'
          s=Path(p).read_text();Path(p).write_text('import CupInvitationNotice from "@/components/cups/CupInvitationNotice";\n'+s)
          change(p,'        { href: `/captain/team/${teamid}/results-history`, label: "Team results" },','        { href: `/captain/team/${teamid}/results-history`, label: "Team results" },\n        { href: `/captain/team/${teamid}/cup-invitations`, label: "Cup invitations" },')
          change(p,'          <CaptainSupportPanel teamId={team.id} />','          <CaptainSupportPanel teamId={team.id} />\n          {access.isCaptain && access.user ? <CupInvitationNotice teamId={team.id} userId={access.user.id} /> : null}')
          p='src/lib/current-leagues.ts';s=Path(p).read_text();start=s.index('export async function getCurrentLeagueIds(');prefix,body=s[:start],s[start:]
          body=body.replace('getCurrentLeagueIds(includeLeagueId?: string | null)','getCurrentLeagueIds(includeLeagueId?: string | null, db: Pick<typeof prisma, "$queryRaw" | "league"> = prisma)').replace('await prisma.$queryRaw','await db.$queryRaw').replace('await prisma.league.findMany','await db.league.findMany');Path(p).write_text(prefix+body)
          p='src/lib/notifications/processor.ts'
          change(p,'      const metadata = getMetadataRecord(dispatch.metadata);','''      if (dispatch.channel !== "EMAIL" && (dispatch.sourceType === "CUP_INTEREST_INVITATION" || dispatch.sourceType === "CUP_INTEREST_REMINDER")) {
                  const reason = "Cup invitations are email only.";
                  await markNotificationDispatchCancelled(dispatch.id, reason);
                  result.skipped += 1;
                  result.items.push({ dispatchId: dispatch.id, status: "skipped", channel: dispatch.channel, message: reason });
                  continue;
                }
                const metadata = getMetadataRecord(dispatch.metadata);'''.replace('\n          ','\n'))
          change(p,'        const sendResult = await sendEmailWithResend({','''        const cupBlock = dispatch.sourceType === "CUP_INTEREST_INVITATION" || dispatch.sourceType === "CUP_INTEREST_REMINDER"
                    ? await (await import("@/lib/cups/invitation-delivery")).cupInvitationDeliveryBlock(dispatch)
                    : null;
                  if (cupBlock) {
                    await markNotificationDispatchCancelled(dispatch.id, cupBlock);
                    result.skipped += 1;
                    result.items.push({ dispatchId: dispatch.id, status: "skipped", channel: dispatch.channel, message: cupBlock });
                    continue;
                  }
                  const sendResult = await sendEmailWithResend({'''.replace('\n          ','\n'))
          p='src/lib/notifications/team-contacts.ts'
          change(p,'} from "@/lib/notifications/phone";','} from "@/lib/notifications/phone";\nimport { syncTeamCaptainPhonesFromKnownContacts } from "@/lib/notifications/team-captain-contact-sync";')
          change(p,'  teamId: string,\n): Promise<TeamContactSnapshot | null> {\n  const team = await prisma.team.findUnique({','  teamId: string,\n  options: { syncPhones?: boolean; client?: Pick<typeof prisma, "team" | "notificationRecipient"> } = {},\n): Promise<TeamContactSnapshot | null> {\n  const client = options.client ?? prisma;\n  const team = await client.team.findUnique({')
          change(p,'  const recipient = await getNotificationRecipientBySource({\n    sourceType: NotificationRecipientSourceType.TEAM,\n    sourceId: team.id,\n  });','  // Email-only previews and capability checks must never backfill phone records.\n  const { profiles: captainProfiles } = options.syncPhones === false\n    ? { profiles: new Map<string, { phone: string | null }>() }\n    : await syncTeamCaptainPhonesFromKnownContacts(team.id);\n\n  const recipient = await client.notificationRecipient.findFirst({\n    where: { sourceType: NotificationRecipientSourceType.TEAM, sourceId: team.id },\n    include: { preferences: true },\n  });')
          change(p,'  for (const member of team.members) {\n    const key = contactKey({\n      name: member.user.name,\n      email: member.user.email,','  for (const member of team.members) {\n    const memberPhone = displayPhone(captainProfiles.get(member.id)?.phone);\n    const key = contactKey({\n      name: member.user.name,\n      email: member.user.email,\n      phone: memberPhone,')
          change(p,'      email: cleanValue(member.user.email),\n      phone: null,','      email: cleanValue(member.user.email),\n      phone: memberPhone,')
          p='src/lib/notifications/team-operational-recipients.ts'
          change(p,'import { upsertTeamNotificationRecipient }','import { getTeamContactSnapshot, upsertTeamNotificationRecipient }')
          with Path(p).open('a') as f: f.write('''
          /** Read-only counterpart for previews and signed cup-link access checks. */
          export async function getTeamOperationalEmailContacts(teamId: string, db: Pick<typeof prisma, "team" | "teamMember" | "notificationRecipient"> = prisma) {
            const snapshot = await getTeamContactSnapshot(teamId, { syncPhones: false, client: db });
            if (!snapshot) return [];
            const captains = await db.teamMember.findMany({
              where: { teamId, role: TeamRole.CAPTAIN }, orderBy: { createdAt: "asc" },
              select: { userId: true, user: { select: { name: true, email: true } } },
            });
            const candidates = [
              { sourceType: "TEAM" as const, sourceId: teamId, name: snapshot.primaryContact.name || snapshot.teamName, email: snapshot.primaryContact.email },
              ...captains.map(c => ({ sourceType: "USER" as const, sourceId: c.userId, name: c.user.name || "Team captain", email: c.user.email })),
            ];
            const seen = new Set<string>();
            return candidates.flatMap(c => {
              const email = c.email?.trim().toLowerCase();
              if (!email || seen.has(email)) return [];
              seen.add(email); return [{ ...c, email }];
            });
          }
          ''' )
          p='scripts/check-cup-foundation.mjs'
          change(p,'const sidebar = read("src/components/admin/AdminSidebar.tsx");','const invitationService = read("src/lib/cups/invitations.ts");\nconst cupData = read("src/lib/cups/invitation-data.ts");\nconst entrantForm = read("src/components/cups/CupEntryForm.tsx");\nconst setupForm = read("src/components/cups/CupSetupForm.tsx");\nconst drawPage = read("src/app/(admin)/admin/cups/[id]/entrants/draw/page.tsx");\nconst sidebar = read("src/components/admin/AdminSidebar.tsx");')
          change(p,'    entrantActions.includes(\'INSERT INTO "LeagueSeasonTeam"\') &&\n    entrantActions.includes(\'ON CONFLICT ("leagueId", "teamId") DO UPDATE\') &&\n    entrantActions.includes(\'FROM "Fixture"\') &&\n    entrantActions.includes(\'SET "isActive" = false\') &&\n    !entrantActions.includes("prisma.team.update"),','    entrantActions.includes("changeCupEntry") &&\n    invitationService.includes(\'INSERT INTO "LeagueSeasonTeam"\') &&\n    invitationService.includes(\'ON CONFLICT ("leagueId","teamId") DO UPDATE\') &&\n    invitationService.includes(\'FROM "Fixture"\') &&\n    invitationService.includes(\'SET "isActive"=false\') &&\n    !entrantActions.includes("prisma.team.update") && !invitationService.includes("team.update"),')
          change(p,'    cupPage.includes(\'AND c."competitionType" = \\\'CUP\\\'\') &&\n    cupPage.includes("Next: draw and bracket"),','    cupData.includes(\'AND c."competitionType" = \\\'CUP\\\'\') &&\n    drawPage.includes("Draw not created yet") && drawPage.includes("Automatic knockout draw generation"),')
          change(p,'    cupPage.includes(\'import AdminSelect from "@/components/admin/AdminSelect"\') &&','    entrantForm.includes(\'import AdminSelect from "@/components/admin/AdminSelect"\') && setupForm.includes("AdminSelect") &&')
          change(p,'    !cupPage.includes("<select"),','    !cupPage.includes("<select") && !entrantForm.includes("<select") && !setupForm.includes("<select"),')
          p='scripts/check-native-cup-fixture-source.mjs'
          change(p,'const retired = [','files.push(...[\n  "src/lib/notifications/team-contacts.ts", "src/lib/notifications/team-operational-recipients.ts",\n  "src/lib/cups/invitation-data.ts", "src/lib/cups/invitation-policy.ts", "src/lib/cups/invitations.ts", "src/lib/cups/invitation-delivery.ts",\n  "src/app/(admin)/admin/cups/[id]/layout.tsx", "src/app/(admin)/admin/cups/[id]/invitation-actions.ts",\n  "src/app/(admin)/admin/cups/[id]/invitations/page.tsx", "src/app/(admin)/admin/cups/[id]/entrants/page.tsx", "src/app/(admin)/admin/cups/[id]/entrants/draw/page.tsx",\n  "src/components/cups/CupSetupForm.tsx", "src/components/cups/CupInvitationComposer.tsx", "src/components/cups/CupResponseForm.tsx",\n]);\nconst retired = [')
          expected={
            'src/app/captain/team/[teamid]/layout.tsx':'b1d880a2e9dd931f0a677f118762d2b02089c340',
            'src/lib/current-leagues.ts':'449d9675b9a7f6fb7bbf560a52477a7e7de7d19e',
            'src/lib/notifications/processor.ts':'c176b15606958c0d5072b014c9da4ebacfc9b880',
            'src/lib/notifications/team-contacts.ts':'a93e95a3cd48306e7b3f1f9f56adffad64757907',
            'src/lib/notifications/team-operational-recipients.ts':'de83ed8508bd04aa68ea9374c483892a968ced81',
            'scripts/check-cup-foundation.mjs':'00e34d79f52b20024299fef2dd21c22dfb991d55',
            'scripts/check-native-cup-fixture-source.mjs':'3b8e064c9376ad4241b01ca5a127e630021dd117'
          }
          for p,sha in expected.items():
            actual=subprocess.check_output(['git','hash-object',p],text=True).strip()
            assert actual==sha,(p,actual,sha)
          subprocess.run(['git','add',*expected],check=True)
      - name: Remove transport workflows and publish only the feature branch
        run: |
          git rm .github/workflows/cup-workspace-snapshot.yml .github/workflows/cup-source-finalize.yml
          git config user.name 'SIXFL source preparation'
          git config user.email 'noreply@github.com'
          git commit -m 'Complete reviewed native cup integration and remove temporary transport'
          git push origin HEAD:feature/cup-invitations-reporting
