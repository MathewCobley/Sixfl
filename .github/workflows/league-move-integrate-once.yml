name: Integrate league move scope (temporary)
on:
  push:
    branches: [fix/league-scoped-move-confirmation]
    paths: [.github/workflows/league-move-integrate-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/league-scoped-move-confirmation
      - name: Apply reviewed native edits without writing workflow configuration
        run: |
          git fetch --depth=1 origin 756b5d7c943a46e6434d6371402ac21439ec6bf5
          git show '756b5d7c943a46e6434d6371402ac21439ec6bf5:.github/workflows/league-move-integrate-once.yml' > /tmp/reviewed-native-edits.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          old=Path('/tmp/reviewed-native-edits.yml').read_text()
          script=old.split("          python3 - <<'PY'\n",1)[1].split('\n          PY\n',1)[0]
          script=textwrap.dedent(script)
          # Workflow configuration is updated separately through the connector.
          script=script.split("edit('.github/workflows/team-move-confirmation.yml'",1)[0]
          exec(compile(script,'reviewed-native-edits','exec'))
          PY
          git diff --check
          git diff --stat
          git config user.name 'SIXFL automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src prisma/schema.prisma tests
          git commit -m 'Gate native move tracker by saved League move checkbox'
          git push origin HEAD:fix/league-scoped-move-confirmation
