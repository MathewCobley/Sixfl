name: PlayerPool source review workspace
on:
  push:
    branches: [fix/playerpool-response-chase-20260912]
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Export tracked source only; no production data or credentials
        run: |
          git archive --format=tar.gz --output=/tmp/playerpool-source.tar.gz HEAD src scripts tests prisma config docs .github package.json package-lock.json tsconfig.json next.config.ts AGENTS.md
      - uses: actions/upload-artifact@v4
        with:
          name: playerpool-source-review
          path: /tmp/playerpool-source.tar.gz
          retention-days: 2
