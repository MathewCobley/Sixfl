name: Update existing privacy-aware settlement contracts
on:
  push:
    branches: [fix/admin-only-payment-adjustment-visibility]
    paths: [.github/workflows/author-privacy-compatibility.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['apply-player-match-fee-cap.cjs', 'apply-team-charge-waiver-accounting.cjs']:
              p=Path('scripts')/name
              s=p.read_text()
              old='"getPlayerSettlementBreakdown(entry)"'
              assert s.count(old)==1
              s=s.replace(old,'"getPlayerSettlementBreakdown(entry, showAdjustmentDetails)", "mayViewPaymentAdjustments(correctionAccess)"')
              p.write_text(s)
          PY
          git diff --check
          test "$GITHUB_REF" = refs/heads/fix/admin-only-payment-adjustment-visibility
          git config user.name 'SIXFL maintenance'
          git config user.email 'noreply@users.noreply.github.com'
          git add scripts/apply-player-match-fee-cap.cjs scripts/apply-team-charge-waiver-accounting.cjs
          git commit -m 'Preserve the explicit admin visibility handoff in cap and waiver preparation assertions'
          git push origin HEAD:refs/heads/fix/admin-only-payment-adjustment-visibility
