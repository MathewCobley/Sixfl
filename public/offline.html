<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>SIXFL — Offline</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0f14;
      color: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        max(24px, env(safe-area-inset-top))
        20px
        max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at top, rgba(16, 185, 129, 0.12), transparent 34%),
        #0b0f14;
    }

    main {
      width: min(100%, 430px);
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 116px;
      height: 44px;
      padding: 0 18px;
      margin-bottom: 28px;
      border: 1px solid rgba(52, 211, 153, 0.35);
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.09);
      color: #6ee7b7;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.18em;
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.045);
    }

    .icon svg {
      width: 34px;
      height: 34px;
      stroke: #a7f3d0;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #6ee7b7;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 8vw, 42px);
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    .copy {
      margin: 16px auto 0;
      max-width: 360px;
      color: rgba(248, 250, 252, 0.66);
      font-size: 16px;
      line-height: 1.55;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 15px 18px;
      border: 0;
      border-radius: 14px;
      background: #34d399;
      color: #04110c;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: default;
      opacity: 0.7;
    }

    #status {
      min-height: 20px;
      margin: 14px 0 0;
      color: rgba(248, 250, 252, 0.44);
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-label="SIXFL">SIXFL</div>

    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M5.2 15.2a9.7 9.7 0 0 1 13.6 0M8.6 18.5a4.9 4.9 0 0 1 6.8 0M12 21h.01M2 11.5a14.4 14.4 0 0 1 20 0M4 4l16 16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>

    <p class="eyebrow">Connection lost</p>
    <h1>You’re offline</h1>
    <p class="copy">
      SIXFL needs an internet connection to load the latest information.
      We’ll reconnect automatically when your connection returns.
    </p>

    <button id="retry" type="button">Try again</button>
    <p id="status" role="status" aria-live="polite">Waiting for a connection…</p>
  </main>

  <script>
    (() => {
      const retryButton = document.getElementById("retry");
      const status = document.getElementById("status");
      let checking = false;

      const setStatus = (message) => {
        status.textContent = message;
      };

      async function checkConnection({ manual = false } = {}) {
        if (checking) return;

        if (!navigator.onLine) {
          if (manual) setStatus("Still offline. We’ll keep trying.");
          return;
        }

        checking = true;
        retryButton.disabled = true;
        setStatus("Checking your connection…");

        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 4000);

        try {
          const response = await fetch(
            `/api/pwa/version?offline-check=${Date.now()}`,
            {
              cache: "no-store",
              credentials: "same-origin",
              headers: {
                "Cache-Control": "no-cache",
              },
              signal: controller.signal,
            },
          );

          if (!response.ok) {
            throw new Error("SIXFL is not reachable yet");
          }

          setStatus("Back online — reopening SIXFL…");
          window.setTimeout(() => window.location.reload(), 150);
          return;
        } catch {
          setStatus("Still offline. We’ll keep trying.");
        } finally {
          window.clearTimeout(timeout);
          checking = false;
          retryButton.disabled = false;
        }
      }

      retryButton.addEventListener("click", () => {
        void checkConnection({ manual: true });
      });

      window.addEventListener("online", () => {
        void checkConnection();
      });

      window.addEventListener("focus", () => {
        void checkConnection();
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          void checkConnection();
        }
      });

      window.setInterval(() => {
        void checkConnection();
      }, 5000);

      if (navigator.onLine) {
        window.setTimeout(() => {
          void checkConnection();
        }, 250);
      }
    })();
  </script>
</body>
</html>
