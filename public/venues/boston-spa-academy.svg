<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="694" viewBox="0 0 1170 694" role="img" aria-label="Boston Spa Academy outdoor football pitches">
  <defs>
    <linearGradient id="sixflVenueShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020617" stop-opacity="0.04"/>
      <stop offset="0.48" stop-color="#020617" stop-opacity="0.08"/>
      <stop offset="0.76" stop-color="#020617" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="sixflVenueEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="0.52" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.26"/>
    </linearGradient>
    <filter id="venueContrast" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.92" intercept="0.01"/>
        <feFuncG type="linear" slope="0.95" intercept="0.01"/>
        <feFuncB type="linear" slope="1.03" intercept="0"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <image width="1170" height="694" href="data:image/webp;base64," preserveAspectRatio="xMidYMid slice" filter="url(#venueContrast)"/>
  <rect width="1170" height="694" fill="url(#sixflVenueEdge)"/>
  <rect width="1170" height="694" fill="url(#sixflVenueShade)"/>
</svg>
